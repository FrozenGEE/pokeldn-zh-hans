"Select boosts to run together. Save them for Mom to restore after a restart." = "选择要同时运行的增益。保存后可在重启时由妈妈恢复。"
"A game boost is a change to how your game plays, such as walking through walls or a faster game. Select the boosts and send them through Mystery Gift. They start immediately and stop when you restart the game or turn off the console. To restore them later, save them in the game and send Mom's gift below." = "游戏增益会改变你游戏的玩法，例如穿墙或加快游戏速度。勾选增益并通过神秘礼物发送。它们会立即生效，并在重启游戏或关闭主机后停止。若想之后恢复，请先在游戏内保存这些增益，然后发送下方的妈妈礼物。"
"Read your Trainer ID (TID), Secret ID (SID), or your party's stats in the Session log. The TID appears on your Trainer Card; the SID is normally hidden. IVs are a Pokemon's six individual stat values, from 0 to 31. EVs are stat points gained through training. These tools keep your save and Wonder Card unchanged." = "在会话日志中读取你的训练家 ID（TID）、里ID（SID）或队伍的能力值。TID 显示在训练家卡上；SID 通常隐藏。个体值是宝可梦六项能力各自的数值，范围为 0 到 31。努力值是通过训练获得的点数。这些工具不会改动你的存档和神秘卡片。"
"Stand facing it and press A yourself. At its cry, touch no button: the game presses A by itself on a shiny frame and the battle starts. If the countdown passes 0, wait for the next one. Do not walk or battle first: a wild battle stops the presses until you send it again" = "面对它站立并自己按下 A。听到它的叫声后不要再按任何按键：游戏会在异色帧自动按下 A，战斗随即开始。若倒计时越过 0，请等待下一次。不要先走动或对战：野生对战会停止自动按键，直到你重新发送。"
"Stand in front of it. Once the map shows after the recap, tap Up once to face it, then hold B. The game presses A by itself on a shiny frame; if the countdown passes 0 with nothing, keep holding B for the next one" = "站在它面前。回顾结束后地图出现时，向上点一次以面向它，然后按住 B。游戏会在异色帧自动按下 A；若倒计时越过 0 仍无结果，请继续按住 B 等待下一次。"
". This can take a few minutes" = "。这可能需要几分钟"

