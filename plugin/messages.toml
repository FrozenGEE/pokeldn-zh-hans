# 高级选项：共享启动器旗标（--online、--keys、--capture 等）
"trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)" = "与远方的玩家交换：对方主机的报价会在这里提供，双方都收到报价后才各自确认（docs/online.md）"
"the room both players enter; default the link code, and no code meets anyone else trading online without one" = "双方玩家进入的房间；默认使用连接码，不设码则会遇到其他同样无码在线交换的玩家"
"the Switch's prod.keys; default keys_path from config/host.toml or host.local.toml" = "Switch 的 prod.keys；默认取 config/host.toml 或 host.local.toml 中的 keys_path"
"a Linux Wi-Fi card's phy (phyN), or auto; POKELDN_RADIO selects a board instead" = "Linux 无线网卡的 phy（phyN），或 auto；POKELDN_RADIO 则改为选择一块开发板"
"write every datagram here, one JSON line each" = "把每个数据报写入此文件，每行一条 JSON"
"Linux: the station interface" = "Linux：station 接口"
"Linux: the tap the host's Pia runs on" = "Linux：主机 Pia 运行所在的 tap"
"Linux: the access point interface" = "Linux：接入点接口"
"Linux: the monitor interface" = "Linux：监听接口"
"host an emulated console over ldn_mitm on the LAN; no radio and no root" = "通过 ldn_mitm 在局域网上主持一台模拟主机；无需无线网卡和 root"
"with --ip-host, the address to advertise" = "配合 --ip-host：要广播的地址"
"close the session this long after the last queued trade; by default the run keeps it until the console leaves or the time limit ends" = "最后一次排队交换后等待这么久再关闭会话；默认会一直开到主机离开或时限结束"
"leave the seat this long after the last queued trade; by default the run keeps it until the console leaves or the time limit ends" = "最后一次排队交换后等待这么久再离开座位；默认会一直坐到主机离开或时限结束"
"after each trade, trade again and offer the Pokemon the console just sent, so one that evolves by trade evolves on the console; the player offers ours back (docs/architecture.md, Trade back)" = "每次交换后再交换一次，把主机刚发来的宝可梦提供给它，通信进化的宝可梦便会在主机上进化；对方玩家也会把我们的宝可梦还回来（docs/architecture.md，换回）"
"the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "每个 --trade-offer 由哪张神秘礼物卡片生成，顺序一致：填它在 PKHeX 活动数据库中的键（pokeldn.pokemon.Service.gift_events）"
"make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)" = "在交换过程中，把每张赠送接收方自己训练家的 --gift-event 卡片，针对主机的存档重新生成：主机先报价，其存档捕捉的宝可梦给出训练家，我们的报价按它定制；其余卡片则用主机会话数据给出的训练家。两者都失败时，报价按原样发出，使用设置中的训练家（pokeldn.receiver_gift，docs/gift_simulated.md）"

# 高级选项：朱/紫 主持（sv-host / sv-raid-host）
"advertise Violet's local communication id instead of Scarlet's" = "以紫的本地通信 ID 进行广播，而不是朱的"
"advertise this local communication id" = "广播这个本地通信 ID"
"the LDN scene: 4 for a Link Trade, 7 for a Tera Raid" = "LDN 场景：4 为连接交换，7 为太晶团体战"
"the LDN participant limit; a Tera Raid advertises 4" = "LDN 参与者上限；太晶团体战广播为 4"
"the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to" = "站点的平台字节：1 是 Switch 2，两台零售主机都广播该值；0 是 Switch，也是 LDN 层的默认值"
"hex, 16 bytes; default lets the LDN layer pick" = "十六进制，16 字节；默认由 LDN 层选择"
"the LDN node name" = "LDN 节点名称"
"leave a console's Session type-3 leave request unanswered; it then resends it every 0.5 s and leaves after the fourth (docs/sv.md, Leaving)" = "不回应主机的 Session 3 型离开请求；主机随后每 0.5 秒重发一次，第四次后离开（docs/sv.md，Leaving）"
"do not answer RTT requests" = "不回应 RTT 请求"
"do not acknowledge reliable streams" = "不对可靠流发送确认"
"print every packet in and out; the --capture file keeps them either way" = "打印每个进出的数据包；无论是否打印，--capture 文件都会记录"
"seconds between the periodic bulk acks on every port the console used" = "在主机使用过的每个端口上，周期性批量确认的间隔秒数"
"answer clone clock requests, if any" = "回应克隆时钟请求（如果有）"
"the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0" = "站点列表更新中的序列号；朱主机在加入响应中为 0，此处发送 1"
"also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later" = "在发送加入响应的同时附带一份站点列表，使用该序列号；模拟的朱主机在此处发送 id 为 0 的列表，约两秒后发送第二份"
"seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s" = "Session 加入响应与站点列表更新之间的秒数；朱主机间隔约 1.5 秒"
"the message flags on the Session replies; a Scarlet host sends 0x00, this host's own default is 0x01" = "Session 回复的消息标志；朱主机发送 0x00，本工具默认为 0x01"
"the packet id in the Pia header of the Session replies; a Scarlet host's join response carries 1" = "Session 回复的 Pia 头中的数据包 id；朱主机的加入响应中为 1"
"the 41-byte Session join response a Scarlet host sends, with no route bytes, rather than Arceus's 43-byte one" = "发送朱主机的 41 字节 Session 加入响应（不含路由字节），而不是阿尔宙斯的 43 字节响应"
"the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01" = "Net 0x11 开场消息的标志；零售主机发送 0x31，本工具默认为 0x01"
"send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them" = "按此间隔发送 RTT 请求（成对主机每 410 毫秒一次）；否则主机只回应 RTT 请求"
"the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all" = "Net 0x50 的消息标志；成对主机在 0x50 和 0x11 上都发送 0x31，而本工具的 0x11 需要 0x01 才会得到回应"
"send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51" = "发送成对主机在其 0x11 之后 0.37 秒发出的 Net 0x50 属性更新消息，重传直到收到主机的 0x51"
"how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is" = "Net 0x11 携带的 21 字节站点槽数量；无论游戏的参与者上限是多少，零售主机都写 4 个"
"the Link Code the player sets, e.g. 12345678; empty for none" = "玩家设置的连接码，例如 12345678；留空表示不设"
"hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21" = "十六进制，广播中的 40 个游戏字节；搜索中的主机将其置零，被加入者连上的主机在 +0x21 处携带 648cf4"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], a reliable data message sent that many seconds after the seat; the sequence follows the port's own. A pair's host sends its 0x7c port 1 table update at nine seconds this way" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在入座后指定秒数发送的可靠数据消息；序号遵循该端口自身的序列。成对主机以这种方式在第 9 秒发送其 0x7c 端口 1 的表更新"
"a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib; by default the recorded set in pokeldn.sv.reference" = "一个 NNN.bin 记录目录，作为本主机自己的身份在 0x81 端口 0 上发送，如同成对主机发送其 46 条记录；首条带有 INITIALIZED，且每条都已是 zlib 格式；默认使用 pokeldn.sv.reference 中录制的记录集"
"the player name record 1 of our identity carries, the one the trade screen shows" = "我们身份的记录 1 所携带的玩家名字，即交换画面显示的名字"
"send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference" = "除非 --record-set 或 --send-on-open 指定了身份，否则不发送站点身份；默认发送 pokeldn.sv.reference 中录制的身份"
"seconds after the seat before the record set goes out" = "入座后延迟多少秒再发送记录集"
"bundle the record set N to a packet, each after the first with its header inherited, as a retail host's retransmit round does (docs/sv.md)" = "将记录集按每包 N 条打包，首条之后的每条继承其头部，如同零售主机的重传轮次（docs/sv.md）"
"seconds between the record packets; a retail raid host spreads its identity over about 0.13 s" = "记录数据包之间的间隔秒数；零售团体战主机将其身份分散在约 0.13 秒内发出"
"run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)" = "用站点 id 运行游戏的端口 2 开场，而非重放：在 0x80 端口 2 上发送携带本主机站点 id 的 7 型通告，并以携带主机站点 id 的 9 型消息回应它在 0x7c 端口 2 上的 3 型加入（pokeldn.sv.port2）"
"seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3" = "入座后多少秒再发送 7 型消息；成对主机约在 2.3 秒时发送"
"offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "每条记录以新的 PID 和加密常数提供，异色状态保留，这样之前收过它的存档可以再次收下"
"a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本主机提供的 348 字节记录的文件（原始字节或十六进制文本；352 字节的游戏消息会剥去头部）。指定后，本主机会用自己的报价回应主机的报价并确认，然后像成对主机一样跟随主机完成提交和四个交换步骤（pokeldn.sv.trade）。可重复：第二份及之后的记录在同一座位中提供，每次交换一份，随每次交换结束"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存前写入所提供记录的字段，使用 pokeldn.sv.pokemon 的字段名：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重复，单独的 `shiny` 会按记录自身的 id 随机出一个异色性格值"
"write the offered record's 348-byte body to this file as hex and exit, which needs no radio" = "将所提供记录的 348 字节正文以十六进制写入此文件后退出，无需无线网卡"
"a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon" = "把主机自己的报价写入此文件，即其 80 00 02 00 消息的 348 字节正文，以十六进制文本保存。其内容由 pokeldn.sv.pokemon 读取"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the console announces its own key 0x80 open on 0x7c port 1. A port-0 message sent before that open is acknowledged by the console and never reaches the game, and so is everything after it on that port; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机于 0x7c 端口 1 通告其密钥 0x80 打开后指定秒数发送。在该打开之前发出的端口 0 消息会被主机确认、却永远到不了游戏，该端口上其后的一切消息也是如此；可重复；默认为 pokeldn.sv.reference 中的身份片段"
"seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open" = "在主机密钥 0x80 打开后多少秒由本主机先报价；与 --send-on-open 相同的门控"
"seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer" = "入座后多少秒由本主机先于主机报价，如同成对主机那样；不指定时本主机回应主机的报价"
"seconds after the console's offer before the host's confirmation" = "主机报价后多少秒本主机再确认"
"host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags" = "主持太晶团体战：团体战种子，八位十六进制数；头目、其太晶属性和奖励由它与四个 --raid-* 上下文旗标决定"
"the party record our player brings to the raid, legal per PKHeX; with --raid-seed" = "我方玩家带入团体战的队伍记录，需通过 PKHeX 合法性检查；配合 --raid-seed 使用"
"a reward row in place of the seed's, in order; up to 45" = "替换种子自带奖励的奖励行，按顺序；至多 45 条"
"the story stage, which sets a standard crystal's star odds" = "剧情进度阶段，决定标准结晶的星级概率"
"a standard or a black (six-star) crystal" = "标准结晶或黑色（六星）结晶"
"host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused" = "主持活动团体战：宝可入口站新闻配信的文件夹（EventsGallery 活动或其 Files）；种子按 --raid-version 和 --raid-progress 从活动的遭遇中抽取，--raid-map 与 --raid-content 不使用"
"the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress" = "活动巢穴的配信分组，1 到 10；默认取该进度下第一个有巢穴且有遭遇的分组"
"with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)" = "配合 --raid-event：把只能捕捉一次的遭遇（每个七星团体战、波荡水、铁斑叶……）作为普通捕捉提供：捕获率正常，记录编号换成没有存档捕捉过的替身，这样抓过它的存档可以再抓一次；本来就抓不到的仍然抓不到（docs/sv_raid.md，活动团体战）"
"consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out" = "团体战等待的主机数量，1 到 3；大厅中集齐 N 台且全部准备完毕即开始，或大厅计时器耗尽时开始"
"an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)" = "团体战安插的 NPC 队友，按槽位顺序，主机空出的每个槽位一名（一台主机时 2 名，两台时 1 名，三台时没有）：Austin、Ava、Logan、Hailey、Evan、Charlotte、Kylie、Hunter、Gianna、Eli、Henry、Chase、Claire、Brooklyn、Zoe、Samantha、Dylan、Luke；主机会抽一个安插他们的队友种子，其余随机（docs/sv_raid.md，队友）"
"the unlock stage the partners come from, which sets their pool, their level being four fifths of --raid-pokemon's; by default --raid-progress's, six stars for a black crystal or a seven-star event raid" = "队友来自的解锁阶段，决定可选池，其等级为 --raid-pokemon 的五分之四；默认取 --raid-progress，黑色结晶或七星活动团体战为六星"
"serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)" = "用插件的对战服务器（NAME 或加载的第一个）从该站点主持团体战对战：主机与我们的宝可梦打一场；仅限一台主机；失败时按未指定处理，交出网络（docs/sv_raid.md，主持对战）"
"PROTO:PORT:HEX, a reliable data message to send once the console has joined (host seq 1 on that port, INITIALIZED); repeatable" = "PROTO:PORT:HEX，主机加入后发送的可靠数据消息（该端口上主机序号为 1，INITIALIZED）；可重复"

# 高级选项：朱/紫 加入（sv-join / sv-raid-join / sv-circle-join）
"join only a console searching with this Link Code; empty takes any" = "只加入以此连接码搜索的主机；留空则接受任意"
"local communication id to join, hex; default is either cartridge's" = "要加入的本地通信 ID，十六进制；默认为任一卡带的 ID"
"join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys" = "通过 ldn_mitm 经局域网加入一台模拟主机，而不是走无线网卡：无需 root、phy 或 prod.keys"
"--ip-join: the emulator's address" = "--ip-join：模拟器的地址"
"--ip-join: our own address" = "--ip-join：我们自己的地址"
"--ip-join: seconds to wait for one ldn_mitm scan answer" = "--ip-join：等待一次 ldn_mitm 扫描应答的秒数"
"seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it" = "扫描时每个频道停留的秒数；主机的开放窗口只有几秒，停留太久会错过"
"how long to keep trying" = "持续尝试的时长"
"how long to stay in one joined session before scanning again" = "在已加入的会话中停留多久再重新扫描"
"the LDN node name we publish" = "我们发布的 LDN 节点名称"
"the station platform byte we publish; 1 is what a Switch 2 sends" = "我们发布的站点平台字节；1 是 Switch 2 发送的值"
"set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back" = "关联前设置网卡的 MAC，例如 48:f1:eb:11:22:33。Pia 从 MAC 推导站点的固定 id，两台主机都是任天堂 OUI 而网卡不是。启动器中的驱动重载会恢复网卡自己的地址"
"join only a network of this LDN scene: 4 a Link Trade, 7 a Tera Raid" = "只加入该 LDN 场景的网络：4 为连接交换，7 为太晶团体战"
"join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console" = "加入主机主持的太晶团体战大厅并带上这份队伍记录，需通过 PKHeX 合法性检查；我方玩家会准备、回应开始并在对战开始时离开，其宝可梦继续为主机作战"
"seconds in the raid lobby before our player readies" = "进入团体战大厅后多少秒我方玩家准备"
"join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)" = "像加入团体战的宾客那样加入主机主持的联盟圆环：入座、发送我们的身份、打开游戏频道、回应主机的开始、把我们玩家放到主机玩家所在的位置并保持 --hold 时长（docs/sv_union_circle.md）"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "配合 --union-circle：任务完成后我方玩家离开圆环并结束运行：snacksworth 把主机缺少的每种点心传说宝可梦的组队与单人通关记录送给主机，从开始演示结束起每秒一条；bp 则送给主机一笔 --bbq-clear BP 的通关奖励"
"the BP, 1 to 9999999, --circle-task bp gives" = "--circle-task bp 赠送的 BP，1 到 9999999"
"with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it" = "配合 --union-circle：我方玩家模仿主机玩家的移动、动画和坐骑，与其保持 5 米并面向它"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "配合 --union-circle：圆环开始演示结束 10 秒后，在距主机玩家 15 到 25 米处保持 3 只该种类（dev 编号）的野生宝可梦，如同主机分享自己的野生宝可梦：被主机对战、移除或距离超过 50 米的个体会再次出现在附近"
"Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)" = "太晶属性，按属性顺序 0 一般到 17 妖精（默认 %(default)s）"
"held item id" = "携带道具 id"
"0 to 255 (default random)" = "0 到 255（默认随机）"
"1 female (default 0)" = "1 为雌性（默认 0）"
"0 to 24 (default random)" = "0 到 24（默认随机）"
"six IVs 0 to 31 (default each random, as a wild one's)" = "六项个体值，各 0 到 31（默认各自随机，与野生个体相同）"
"ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)" = "特性槽位，2 为隐藏特性（默认随机取 0 或 1，与野生个体相同）"
"the mark the spawn carries, by PKHeX's RibbonIndex (53 Lunchtime to 97 Slump; default none)" = "生成个体携带的证章，按 PKHeX 的 RibbonIndex（53 午餐到 97 消沉；默认无）"
"with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)" = "配合 --spawn：只当主机站在 PKHeX 认可该生成个体可捕捉的区域时才生成，区域由主机的主机分享的野生宝可梦推断（我方玩家靠近后它才会分享：--follow-host）"
"report what the console advertises and join nothing" = "只报告主机广播的内容，不加入任何网络"
"send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one" = "以零售版布局发送 Pia Session 加入请求（docs/sv.md，Session 加入请求）：十个协议及其版本、一个四字节 nonce、两个位置 id、一个七字节站点地址和一条玩家记录。网状加入是单播，被动抓包看不到零售版的请求"
"after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here" = "入座后，在 0x81 端口 1（我们的站点流）上发送这条 1395 字节身份记录作为游戏的数据交换，重传直到主机确认。零售加入者在此发送自己的身份"
"do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers" = "不发送克隆时钟请求。已入座的加入者会先在其他一切之前在 0x77 上发送十八个零字节，由主机回应"
"announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)" = "在 0x7c 上通告我们自己的频道表。站点通过发送对端在端口 1 发出的同款 31 字节表、端口 2 的打开以及之后每次表更新的镜像来打开游戏频道；只有我们通告之后，对端才会在端口 0 上把数据交给游戏（docs/sv.md）"
"send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference" = "在 0x81 端口 1 上按序号顺序把该目录的记录作为我们自己的发送，取代 --mirror-records，这样可以重放整套真实身份，而不是把主机的镜像回去；默认使用 pokeldn.sv.reference 中录制的记录集"
"send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed" = "把主机放到 0x81 端口 0 的每条记录按顺序在端口 1 上作为我们自己的发回。零售加入者会用自己的一套记录回应主机的记录；这里用游戏自己编写的记录来填充这套"
"seconds after the seat before the first identity record goes out" = "入座后多少秒再发出第一条身份记录"
"do not acknowledge the host's messages on the game's reliable channel 0x7c" = "不确认主机在游戏可靠频道 0x7c 上的消息"
"send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)" = "随频道表直接发送游戏在 0x7c 端口 2 上的 3 型加入，而不是等主机在 0x80 端口 2 上的 7 型通告再回应。成对的加入者会回应通告（docs/sv.md，端口 2）"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机于 0x7c 端口 1 通告密钥 0x80 打开后指定秒数发送。站点的身份是 0x7c 端口 0 上的四条消息（两个片段各两次），在通告之前从该端口发出的任何内容都到不了游戏；可重复；默认为 pokeldn.sv.reference 中的身份片段"
"a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本加入者提供的 348 字节记录的文件（原始字节或十六进制文本；352 字节的游戏消息会剥去头部）。指定后，加入者用自己的报价回应主机的报价、确认、提交，并像成对加入者一样跟随四个交换步骤（pokeldn.sv.trade）。可重复：第二份及之后的记录在同一座位中提供，每次交换一份，随每次交换结束"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存前写入所提供记录的字段，使用 pokeldn.sv.pokemon 的字段名：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重复，单独的 `shiny` 会按记录自身的 id 随机出一个异色性格值"
"a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text" = "把主机自己的报价写入此文件，即其 80 00 02 00 消息的 348 字节正文，以十六进制文本保存"
"seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer" = "在主机密钥 0x80 打开后多少秒由加入者先报价；不指定时加入者回应主机的报价"
"seconds after the host's confirmation before the joiner's own" = "主机确认后多少秒加入者再确认"
"seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind" = "主机确认后多少秒加入者提交；成对的加入者在自己确认 1.5 秒后提交，其主机也以同样方式回应"
"end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold" = "主机超过这么多秒完全没有发送任何内容时结束该座位并回到扫描。在主机开放阶段之外建立的关联不会有流量；不设此项时运行会一直占满整个 --hold 时长"
"end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold" = "在主机要求我们接管主持角色（Session 7 型）这么多秒后结束座位并回到扫描。实测中发出该请求的主机之后只发送 NetStartHostMigration；不设此项时运行会一直占座到 --hold 结束"
"hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s" = "收到主机的 NetStartHostMigration（Net 0x40）后仍保持座位。默认加入者在收到第一个时离开：主机正在销毁其网络，会重发直到所有客户端离开，最长 4 秒"
"end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s" = "入座后超过这么多秒主机仍未在 0x80 端口 2 上通告时结束座位并回到扫描。座位可以把每条流走完却始终没有通告（docs/sv.md，未解之谜）；开发板上完成交换的座位分别在 5.8 和 7.7 秒时通告"
"when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration" = "当主机在通告前把主持角色交给我们（并非玩家离开）时，离开其网络并以相同频道和连接码用 bin/sv_host.py 成为主机，如同 bin/pla_join.py；需要 --answer-migration"
"answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over" = "用 8 型确认回应主机的 7 型带主持迁移的离开，告知它我们接受其移交的主持角色"
"do not answer a Session type-5 station update with the type 6" = "不用 6 型回应 Session 5 型站点更新"
"hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)" = "入座后等待这么久再发送 Session 加入请求。WaitMember（3 到 4 秒）结束仍无人加入的主机会带着主持迁移离开，因此在它的离开等待中被接受的加入会引发 7 型消息（docs/sv.md，什么决定座位）"
"with --session-join, re-send it every N seconds (0 sends it once)" = "配合 --session-join：每 N 秒重发一次（0 表示只发一次）"
"the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)" = "加入请求中的 16 字节玩家 id：'arceus'（1 后跟 0，作为两个大端 u64，即零售阿尔宙斯声明的值）、'random'、'high'（以 0xff 开头的随机值）或 32 位十六进制数。朱主机自己的是 10047bd4a25543e057cee5c71ab1f2a2（sv18）"
"the player name in the join request's one player record; a retail console's is a single space" = "加入请求中那条玩家记录里的玩家名字；零售主机的是一个空格"
"the message flags on the join request; a joining Arceus sends 0x01, skip the source check, on every repeat of it" = "加入请求的消息标志；加入的阿尔宙斯在每次重发中都发送 0x01，跳过来源检查"
"the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own" = "加入请求数据包头中的目标变量 id：0（加入的阿尔宙斯所用），或主机自己的 id"
"answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)" = "用 0x12 确认回应主机的 Net 0x11。零售加入者不回应，而该确认会让主机转而请求主持迁移（sv08）"
"seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own" = "允许关联本身耗费的秒数；主机开放阶段在连接中途结束时，ldn.connect 会一直阻塞且自身没有超时"
"seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join" = "加入响应之后（未用 --session-join 时为入座之后）多少秒再发出十一个确认和两个流打开；零售加入者在加入 0.75 秒后打开"
"seconds between our own RTT requests (0 sends none)" = "我们自己 RTT 请求的间隔秒数（0 表示不发送）"
"answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)" = "延迟 SECONDS 秒再回应每个 RTT 请求；RTT 样本供主机的重传计时器使用（docs/sv.md）"
"acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)" = "对已经持有的记录，每条流每 SECONDS 秒至多确认一次；新记录立即确认。0 表示每次都确认（docs/sv.md）"
"ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)" = "确认收到最高 id 的下一个号，不带掩码，而不是像零售站点那样确认连续段加掩码（docs/sv.md）"
"the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body" = "我们批量确认上的 Pia 消息标志；0xa0 是两台零售站点发送的值，第 5 位压缩消息正文"
"entries in the ack payload; a retail station sends four" = "确认负载中的条目数；零售站点发送四条"
"the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header" = "可靠头部的目标位；3 会加上零售站点发送的四字节位图，0 则保留九字节头部"
"rotate every combination of --ack-flags, --ack-entries and --ack-dest-bits through the seat, one per --ack-sweep-period, and print each as it goes live. One seat then says which shape the guest parses" = "在座位中轮换 --ack-flags、--ack-entries 和 --ack-dest-bits 的每种组合，每个 --ack-sweep-period 切换一种并在生效时打印。这样一个座位就能看出对方能解析哪种形态"
"seconds each sweep variant stays live" = "每种轮换形态生效的秒数"
"seconds between the periodic bulk acks on every stream the host uses" = "在主机使用的每条流上，周期性批量确认的间隔秒数"
"send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer" = "发送到主机地址而不是 LDN 广播地址。两台零售站点都会广播每个 Pia 数据包（sv11），广播无需对端的 ARP 解析"
"print the RTT traffic too" = "也打印 RTT 流量"
"with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way" = "配合 --union-circle：也打印我们发送的每条圆环消息和区域搜索的每一步；无论是否打印，--capture 文件都会记录这些步骤"
