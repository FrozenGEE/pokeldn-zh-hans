# 高级选项：共享启动器旗标（--online、--keys、--capture 等）
"trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)" = "与远方的玩家交换：对方主机的报价会在这里提供，双方都收到报价后才各自确认（docs/online.md）"
"the room both players enter; default the link code, and no code meets anyone else trading online without one" = "双方玩家进入的房间；默认使用连接码，不设码则会遇到其他同样无码在线交换的玩家"
"the Switch's prod.keys; default keys_path from config/host.toml or host.local.toml" = "Switch 的 prod.keys；默认取 config/host.toml 或 host.local.toml 中的 keys_path"
"a Linux Wi-Fi card's phy (phyN), or auto; POKELDN_RADIO selects a board instead" = "Linux 无线网卡的 phy（phyN），或 auto；POKELDN_RADIO 则改为选择一块开发板"
"write every datagram here, one JSON line each" = "把每个数据报写入此文件，每行一条 JSON"
"Linux: the station interface" = "Linux：station 接口"
"Linux: the tap the host's Pia runs on" = "Linux：主机 Pia 运行所在的 tap"
"Linux: the access point interface" = "Linux：接入点接口"
"Linux: the monitor interface" = "Linux：监听接口"
"host an emulated console over ldn_mitm on the LAN; no radio and no root" = "通过 ldn_mitm 在局域网上主持一台模拟主机；无需无线网卡和 root"
"with --ip-host, the address to advertise" = "配合 --ip-host：要广播的地址"
"close the session this long after the last queued trade; by default the run keeps it until the console leaves or the time limit ends" = "最后一次排队交换后等待这么久再关闭会话；默认会一直开到主机离开或时限结束"
"leave the seat this long after the last queued trade; by default the run keeps it until the console leaves or the time limit ends" = "最后一次排队交换后等待这么久再离开座位；默认会一直坐到主机离开或时限结束"
"after each trade, trade again and offer the Pokemon the console just sent, so one that evolves by trade evolves on the console; the player offers ours back (docs/architecture.md, Trade back)" = "每次交换后再交换一次，把主机刚发来的宝可梦提供给它，通信进化的宝可梦便会在主机上进化；对方玩家也会把我们的宝可梦还回来（docs/architecture.md，换回）"
"the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "每个 --trade-offer 由哪张神秘礼物卡片生成，顺序一致：填它在 PKHeX 活动数据库中的键（pokeldn.pokemon.Service.gift_events）"
"make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)" = "在交换过程中，把每张赠送接收方自己训练家的 --gift-event 卡片，针对主机的存档重新生成：主机先报价，其存档捕捉的宝可梦给出训练家，我们的报价按它定制；其余卡片则用主机会话数据给出的训练家。两者都失败时，报价按原样发出，使用设置中的训练家（pokeldn.receiver_gift，docs/gift_simulated.md）"

# 高级选项：朱/紫 主持（sv-host / sv-raid-host）
"advertise Violet's local communication id instead of Scarlet's" = "以紫的本地通信 ID 进行广播，而不是朱的"
"advertise this local communication id" = "广播这个本地通信 ID"
"the LDN scene: 4 for a Link Trade, 7 for a Tera Raid" = "LDN 场景：4 为连接交换，7 为太晶团体战"
"the LDN participant limit; a Tera Raid advertises 4" = "LDN 参与者上限；太晶团体战广播为 4"
"the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to" = "站点的平台字节：1 是 Switch 2，两台零售主机都广播该值；0 是 Switch，也是 LDN 层的默认值"
"hex, 16 bytes; default lets the LDN layer pick" = "十六进制，16 字节；默认由 LDN 层选择"
"the LDN node name" = "LDN 节点名称"
"leave a console's Session type-3 leave request unanswered; it then resends it every 0.5 s and leaves after the fourth (docs/sv.md, Leaving)" = "不回应主机的 Session 3 型离开请求；主机随后每 0.5 秒重发一次，第四次后离开（docs/sv.md，Leaving）"
"do not answer RTT requests" = "不回应 RTT 请求"
"do not acknowledge reliable streams" = "不对可靠流发送确认"
"print every packet in and out; the --capture file keeps them either way" = "打印每个进出的数据包；无论是否打印，--capture 文件都会记录"
"seconds between the periodic bulk acks on every port the console used" = "在主机使用过的每个端口上，周期性批量确认的间隔秒数"
"answer clone clock requests, if any" = "回应克隆时钟请求（如果有）"
"the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0" = "站点列表更新中的序列号；朱主机在加入响应中为 0，此处发送 1"
"also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later" = "在发送加入响应的同时附带一份站点列表，使用该序列号；模拟的朱主机在此处发送 id 为 0 的列表，约两秒后发送第二份"
"seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s" = "Session 加入响应与站点列表更新之间的秒数；朱主机间隔约 1.5 秒"
"the message flags on the Session replies; a Scarlet host sends 0x00, this host's own default is 0x01" = "Session 回复的消息标志；朱主机发送 0x00，本工具默认为 0x01"
"the packet id in the Pia header of the Session replies; a Scarlet host's join response carries 1" = "Session 回复的 Pia 头中的数据包 id；朱主机的加入响应中为 1"
"the 41-byte Session join response a Scarlet host sends, with no route bytes, rather than Arceus's 43-byte one" = "发送朱主机的 41 字节 Session 加入响应（不含路由字节），而不是阿尔宙斯的 43 字节响应"
"the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01" = "Net 0x11 开场消息的标志；零售主机发送 0x31，本工具默认为 0x01"
"send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them" = "按此间隔发送 RTT 请求（成对主机每 410 毫秒一次）；否则主机只回应 RTT 请求"
"the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all" = "Net 0x50 的消息标志；成对主机在 0x50 和 0x11 上都发送 0x31，而本工具的 0x11 需要 0x01 才会得到回应"
"send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51" = "发送成对主机在其 0x11 之后 0.37 秒发出的 Net 0x50 属性更新消息，重传直到收到主机的 0x51"
"how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is" = "Net 0x11 携带的 21 字节站点槽数量；无论游戏的参与者上限是多少，零售主机都写 4 个"
"the Link Code the player sets, e.g. 12345678; empty for none" = "玩家设置的连接码，例如 12345678；留空表示不设"
"hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21" = "十六进制，广播中的 40 个游戏字节；搜索中的主机将其置零，被加入者连上的主机在 +0x21 处携带 648cf4"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], a reliable data message sent that many seconds after the seat; the sequence follows the port's own. A pair's host sends its 0x7c port 1 table update at nine seconds this way" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在入座后指定秒数发送的可靠数据消息；序号遵循该端口自身的序列。成对主机以这种方式在第 9 秒发送其 0x7c 端口 1 的表更新"
"a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib; by default the recorded set in pokeldn.sv.reference" = "一个 NNN.bin 记录目录，作为本主机自己的身份在 0x81 端口 0 上发送，如同成对主机发送其 46 条记录；首条带有 INITIALIZED，且每条都已是 zlib 格式；默认使用 pokeldn.sv.reference 中录制的记录集"
"the player name record 1 of our identity carries, the one the trade screen shows" = "我们身份的记录 1 所携带的玩家名字，即交换画面显示的名字"
"send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference" = "除非 --record-set 或 --send-on-open 指定了身份，否则不发送站点身份；默认发送 pokeldn.sv.reference 中录制的身份"
"seconds after the seat before the record set goes out" = "入座后延迟多少秒再发送记录集"
"bundle the record set N to a packet, each after the first with its header inherited, as a retail host's retransmit round does (docs/sv.md)" = "将记录集按每包 N 条打包，首条之后的每条继承其头部，如同零售主机的重传轮次（docs/sv.md）"
"seconds between the record packets; a retail raid host spreads its identity over about 0.13 s" = "记录数据包之间的间隔秒数；零售团体战主机将其身份分散在约 0.13 秒内发出"
"run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)" = "用站点 id 运行游戏的端口 2 开场，而非重放：在 0x80 端口 2 上发送携带本主机站点 id 的 7 型通告，并以携带主机站点 id 的 9 型消息回应它在 0x7c 端口 2 上的 3 型加入（pokeldn.sv.port2）"
"seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3" = "入座后多少秒再发送 7 型消息；成对主机约在 2.3 秒时发送"
"offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "每条记录以新的 PID 和加密常数提供，异色状态保留，这样之前收过它的存档可以再次收下"
"a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本主机提供的 348 字节记录的文件（原始字节或十六进制文本；352 字节的游戏消息会剥去头部）。指定后，本主机会用自己的报价回应主机的报价并确认，然后像成对主机一样跟随主机完成提交和四个交换步骤（pokeldn.sv.trade）。可重复：第二份及之后的记录在同一座位中提供，每次交换一份，随每次交换结束"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存前写入所提供记录的字段，使用 pokeldn.sv.pokemon 的字段名：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重复，单独的 `shiny` 会按记录自身的 id 随机出一个异色性格值"
"write the offered record's 348-byte body to this file as hex and exit, which needs no radio" = "将所提供记录的 348 字节正文以十六进制写入此文件后退出，无需无线网卡"
"a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon" = "把主机自己的报价写入此文件，即其 80 00 02 00 消息的 348 字节正文，以十六进制文本保存。其内容由 pokeldn.sv.pokemon 读取"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the console announces its own key 0x80 open on 0x7c port 1. A port-0 message sent before that open is acknowledged by the console and never reaches the game, and so is everything after it on that port; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机于 0x7c 端口 1 通告其密钥 0x80 打开后指定秒数发送。在该打开之前发出的端口 0 消息会被主机确认、却永远到不了游戏，该端口上其后的一切消息也是如此；可重复；默认为 pokeldn.sv.reference 中的身份片段"
"seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open" = "在主机密钥 0x80 打开后多少秒由本主机先报价；与 --send-on-open 相同的门控"
"seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer" = "入座后多少秒由本主机先于主机报价，如同成对主机那样；不指定时本主机回应主机的报价"
"seconds after the console's offer before the host's confirmation" = "主机报价后多少秒本主机再确认"
"host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags" = "主持太晶团体战：团体战种子，八位十六进制数；头目、其太晶属性和奖励由它与四个 --raid-* 上下文旗标决定"
"the party record our player brings to the raid, legal per PKHeX; with --raid-seed" = "我方玩家带入团体战的队伍记录，需通过 PKHeX 合法性检查；配合 --raid-seed 使用"
"a reward row in place of the seed's, in order; up to 45" = "替换种子自带奖励的奖励行，按顺序；至多 45 条"
"the story stage, which sets a standard crystal's star odds" = "剧情进度阶段，决定标准结晶的星级概率"
"a standard or a black (six-star) crystal" = "标准结晶或黑色（六星）结晶"
"host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused" = "主持活动团体战：宝可入口站新闻配信的文件夹（EventsGallery 活动或其 Files）；种子按 --raid-version 和 --raid-progress 从活动的遭遇中抽取，--raid-map 与 --raid-content 不使用"
"the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress" = "活动巢穴的配信分组，1 到 10；默认取该进度下第一个有巢穴且有遭遇的分组"
"with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)" = "配合 --raid-event：把只能捕捉一次的遭遇（每个七星团体战、波荡水、铁斑叶……）作为普通捕捉提供：捕获率正常，记录编号换成没有存档捕捉过的替身，这样抓过它的存档可以再抓一次；本来就抓不到的仍然抓不到（docs/sv_raid.md，活动团体战）"
"consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out" = "团体战等待的主机数量，1 到 3；大厅中集齐 N 台且全部准备完毕即开始，或大厅计时器耗尽时开始"
"an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)" = "团体战安插的 NPC 队友，按槽位顺序，主机空出的每个槽位一名（一台主机时 2 名，两台时 1 名，三台时没有）：Austin、Ava、Logan、Hailey、Evan、Charlotte、Kylie、Hunter、Gianna、Eli、Henry、Chase、Claire、Brooklyn、Zoe、Samantha、Dylan、Luke；主机会抽一个安插他们的队友种子，其余随机（docs/sv_raid.md，队友）"
"the unlock stage the partners come from, which sets their pool, their level being four fifths of --raid-pokemon's; by default --raid-progress's, six stars for a black crystal or a seven-star event raid" = "队友来自的解锁阶段，决定可选池，其等级为 --raid-pokemon 的五分之四；默认取 --raid-progress，黑色结晶或七星活动团体战为六星"
"serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)" = "用插件的对战服务器（NAME 或加载的第一个）从该站点主持团体战对战：主机与我们的宝可梦打一场；仅限一台主机；失败时按未指定处理，交出网络（docs/sv_raid.md，主持对战）"
"PROTO:PORT:HEX, a reliable data message to send once the console has joined (host seq 1 on that port, INITIALIZED); repeatable" = "PROTO:PORT:HEX，主机加入后发送的可靠数据消息（该端口上主机序号为 1，INITIALIZED）；可重复"

# 高级选项：朱/紫 加入（sv-join / sv-raid-join / sv-circle-join）
"join only a console searching with this Link Code; empty takes any" = "只加入以此连接码搜索的主机；留空则接受任意"
"local communication id to join, hex; default is either cartridge's" = "要加入的本地通信 ID，十六进制；默认为任一卡带的 ID"
"join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys" = "通过 ldn_mitm 经局域网加入一台模拟主机，而不是走无线网卡：无需 root、phy 或 prod.keys"
"--ip-join: the emulator's address" = "--ip-join：模拟器的地址"
"--ip-join: our own address" = "--ip-join：我们自己的地址"
"--ip-join: seconds to wait for one ldn_mitm scan answer" = "--ip-join：等待一次 ldn_mitm 扫描应答的秒数"
"seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it" = "扫描时每个频道停留的秒数；主机的开放窗口只有几秒，停留太久会错过"
"how long to keep trying" = "持续尝试的时长"
"how long to stay in one joined session before scanning again" = "在已加入的会话中停留多久再重新扫描"
"the LDN node name we publish" = "我们发布的 LDN 节点名称"
"the station platform byte we publish; 1 is what a Switch 2 sends" = "我们发布的站点平台字节；1 是 Switch 2 发送的值"
"set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back" = "关联前设置网卡的 MAC，例如 48:f1:eb:11:22:33。Pia 从 MAC 推导站点的固定 id，两台主机都是任天堂 OUI 而网卡不是。启动器中的驱动重载会恢复网卡自己的地址"
"join only a network of this LDN scene: 4 a Link Trade, 7 a Tera Raid" = "只加入该 LDN 场景的网络：4 为连接交换，7 为太晶团体战"
"join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console" = "加入主机主持的太晶团体战大厅并带上这份队伍记录，需通过 PKHeX 合法性检查；我方玩家会准备、回应开始并在对战开始时离开，其宝可梦继续为主机作战"
"seconds in the raid lobby before our player readies" = "进入团体战大厅后多少秒我方玩家准备"
"join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)" = "像加入团体战的宾客那样加入主机主持的联盟圆环：入座、发送我们的身份、打开游戏频道、回应主机的开始、把我们玩家放到主机玩家所在的位置并保持 --hold 时长（docs/sv_union_circle.md）"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "配合 --union-circle：任务完成后我方玩家离开圆环并结束运行：snacksworth 把主机缺少的每种点心传说宝可梦的组队与单人通关记录送给主机，从开始演示结束起每秒一条；bp 则送给主机一笔 --bbq-clear BP 的通关奖励"
"the BP, 1 to 9999999, --circle-task bp gives" = "--circle-task bp 赠送的 BP，1 到 9999999"
"with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it" = "配合 --union-circle：我方玩家模仿主机玩家的移动、动画和坐骑，与其保持 5 米并面向它"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "配合 --union-circle：圆环开始演示结束 10 秒后，在距主机玩家 15 到 25 米处保持 3 只该种类（dev 编号）的野生宝可梦，如同主机分享自己的野生宝可梦：被主机对战、移除或距离超过 50 米的个体会再次出现在附近"
"Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)" = "太晶属性，按属性顺序 0 一般到 17 妖精（默认 %(default)s）"
"held item id" = "携带道具 id"
"0 to 255 (default random)" = "0 到 255（默认随机）"
"1 female (default 0)" = "1 为雌性（默认 0）"
"0 to 24 (default random)" = "0 到 24（默认随机）"
"six IVs 0 to 31 (default each random, as a wild one's)" = "六项个体值，各 0 到 31（默认各自随机，与野生个体相同）"
"ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)" = "特性槽位，2 为隐藏特性（默认随机取 0 或 1，与野生个体相同）"
"the mark the spawn carries, by PKHeX's RibbonIndex (53 Lunchtime to 97 Slump; default none)" = "生成个体携带的证章，按 PKHeX 的 RibbonIndex（53 午餐到 97 消沉；默认无）"
"with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)" = "配合 --spawn：只当主机站在 PKHeX 认可该生成个体可捕捉的区域时才生成，区域由主机的主机分享的野生宝可梦推断（我方玩家靠近后它才会分享：--follow-host）"
"report what the console advertises and join nothing" = "只报告主机广播的内容，不加入任何网络"
"send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one" = "以零售版布局发送 Pia Session 加入请求（docs/sv.md，Session 加入请求）：十个协议及其版本、一个四字节 nonce、两个位置 id、一个七字节站点地址和一条玩家记录。网状加入是单播，被动抓包看不到零售版的请求"
"after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here" = "入座后，在 0x81 端口 1（我们的站点流）上发送这条 1395 字节身份记录作为游戏的数据交换，重传直到主机确认。零售加入者在此发送自己的身份"
"do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers" = "不发送克隆时钟请求。已入座的加入者会先在其他一切之前在 0x77 上发送十八个零字节，由主机回应"
"announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)" = "在 0x7c 上通告我们自己的频道表。站点通过发送对端在端口 1 发出的同款 31 字节表、端口 2 的打开以及之后每次表更新的镜像来打开游戏频道；只有我们通告之后，对端才会在端口 0 上把数据交给游戏（docs/sv.md）"
"send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference" = "在 0x81 端口 1 上按序号顺序把该目录的记录作为我们自己的发送，取代 --mirror-records，这样可以重放整套真实身份，而不是把主机的镜像回去；默认使用 pokeldn.sv.reference 中录制的记录集"
"send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed" = "把主机放到 0x81 端口 0 的每条记录按顺序在端口 1 上作为我们自己的发回。零售加入者会用自己的一套记录回应主机的记录；这里用游戏自己编写的记录来填充这套"
"seconds after the seat before the first identity record goes out" = "入座后多少秒再发出第一条身份记录"
"do not acknowledge the host's messages on the game's reliable channel 0x7c" = "不确认主机在游戏可靠频道 0x7c 上的消息"
"send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)" = "随频道表直接发送游戏在 0x7c 端口 2 上的 3 型加入，而不是等主机在 0x80 端口 2 上的 7 型通告再回应。成对的加入者会回应通告（docs/sv.md，端口 2）"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机于 0x7c 端口 1 通告密钥 0x80 打开后指定秒数发送。站点的身份是 0x7c 端口 0 上的四条消息（两个片段各两次），在通告之前从该端口发出的任何内容都到不了游戏；可重复；默认为 pokeldn.sv.reference 中的身份片段"
"a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本加入者提供的 348 字节记录的文件（原始字节或十六进制文本；352 字节的游戏消息会剥去头部）。指定后，加入者用自己的报价回应主机的报价、确认、提交，并像成对加入者一样跟随四个交换步骤（pokeldn.sv.trade）。可重复：第二份及之后的记录在同一座位中提供，每次交换一份，随每次交换结束"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存前写入所提供记录的字段，使用 pokeldn.sv.pokemon 的字段名：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重复，单独的 `shiny` 会按记录自身的 id 随机出一个异色性格值"
"a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text" = "把主机自己的报价写入此文件，即其 80 00 02 00 消息的 348 字节正文，以十六进制文本保存"
"seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer" = "在主机密钥 0x80 打开后多少秒由加入者先报价；不指定时加入者回应主机的报价"
"seconds after the host's confirmation before the joiner's own" = "主机确认后多少秒加入者再确认"
"seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind" = "主机确认后多少秒加入者提交；成对的加入者在自己确认 1.5 秒后提交，其主机也以同样方式回应"
"end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold" = "主机超过这么多秒完全没有发送任何内容时结束该座位并回到扫描。在主机开放阶段之外建立的关联不会有流量；不设此项时运行会一直占满整个 --hold 时长"
"end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold" = "在主机要求我们接管主持角色（Session 7 型）这么多秒后结束座位并回到扫描。实测中发出该请求的主机之后只发送 NetStartHostMigration；不设此项时运行会一直占座到 --hold 结束"
"hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s" = "收到主机的 NetStartHostMigration（Net 0x40）后仍保持座位。默认加入者在收到第一个时离开：主机正在销毁其网络，会重发直到所有客户端离开，最长 4 秒"
"end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s" = "入座后超过这么多秒主机仍未在 0x80 端口 2 上通告时结束座位并回到扫描。座位可以把每条流走完却始终没有通告（docs/sv.md，未解之谜）；开发板上完成交换的座位分别在 5.8 和 7.7 秒时通告"
"when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration" = "当主机在通告前把主持角色交给我们（并非玩家离开）时，离开其网络并以相同频道和连接码用 bin/sv_host.py 成为主机，如同 bin/pla_join.py；需要 --answer-migration"
"answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over" = "用 8 型确认回应主机的 7 型带主持迁移的离开，告知它我们接受其移交的主持角色"
"do not answer a Session type-5 station update with the type 6" = "不用 6 型回应 Session 5 型站点更新"
"hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)" = "入座后等待这么久再发送 Session 加入请求。WaitMember（3 到 4 秒）结束仍无人加入的主机会带着主持迁移离开，因此在它的离开等待中被接受的加入会引发 7 型消息（docs/sv.md，什么决定座位）"
"with --session-join, re-send it every N seconds (0 sends it once)" = "配合 --session-join：每 N 秒重发一次（0 表示只发一次）"
"the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)" = "加入请求中的 16 字节玩家 id：'arceus'（1 后跟 0，作为两个大端 u64，即零售阿尔宙斯声明的值）、'random'、'high'（以 0xff 开头的随机值）或 32 位十六进制数。朱主机自己的是 10047bd4a25543e057cee5c71ab1f2a2（sv18）"
"the player name in the join request's one player record; a retail console's is a single space" = "加入请求中那条玩家记录里的玩家名字；零售主机的是一个空格"
"the message flags on the join request; a joining Arceus sends 0x01, skip the source check, on every repeat of it" = "加入请求的消息标志；加入的阿尔宙斯在每次重发中都发送 0x01，跳过来源检查"
"the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own" = "加入请求数据包头中的目标变量 id：0（加入的阿尔宙斯所用），或主机自己的 id"
"answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)" = "用 0x12 确认回应主机的 Net 0x11。零售加入者不回应，而该确认会让主机转而请求主持迁移（sv08）"
"seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own" = "允许关联本身耗费的秒数；主机开放阶段在连接中途结束时，ldn.connect 会一直阻塞且自身没有超时"
"seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join" = "加入响应之后（未用 --session-join 时为入座之后）多少秒再发出十一个确认和两个流打开；零售加入者在加入 0.75 秒后打开"
"seconds between our own RTT requests (0 sends none)" = "我们自己 RTT 请求的间隔秒数（0 表示不发送）"
"answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)" = "延迟 SECONDS 秒再回应每个 RTT 请求；RTT 样本供主机的重传计时器使用（docs/sv.md）"
"acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)" = "对已经持有的记录，每条流每 SECONDS 秒至多确认一次；新记录立即确认。0 表示每次都确认（docs/sv.md）"
"ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)" = "确认收到最高 id 的下一个号，不带掩码，而不是像零售站点那样确认连续段加掩码（docs/sv.md）"
"the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body" = "我们批量确认上的 Pia 消息标志；0xa0 是两台零售站点发送的值，第 5 位压缩消息正文"
"entries in the ack payload; a retail station sends four" = "确认负载中的条目数；零售站点发送四条"
"the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header" = "可靠头部的目标位；3 会加上零售站点发送的四字节位图，0 则保留九字节头部"
"rotate every combination of --ack-flags, --ack-entries and --ack-dest-bits through the seat, one per --ack-sweep-period, and print each as it goes live. One seat then says which shape the guest parses" = "在座位中轮换 --ack-flags、--ack-entries 和 --ack-dest-bits 的每种组合，每个 --ack-sweep-period 切换一种并在生效时打印。这样一个座位就能看出对方能解析哪种形态"
"seconds each sweep variant stays live" = "每种轮换形态生效的秒数"
"seconds between the periodic bulk acks on every stream the host uses" = "在主机使用的每条流上，周期性批量确认的间隔秒数"
"send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer" = "发送到主机地址而不是 LDN 广播地址。两台零售站点都会广播每个 Pia 数据包（sv11），广播无需对端的 ARP 解析"
"print the RTT traffic too" = "也打印 RTT 流量"
"with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way" = "配合 --union-circle：也打印我们发送的每条圆环消息和区域搜索的每一步；无论是否打印，--capture 文件都会记录这些步骤"

# 高级选项：其他游戏
# 高级选项：剑/盾（Sword/Shield）
"`ping` content N's 10000-base holder at the 0x84 snapshot ack, before either side offers. The console's box send is gated on a ready bool at content+0x4c that only `0x010ce040` sets, on a zero result code; until then every command the game tries to send is parked in content+0x48. A parked command that does not match the next one sets the error byte +0x4d, and `0x010c9bb0` turns that into trade state 9: abort, with nothing on the application layer" = "在 0x84 快照确认时向 content N 的 10000 基址 holder 发送 `ping`，早于任何一方的报价。主机的盒子发送受 content+0x4c 处一个 ready 布尔量控制，只有 `0x010ce040` 会在结果码为零时置位；在此之前，游戏尝试发送的每条命令都停在 content+0x48。停驻的命令若与下一条不匹配，就会置位错误字节 +0x4d，`0x010c9bb0` 会把它变成交换状态 9：中止，应用层没有任何动作"
"0 is accepted" = "0 会被接受"
"0 makes the game roll one" = "0 会让游戏随机生成一个"
"0x80 (the broadcast reliable window, the default: it asks us for sequence 1 once a second) or 0x7c (the unicast one, which has never had an ack to send us because it has never had our data)" = "0x80（广播可靠窗口，默认值：它每秒向我们要一次序号 1）或 0x7c（单播窗口，它从来没有确认可发给我们，因为它从未有过我们的数据）"
"a .pk8 to put in --offer-slot in place of the snapshot's record: stored or party form, encrypted or PKHeX's decrypted export. Its OT name and ids become the snapshot's unless --offer-file-as-is. Repeatable, one per trade on the session: the console's player picks again from the box; the last serves every later trade" = "要放入 --offer-slot 以替代快照记录的一个 .pk8：存储形态或队伍形态，加密形式或 PKHeX 解密导出的形式。其 OT 名称和 ID 会成为快照的，除非指定 --offer-file-as-is。可重复，会话中每次交换一个：主机的玩家会再次从盒子中挑选；最后一个会用于之后所有交换"
"a .pokegift or 720-byte .wc8 record to send instead of building one" = "要发送的 .pokegift 或 720 字节的 .wc8 记录，而不是构建一个"
"a 3456-byte trade snapshot to send back on 0x84 once the console sends its own, or live (the default under --preset trade) for the console's own from this session. A short 2965-byte payload is inflated first. The identity is rewritten by --snapshot-name/-tid/-sid" = "一个 3456 字节的交换快照，在主机发送自己的快照后于 0x84 回发，或使用实时模式（--preset trade 下的默认值）使用本次会话中主机自己的快照。较短的 2965 字节负载会先被填充。身份信息会由 --snapshot-name/-tid/-sid 重写"
"a Dynamax Adventure (Max Lair) guest: the lobby, the paths and the battles; use with --scene 50000" = "极巨巢穴（Dynamax Adventure）访客：大厅、路线和对战；与 --scene 50000 一起使用"
"a Max Raid den guest: after the snapshot send PlayerInfo, BattleReady and SelectPokemon (the --offer-slot Pokemon); use with --scene 60006" = "极巨团体战巢穴访客：在快照之后发送 PlayerInfo、BattleReady 和 SelectPokemon（即 --offer-slot 的宝可梦）；与 --scene 60006 一起使用"
"a PK8 to place in the offered party slot, encrypted or PKHeX export. Repeatable, one per trade: the player trades again from the box, or searches again; the last serves every later trade" = "要放入所提供队伍栏位的 PK8，加密形式或 PKHeX 导出形式。可重复，每次交换一个：玩家会再次从盒子交换，或重新搜索；最后一个会用于之后所有交换"
"a reward row, item id and count; up to 15; none gives an emulated den's rows" = "一行奖励，包含道具 ID 和数量；最多 15 行；不指定则使用模拟巢穴的奖励行"
"a ribbon index; repeatable" = "缎带索引；可重复"
"a SECOND stream, on --send2-protocol, sent once the console says --send2-trigger. `60ea000012020801` is BlockDataHolder{imReady:true}, which the console says on 0x80 and waits on" = "第二条流，使用 --send2-protocol，在主机说出 --send2-trigger 后发送。`60ea000012020801` 是 BlockDataHolder{imReady:true}，主机在 0x80 上发送它并等待它"
"accept without waiting for the joiner's acceptance, as a player would; for our own joiner, which accepts after its partner" = "像玩家一样接受，而不等待加入方的接受；用于我们自己的加入方，它在伙伴之后接受"
"ACK the console's 0x84 fragments (kind 0x21, a contiguous base and a bitmask). Nothing here has ever acked this protocol, which is why the console retransmits one snapshot 19142 times and never moves on" = "确认主机的 0x84 分片（kind 0x21，一个连续基址和一个位掩码）。此前没有任何实现确认过这个协议，这就是主机把一个快照重传 19142 次却从不动向下一步的原因"
"acknowledge the 0x7C reliable window. The pass signal is the retransmits STOPPING and the sequence ids moving on" = "确认 0x7C 可靠窗口。通过的信号是重传停止且序号继续前进"
"advertise 0x00, hex; a searching Sword joins only a larger one than its own; default 0xFFFF and two random bytes" = "要广播的 0x00，十六进制；搜索中的剑只会加入比自己的值更大的；默认 0xFFFF 加两个随机字节"
"after answering an RPC pair, send BOTH members again with the clock advanced by this much. The console advances its own pair's clock by 2 each burst (b41c, b61c, b81c). A repeated clock is a repeated state, so an answer that carries one clock never moves ours. 0 is off" = "在答复一个 RPC 对之后，再次发送两个成员，并把时钟推进这个量。主机每轮会把自己那对的时钟推进 2（b41c、b61c、b81c）。重复的时钟是重复的状态，所以携带同一时钟的答复永远不会推进我们的时钟。0 表示关闭"
"after our offer is acknowledged, send `ping` on content N's 10000-base holder for each N - `382700000a00` for 40, which is exactly the opener nxldn-lab's client sends to start the confirmation phase, rebuilt here from our own content registry rather than copied" = "在我们的报价被确认后，对每个 N 在 content N 的 10000 基址 holder 上发送 `ping` —— 40 对应 `382700000a00`，这正是 nxldn-lab 的客户端为启动确认阶段所发送的开场消息，此处由我们自己的 content 注册表重建，而非照抄"
"after our offer is acknowledged, send boxSyncStateCommand{data:N} on the trade holder for each N in turn, one per acknowledged sequence. 20030 is a BoxSyncStateDataHolder and its field 2 is a command enum; this project 1 offers and 2 withdraws; 4 confirms and 5 withdraws the confirmation" = "在我们的报价被确认后，依次对每个 N 在交换 holder 上发送 boxSyncStateCommand{data:N}，每个已确认的序号发送一次。20030 是 BoxSyncStateDataHolder，其字段 2 是一个命令枚举；本项目 1 表示报价、2 表示撤回；4 表示确认、5 表示撤回确认"
"after our offer is acknowledged, send imReady on the TRADE holder (20030). The console has never sent these bytes and the published client waits for them before it offers, so it may be our turn to say them" = "在我们的报价被确认后，在 TRADE holder（20030）上发送 imReady。主机从未发送过这些字节，而已发布的客户端在报价前会等待它们，所以也许轮到我们来说"
"after the ack, sweep the version-4 connection request on protocol 0x14" = "在确认之后，在协议 0x14 上扫描版本 4 的连接请求"
"after the CONFIRMATION content answers our syncCommand with a hash, re-arm the 40040 pair and send BOTH members again at this clock delta - the move --selection-final-delta makes on 40050, which carries the selection phase past its own hash" = "在 CONFIRMATION content 用哈希答复我们的 syncCommand 后，重新装载 40040 对，并以这个时钟增量再次发送两个成员 —— 这正是 --selection-final-delta 在 40050 上所做的动作，它让选择阶段越过自己的哈希"
"after the selection HASH is answered, send the 40050 pair AGAIN - both members - at this clock delta. nxldn-lab's `selection_final_delta` is 9 (nxldn-lab's `selection_final_delta`). --rpc-pair latches per envelope, so the second pair needs the latch cleared. 0 is off" = "在选择哈希被答复后，以这个时钟增量再次发送 40050 对 —— 两个成员都要。nxldn-lab 的 `selection_final_delta` 是 9（nxldn-lab 的 `selection_final_delta`）。--rpc-pair 按信封锁存，所以第二对需要清除锁存。0 表示关闭"
"after the station handshake closes, send the Mesh Protocol (0x18) join request and ack whatever comes back" = "在站点握手关闭后，发送 Mesh Protocol（0x18）加入请求，并确认返回的任何内容"
"an encrypted party PK8 sent as our rental instead of the offered one" = "作为我们的租用宝可梦发送的加密队伍 PK8，而非所提供的那只"
"answer a connection request the CONSOLE sends us with a connection response" = "用连接响应来答复主机发给我们的连接请求"
"answer each payload the console sends ONCE instead of re-deriving an answer to its last payload every period. `said` never clears, so without this an offer goes out hundreds of times. The console sends each of its own messages once" = "对主机发送的每个负载只答复一次，而不是每个周期都重新推导对其最后一个负载的答复。`said` 从不清除，所以没有这个选项时一个报价会被发出数百次。主机自己的每条消息只发送一次"
"answer every DISTINCT (envelope, base, field-5 body) in the 40000 band once, on top of the opening pair. The clock advances on every message so the payload cannot be the key, but the body can: `00000000` and `000018fc` are the openers and anything else is new. A per-envelope guard stops answering at the hash body and stalls there" = "对 40000 频段中每个不同的（信封、基址、字段 5 主体）各答复一次，此外还有开场对。时钟随每条消息推进，所以负载不能作为键，但主体可以：`00000000` 和 `000018fc` 是开场者，其他任何值都是新的。按信封的守卫会在哈希主体处停止答复并卡在那里"
"answer the confirmation content's four-byte steps with phase N in the LOW u16 instead of echoing the console's own. The console reads its phase out of exactly those bytes (`0x006d6490` stores them, `0x006d3260` reads them), and every step this project has sent so far echoed the value back unchanged" = "用位于低位 u16 的阶段 N 来答复确认 content 的四字节步骤，而不是回显主机自己的值。主机会恰好从这些字节中读取自己的阶段（`0x006d6490` 存储它们，`0x006d3260` 读取它们），而本项目迄今发送的每个步骤都把值原样回显"
"answer the console's 0x58 RTT requests. Sixteen bytes at version 4, and the reply echoes the seven bytes nothing has read yet" = "答复主机的 0x58 RTT 请求。版本 4 下为十六字节，答复会回显那七个尚无人读取的字节"
"answer the console's 40030 RPC as the PAIR it is: collect both members one per base, 10000 then 20000, keyed on the BASE FIELD. `payload[5] in (0x19, 0x1A)` is the inner length and moves with the sender's station-id varint (0x1A/0x1B on some consoles). Send both once in that order and nothing more on this window; `said_by_port` keeps only the last payload, so a mirror sends one member repeatedly and never the other" = "把主机的 40030 RPC 当作它本来的对来答复：按基址字段归键，每个基址收集一个成员，先 10000 后 20000。`payload[5] in (0x19, 0x1A)` 是内部长度，会随发送方的站点 ID varint 变化（某些主机上是 0x1A/0x1B）。按该顺序各发送一次，然后在此窗口上不再发送；`said_by_port` 只保留最后一个负载，所以镜像实现会反复发送一个成员而从不发送另一个"
"answer the console's MIGRATION_START on 0x18 port 1 with a MIGRATION_RESPONSE. `440001` arrives there only when the player accepts, and the console goes silent on every window afterwards: the last thing it asks for is two bytes of mesh, not application data" = "用 MIGRATION_RESPONSE 答复主机在 0x18 端口 1 上的 MIGRATION_START。只有当玩家接受时 `440001` 才会到达那里，之后主机在所有窗口上都会静默：它最后要的是两字节的 mesh，而不是应用数据"
"answer the trade RPC on its OWN Pia port with its own reliable window. The console sends them on 0x7C port 1; an answer on port 0 lands on a window it does not read them on" = "在交换 RPC 自己的 Pia 端口上用它自己的可靠窗口答复。主机在 0x7C 端口 1 上发送它们；在端口 0 上的答复会落在它不读取这些内容的窗口上"
"answer with `pokeldn.swsh.trade.SYNC_ANSWERS` instead of echoing one payload: the ping, and the three other sync holders the console is expected to raise after the trade snapshot. A payload with no rule is REPORTED and left unanswered - that report is the point of the run" = "用 `pokeldn.swsh.trade.SYNC_ANSWERS` 答复，而不是回显一个负载：即 ping，以及主机在交换快照之后预期会发起的另外三个 sync holder。没有规则的负载会被报告并保持未答复 —— 该报告正是这次运行的意义"
"any other record field by name: shiny_type=3, ball=1, held_item=236, gender=1, nature=10, ability_type=2, iv_hp=31, dynamax_level=10, gigantamax=1, tid=12345, sid=54321 ..." = "按名称指定的任何其他记录字段：shiny_type=3、ball=1、held_item=236、gender=1、nature=10、ability_type=2、iv_hp=31、dynamax_level=10、gigantamax=1、tid=12345、sid=54321 ……"
"between our own fragments" = "在我们自己的分片之间"
"between whole re-sends; the console retransmits its own until acked" = "在整次重发之间；主机会重传自己的内容直到被确认"
"build the record in --offer-slot instead of sending it as it came: this national dex number, in the party record the snapshot advertises AND in the offer, so the two still tell one story" = "在 --offer-slot 中构建记录，而不是按原样发送：使用这个全国图鉴编号，既写入快照所声明的队伍记录，也写入报价，这样两者仍然讲述同一个故事"
"byte [1]. 0xFD is what 0x017c1700 compares against; anything else is the instrument that says the handler was reached" = "字节 [1]。0xFD 是 0x017c1700 所比较的值；其他任何值都是表明已到达处理程序的探针"
"bytes written over the record at OFFSET before sealing, for the fields no name covers (0x15=0b for the title index); repeatable" = "在封存前覆盖写入记录 OFFSET 处的字节，用于没有名称覆盖的字段（0x15=0b 表示称号索引）；可重复"
"clear [3], which makes the console skip the variable-id comparison" = "清除 [3]，这会让主机跳过变量 ID 比较"
"compress the message, the way the console compresses every 0x80 message it sends. The flag is the Pia message's (0x10 at version 4), so this is free either way - and it is one variable, so sweep it alone" = "压缩消息，就像主机压缩它发送的每条 0x80 消息那样。该标志属于 Pia 消息（版本 4 下为 0x10），所以无论设不设置都没有代价 —— 而且它只是一个变量，所以可以单独扫描它"
"draw a new encryption constant and PID for every offered Pokemon" = "为每个被提供的宝可梦生成新的加密常量和 PID"
"draw a new encryption constant and PID for the offered Pokemon" = "为被提供的宝可梦生成新的加密常量和 PID"
"end with box command 3 and MIGRATION_START, as the retail Sword that led our joiner did; by default the host keeps the session" = "以盒子命令 3 和 MIGRATION_START 结束，就像引导我们加入方的零售版剑所做的那样；默认情况下主机会保留会话"
"fixed ack id for the join request; random when omitted" = "加入请求的固定确认 ID；省略时随机"
"four move ids, comma-separated; 0 empties a slot. PP is left as the template had it" = "四个招式 ID，以逗号分隔；0 会清空一个栏位。PP 保持模板中的值"
"hex; defaults to Sword's 0x0100abf008968000" = "十六进制；默认为剑的 0x0100abf008968000"
"host a Dynamax Adventure (Max Lair) lobby whose legendary is this species; the host leaves once the adventure starts (docs/swsh_raid.md)" = "主持一个传说宝可梦为该物种的极巨巢穴（Dynamax Adventure）大厅；冒险开始后主持人会离开（docs/swsh_raid.md）"
"host a Max Raid den lobby with this boss instead of a Link Trade (docs/swsh_raid.md)" = "主持一个以该首领为 Boss 的极巨团体战巢穴大厅，而不是连接交换（docs/swsh_raid.md）"
"host a Max Raid with a boss of this Wild Area Event delivery (an EventsGallery 'Index NNN' folder) instead of --raid-boss; its rewards unless --raid-reward (docs/swsh_raid.md, Event raids)" = "主持一场极巨团体战，其首领来自这个旷野地带活动的派发（EventsGallery 的「Index NNN」文件夹），而不是 --raid-boss；除非指定 --raid-reward，否则使用其奖励（docs/swsh_raid.md，活动团体战）"
"host a session for a console in Sword's LAN mode on this IP network (docs/swsh_session.md, LAN mode); no radio, no root, no keys" = "为此 IP 网络上处于剑的 LAN 模式的主机主持一个会话（docs/swsh_session.md，LAN 模式）；无需无线，无需 root，无需密钥"
"how far to advance a trade RPC's clock in our answer. 5 is nxldn-lab's and is the one number in this path nothing here has measured" = "在我们的答复中把交换 RPC 的时钟推进多少。5 是 nxldn-lab 的值，也是这条路径上唯一一个此处尚未测量过的数字"
"how long to keep retransmitting if nothing acknowledges it; 0 sends until the run ends" = "在没有收到任何确认时继续重传多久；0 表示一直发送到运行结束"
"how long to retransmit the join request; Pia's own joiner gives up at 10" = "重传加入请求的时长；Pia 自己的加入方在 10 时放弃"
"how long to wait for the station acceptance before giving up on joining" = "在放弃加入之前等待站点接受多久"
"how long to wait for the station handshake before giving up on sending" = "在放弃发送之前等待站点握手多久"
"how many sequence ids of ours to send in all; 0 has no limit. One message does not hold the console's state; it sends its own heartbeat about 580 times in 180 s" = "总共发送多少个我们的序号；0 表示不限制。一条消息不足以维持主机的状态；它在 180 秒内会发送自己的心跳约 580 次"
"how often to broadcast it; the console sent one about every 2 s" = "广播它的频率；主机大约每 2 秒发送一次"
"how often to retransmit the migration response until it is acked" = "在迁移响应被确认之前，重传它的频率"
"--ip-join: our own address on that LAN" = "--ip-join：我们在该 LAN 上的自身地址"
"--ip-join: the address a scan leaves from; default --our-ip" = "--ip-join：扫描发出的地址；默认为 --our-ip"
"join a console in Sword's LAN mode over the IP network: its address, the subnet broadcast, or auto for every local /24 (docs/swsh_session.md, LAN mode); no radio, no keys" = "通过 IP 网络加入处于剑的 LAN 模式的主机：其地址、子网广播，或 auto 表示每个本地 /24（docs/swsh_session.md，LAN 模式）；无需无线，无需密钥"
"join an emulated console hosting over ldn_mitm on the LAN; no radio, no root, no keys. Each of --scans waits --dwell seconds for an answer" = "加入一个通过 ldn_mitm 在 LAN 上主持的模拟主机；无需无线，无需 root，无需密钥。每次 --scans 都会等待 --dwell 秒以获取答复"
"keep the file's own OT name and trainer ids" = "保留文件自身的 OT 名称和训练家 ID"
"--lan from a loopback address: the address a console on this machine believes it has; default this machine's own" = "--lan 从回环地址发出：本机上某台主机认为自己拥有的地址；默认为本机自己的地址"
"--lan: our station port" = "--lan：我们的站点端口"
"--lan: seconds of silence that mean the console left" = "--lan：多少秒的静默表示主机已离开"
"--lan: seconds to repeat the host request before the station handshake" = "--lan：在站点握手之前重复主机请求的秒数"
"--lan: the console's broadcast address; default --lan's /24" = "--lan：主机的广播地址；默认为 --lan 的 /24"
"--lan: the maximum the session info states" = "--lan：会话信息所声明的最大值"
"--lan: the session maximum to browse for; default 4 for a raid or adventure, 2 for a trade" = "--lan：浏览时寻找的会话最大值；团体战或冒险默认为 4，交换默认为 2"
"--lan: the subnet broadcast address the console's challenge uses" = "--lan：主机的挑战所使用的子网广播地址"
"LDN advertisement protocol version" = "LDN 广播协议版本"
"leave this long after the legendary is sent; a computer partner then takes our seat and picks our rental" = "在传说宝可梦发送后等待这么久再离开；随后电脑伙伴会坐上我们的位置并挑选我们的租用宝可梦"
"make --open-content send our PK8 on the 10000-base holder instead of an empty `ping`. The ping opens content 50 and is taken as our Pokemon: the console reaches the confirmation phase and asks the player to trade theirs for an egg. Same moment, same holder, a Pokemon in it" = "让 --open-content 在 10000 基址 holder 上发送我们的 PK8，而不是空的 `ping`。该 ping 会打开 content 50，并被当作我们的宝可梦：主机会进入确认阶段，并要求玩家用自己的宝可梦换一个蛋。同一时刻、同一 holder，里面放一只宝可梦"
"offer back the exact PK8 the console just offered us, unchanged, instead of one out of --send-snapshot. These bytes came out of its own save, so a run that still aborts rules the record out" = "原样回发主机刚刚提供给我们的那个 PK8，而不是来自 --send-snapshot 的一个。这些字节出自它自己的存档，所以仍然中止的运行可以排除该记录"
"once a hash body has been answered, `ping` content N's 10000-base holder on port 0 to open the next phase - 40 is the confirmation, so this sends `382700000a00`. The console stops sending 40050 once the hash answer lands and says nothing further; Pia retransmits anything it still waits on, so that silence means satisfied and the next phase needs opening" = "一旦哈希主体被答复，就在端口 0 上 `ping` content N 的 10000 基址 holder 以打开下一阶段 —— 40 是确认阶段，因此这里会发送 `382700000a00`。哈希答复到达后，主机便停止发送 40050，并不再说任何东西；Pia 会重传它仍在等待的任何内容，所以那种静默意味着已满足，而下一阶段需要打开"
"once a hash body has been answered, open content N's phase by sending the two-member RPC pair for it (40 is the confirmation). A pair is the only shape that opens a phase on this console: 40030 opened the offer and 40050 the selection. A bare content ping (`382700000a00`) and a bare sync-120 ping (`780000000a00`) are both ignored" = "一旦哈希主体被答复，就通过发送该 content N 的两成员 RPC 对来打开它的阶段（40 是确认阶段）。对是在这台主机上打开阶段的唯一形态：40030 打开了报价，40050 打开了选择。裸 content ping（`382700000a00`）和裸 sync-120 ping（`780000000a00`）都会被忽略"
"once a hash body has been answered, send `ping` on sync holder N (120 is the confirmation's) on port 0. The console drives 97, 60000, 110 and 130 itself and opens the selection phase when 130's pingSynced lands; it never sends 120. A phase follows its sync, not a content ping" = "一旦哈希主体被答复，就在端口 0 上向 sync holder N 发送 `ping`（确认阶段的是 120）。主机会自己驱动 97、60000、110 和 130，并在 130 的 pingSynced 到达时打开选择阶段；它从不发送 120。阶段跟随它的 sync，而不是 content ping"
"once the confirmation ladder has produced its first step, end the run as soon as SECONDS pass with no NEW step body: stop transmitting, drop the link and let the console report a lost connection. Holding a stalled ladder open with acks instead makes the game declare the TRADE failed, which costs the player about an hour. Nothing but acks follows the last step body. 0 is off and the hold runs in full." = "一旦确认阶梯产生了第一个步骤，那么在没有新步骤主体的情况下经过 SECONDS 秒就结束运行：停止发送、断开链路，并让主机报告连接丢失。反之，用确认把停滞的阶梯保持打开会让游戏宣布交换失败，这会让玩家损失约一小时。最后一个步骤主体之后只有确认。0 表示关闭，此时会完整执行保持流程。"
"once the migration makes us the host, broadcast UPDATE_MESH the way the console did: its own last one with the host index set to ours. The console stops sending these once it hands the role over, and the mesh is gone about 1.3 s later if nothing takes over" = "一旦迁移让我们成为主持人，就按主机的方式广播 UPDATE_MESH：用它自己的最后一条，并把主持人索引设为我们的。主机一旦移交该角色就停止发送这些，而如果没有东西接管，mesh 会在约 1.3 秒后消失"
"optional saved Sword 0x84 snapshot; otherwise use the joining console's snapshot from this session" = "可选的已保存剑 0x84 快照；否则使用本次会话中加入主机的快照"
"optional Sword advertisement (hex, raw, or swsh_net_facts.json); without one, build a fresh station record" = "可选的剑广播（十六进制、原始数据或 swsh_net_facts.json）；没有则构建一个全新的站点记录"
"our own station variable id; fresh random when omitted, because a reused one is 'already one of my stations' on BDSP" = "我们自己的站点变量 ID；省略时随机生成新的，因为在 BDSP 上复用的 ID 会变成「already one of my stations」"
"our player readies this long after the guest's lobby opens" = "我们的玩家在访客的大厅打开后等待这么久再准备"
"per reading" = "每个读数"
"Pia port(s) for our 0x84 messages; the console sends on 0" = "我们 0x84 消息所使用的 Pia 端口；主机在 0 上发送"
"Pia retransmits an unacknowledged join request every 500 ms" = "Pia 每 500 毫秒重传未获确认的加入请求"
"press ready this many seconds after the host acked the lobby messages" = "在主持人确认大厅消息后这么多秒按下准备"
"put our PK8 in field 5 of the 40050 pair's second member. Content 50 is PokemonTradeDataHolder, the transfer; content 30 is the box exchange. A 344-byte PK8 rides that field" = "把我们的 PK8 放入 40050 对中第二个成员的字段 5。Content 50 是 PokemonTradeDataHolder，即传输；content 30 是盒子交换。一个 344 字节的 PK8 搭载在该字段中"
"put the console first in BattleStart and framework object 0, so it serves the battle and the board answers as a client (docs/swsh_raid.md)" = "在 BattleStart 和框架对象 0 中把主机放在第一位，这样由它来主持对战，而面板作为客户端答复（docs/swsh_raid.md）"
"queue a sync on holder N right behind our selection offer, in the branch that actually runs when --selection-offer is on. --sync-after-hash cannot fire there: this one can" = "在我们的选择报价之后立即在 holder N 上排队一个 sync，放在 --selection-offer 开启时实际执行的那个分支里。--sync-after-hash 在那里无法触发：这一个可以"
"readings of the header byte at 0x05, in order; the IV's source id follows each one" = "0x05 处头部字节的读数，按顺序排列；每个读数后面紧跟 IV 的来源 ID"
"replace the three ids at the front of the snapshot's profile (pseudo device id, account Uid, network service account id). They are the console's own, handed back unchanged otherwise" = "替换快照配置档最前面的三个 ID（伪设备 ID、账号 Uid、网络服务账号 ID）。它们是主机自己的，否则会原样交回"
"scans for a matching search (--scene) before giving up" = "放弃之前进行的匹配搜索（--scene）的扫描次数"
"seconds after acceptance before the first data message, so the mesh join and the RTT exchange are already running when it lands" = "接受之后到第一条数据消息之间的秒数，这样当它到达时 mesh 加入和 RTT 交换已经在运行"
"seconds between requests; the console answered BDSP's in 40 ms" = "请求之间的秒数；主机在 40 毫秒内答复了 BDSP 的请求"
"seconds between the queued post-offer payloads. Spread them so the sweep spans the accept: the console tears down on the accept, not on a timer, so commands sent inside a couple of seconds all land before it" = "排队的报价后负载之间的秒数。把它们分散开，使扫描覆盖接受时刻：主机在接受的瞬间拆除，而不是按定时器，所以在几秒内发送的命令都会在它之前到达"
"seconds each fragment stays on the air" = "每个分片在空中停留的秒数"
"seconds of listening before the first packet out, so the capture holds the console's own rate to compare against" = "在发出第一个包之前监听的秒数，这样捕获中就包含主机自己的速率可供对比"
"seconds past --hold to keep a session whose trade is under way: the console has offered and the ladder has not finished" = "超过 --hold 后继续保留交换正在进行中的会话的秒数：主机已报价而阶梯尚未完成"
"seconds without an update session that count as the rebroadcast stopping - the console sends ten a second, so this is fifteen missed" = "没有更新会话即视为重广播停止的秒数 —— 主机每秒发送十个，所以这是漏掉十五个"
"send APPLICATION DATA once the mesh is up - the first of the project. The payload as hex; \"610000000a00\" is the six bytes the console repeats at us on 0x7C. Nothing is sent without this flag" = "在 mesh 建立后发送 APPLICATION DATA —— 本项目的第一次。负载以十六进制给出；「610000000a00」是主机在 0x7C 上反复向我们发送的六个字节。没有此标志则不会发送任何内容"
"send back whatever the console last said on this protocol, rather than the fixed --send-data. --send-data is still the first payload, before the console has said anything" = "回发主机在此协议上最后说的内容，而不是固定的 --send-data。--send-data 仍然是在主机说任何内容之前的第一条负载"
"send our own 40050 pair the moment the console says id 130 pingSynced, before its own selection burst. nxldn-lab's client opens the selection phase this way and nothing here has ever opened one; the console sends 820000001a00 in our own captures 0.3 s before its 40050 burst" = "在主机说出 id 130 pingSynced 的瞬间、即它自己的选择突发之前，发送我们自己的 40050 对。nxldn-lab 的客户端以这种方式打开选择阶段，而此处从未打开过；在我们自己的捕获中，主机会在其 40050 突发前 0.3 秒发送 820000001a00"
"send our PK8 as a Data on elementId 10000 and as a holder on the 30000-base id (30050), which every content registers. More than one variable at once" = "把我们的 PK8 作为 Data 发送到 elementId 10000，并作为 holder 发送到 30000 基址的 ID（30050），后者每个 content 都会注册。一次涉及多个变量"
"send the --raid-boss file's own level, IVs, nature, size and PID instead of a den seed's; a console's catch then fails PKHeX's raid check (docs/swsh_raid.md, A boss a catch keeps legal)" = "发送 --raid-boss 文件自身的等级、个体值、性格、大小和 PID，而不是巢穴种子的；这样主机的捕获会无法通过 PKHeX 的团体战检查（docs/swsh_raid.md，A boss a catch keeps legal）"
"send the requests to the console rather than the broadcast address" = "把请求发送给主机而不是广播地址"
"send them to the broadcast address instead" = "改为发送到广播地址"
"send these box commands as soon as the console acks our 0x84 snapshot - BEFORE either side offers a Pokemon. The game sends command 3 exactly once, on the first frame after its trade session is built and only when the role bit at session+0x419 is clear (0x010c9bb0), so one of the two sides owes the other an opener before anything else happens. Sent after both offers instead, the console leaves while the player is still picking" = "在主机确认我们的 0x84 快照后立即发送这些盒子命令 —— 早于任何一方提供宝可梦。游戏只发送命令 3 一次，在其交换会话构建后的第一帧，且仅当 session+0x419 处的角色位为清除状态（0x010c9bb0），所以两方中有一方欠另一方一个开场，之后才会有其他事情发生。若改为在双方报价之后发送，主机就会在玩家还在挑选时离开"
"send these box commands the moment MIGRATION_START arrives - the only signal that says the player pressed accept. The console keeps acking for about five seconds after it" = "在 MIGRATION_START 到达的瞬间发送这些盒子命令 —— 这是唯一表明玩家按下接受的信号。之后主机会持续确认约五秒"
"send to the console rather than the broadcast address" = "发送给主机而不是广播地址"
"set a field of the League Card the console may keep after the trade (pokeldn.swsh.league_card: name, trainer_id, dex_owned, poke1_species, ...)" = "设置主机在交换后可能保留的训练家卡字段（pokeldn.swsh.league_card：name、trainer_id、dex_owned、poke1_species、……）"
"six IVs, comma-separated, in PKHeX's HP,ATK,DEF,SPE,SPA,SPD order" = "六个个体值，以逗号分隔，按 PKHeX 的 HP,ATK,DEF,SPE,SPA,SPD 顺序"
"store the gift on the ESP32 board, which then advertises it with no computer at every power-up, and exit" = "把礼物存储到 ESP32 板子上，之后它在每次上电时无需电脑即可广播它，然后退出"
"test only, for bin/swsh_connect.py: act as a console host's player: after a trade with another --offer-file queued, offer it from the box this many seconds after the ladder, without waiting for the joiner's offer" = "仅测试用，针对 bin/swsh_connect.py：扮演某台主机主持人的玩家：在一次交换后若队列中还排有另一个 --offer-file，就在阶梯结束后这么多秒从盒子提供它，而不等待加入方的报价"
"the ability id of the built record; --offer-species leaves the template's ability where it was" = "构建记录的特性 ID；--offer-species 会把模板的特性留在原处"
"the adventure seed (ChikaBattleSeed): the rentals and encounters; random by default" = "冒险种子（ChikaBattleSeed）：租用宝可梦和遭遇；默认随机"
"the BattleSeed value; random by default" = "BattleSeed 的值；默认随机"
"THE CONTROL. Ack a sequence id the console never sent: a rebroadcast that carries on under --seq-delta 1 is what attributes a stop under 0 to the ack's CONTENT rather than to our merely having transmitted" = "对照组。确认一个主机从未发送过的序号：在 --seq-delta 1 下仍继续的重广播，正是把 0 下的停止归因于确认的内容、而非仅仅归因于我们发送过这一点的依据"
"the experience word at 0x10 of the built record" = "构建记录在 0x10 处的经验值字"
"the handshake form of --confirm-command: send the NEXT of these on each new four-byte body the confirmation content puts on elementId 20000. Content 40's own machine sends 0,1,2,3 and parks after each; one command buys two rungs and then the ladder stops" = "--confirm-command 的握手形式：每当确认 content 在 elementId 20000 上给出新的四字节主体时，发送其中这些值的下一个。Content 40 自己的状态机发送 0,1,2,3 并在每次之后停驻；一个命令可以换取两级，然后阶梯就会停止"
"the header's destination list. \"console\" names its station constant id, which is what its own broadcast acks do to us; \"none\" sends count 0, which 0x01859578 never filters and every 0x7C message carries. \"auto\" mirrors the console per protocol: none on 0x7C, the console on 0x80" = "头部的目标列表。「console」使用它的站点常量 ID，这正是它自己的广播确认对我们要做的；「none」发送计数 0，0x01859578 从不筛选它，且每条 0x7C 消息都会携带。「auto」按协议镜像主机：0x7C 上为 none，0x80 上为 console"
"the header's own 'lowest sequence pending ack'. We have sent nothing on this protocol, so 1 (the next id we would use) and 0 are both readings; the console itself sends 1 while waiting on its own first message" = "头部自身的「lowest sequence pending ack」。我们在此协议上尚未发送任何内容，所以 1（我们接下来会使用的 ID）和 0 都是读数；主机自己在等待它的第一条消息时会发送 1"
"the LDN scene id to seat in: 60001 a Link Trade search; any takes the first Sword network (a Max Raid den, docs/swsh_gift.md)" = "要落座的 LDN 场景 ID：60001 为连接交换搜索；任意值则取第一个剑网络（一个极巨团体战巢穴，docs/swsh_gift.md）"
"the level byte at 0x148 of the built record, 1..100; the experience word is left alone unless --offer-experience is given" = "构建记录在 0x148 处的等级字节，范围 1..100；除非指定 --offer-experience，否则经验值字保持不变"
"the Link Code the player searches with, e.g. 12345678; none by default" = "玩家搜索所用的连接密码，例如 12345678；默认不设"
"the lobby's LDN scene; by default the console's own lobby's, found by a scan, else 50000 (docs/swsh_raid.md)" = "大厅的 LDN 场景；默认采用主机自己大厅的场景，通过扫描找到，否则为 50000（docs/swsh_raid.md）"
"the move slot our Pokemon uses every turn" = "我们的宝可梦每回合使用的招式栏位"
"the name the raid lobby shows for us" = "团体战大厅为我们显示的名字"
"the network's own name" = "网络自身的名称"
"the nickname of the built record; sets the nicknamed flag" = "构建记录的昵称；会设置已起昵称标志"
"the offer place we take; by default the first the host left" = "我们占据的提供位置；默认是主持人留下的第一个"
"the original trainer name of the built record" = "构建记录的初训家名称"
"the party slot we offer" = "我们提供的队伍栏位"
"the Pia message port. The console sends its 0x80 acks on 0 AND 1, each packet carrying both; \"0,1\" mirrors that" = "Pia 消息端口。主机在 0 和 1 上发送其 0x80 确认，每个包都携带两者；「0,1」即镜像这一点"
"the Pia port the join travels on; the update mesh uses the reliable one" = "加入所经过的 Pia 端口；更新 mesh 使用可靠的端口"
"the --raid-boss boss is Gigantamax; a retail console accepts it where a base den holds that Gigantamax Pokemon (docs/swsh_raid.md)" = "--raid-boss 的首领是超极巨化；当基础巢穴容纳该超极巨化宝可梦时，零售版主机会接受它（docs/swsh_raid.md）"
"the retransmit interval. A window retransmits until it is acked" = "重传间隔。窗口会重传直到被确认"
"the sequence id. 1 is what both windows ask for; the first message also carries FLAG_IS_INITIALIZED and DEFINES where the stream starts" = "序号。两个窗口要求的都是 1；第一条消息还携带 FLAG_IS_INITIALIZED 和 DEFINES，用于指明流的起点"
"the station BITMAP on 0x58 and 0x7C. The console sends 2 to us, station index 1; 1 is the bit for station 0, which is the console" = "0x58 和 0x7C 上的站点 BITMAP。主机发给我们的是 2，即站点索引 1；1 是站点 0 的位，也就是主机"
"the stream id. 0 is what the console sends on both protocols" = "流 ID。主机在两个协议上都发送 0"
"the tested flag set: 'capture' records the console's party snapshot, 'trade' needs --send-snapshot, 'raid' a Max Raid den guest, 'lair' a Dynamax Adventure guest" = "测试用的标志集合：「capture」记录主机的队伍快照，「trade」需要 --send-snapshot，「raid」为极巨团体战巢穴访客，「lair」为极巨巢穴访客"
"values for byte [0x10]" = "字节 [0x10] 的取值"
"values for byte [1], list or LO-HI" = "字节 [1] 的取值，列表或 LO-HI"
"values for the header byte at 0x05 on the requests, and their IV source id; list or LO-HI" = "请求中 0x05 处头部字节的取值，及其 IV 来源 ID；列表或 LO-HI"
"values for the MESSAGE flags byte. 0x09 is what the console puts on its own Local Protocol messages; BDSP's station requests carry 0x11" = "MESSAGE 标志字节的取值。0x09 是主机在自己的 Local Protocol 消息上使用的值；BDSP 的站点请求携带 0x11"
"values for the platform byte at [2]. 9 is the real one; ANY other value is answered with a connection response rather than dropped, which is the probe for whether our message reaches the 0x14 handler at all" = "[2] 处平台字节的取值。9 是真正的值；任何其他值都会以连接响应答复而不是被丢弃，这就是用来探测我们的消息是否到达 0x14 处理程序的探针"
"wait for this payload on --send2-protocol before sending; omit to send as soon as the mesh is up" = "发送前在 --send2-protocol 上等待这个负载；省略则在 mesh 建立后立即发送"
"what to send when the console migrates the mesh. \"auto\" sends MIGRATION_FINISH when the start names US as the next host and a MIGRATION_RESPONSE when it names anyone else, which is what the binary says. \"response\" always answers 0x48, for comparison" = "当主机迁移 mesh 时发送什么。「auto」在开始消息把「我们」指定为下一个主持人时发送 MIGRATION_FINISH，指定其他任何对象时发送 MIGRATION_RESPONSE，这正是二进制文件所说的。「response」总是答复 0x48，用于对比"
"when the CONFIRMATION envelope (40040) sends a four-byte status whose body ends `0100` - the same cue the selection content sends before its Pokemon - reply with SyncSaveDataHolder{syncCommand{data:N}} on that content's 10000-base holder, id 10040, reliable port 0, and answer the status itself on port 1. Content 40 takes a command and not a Pokemon: its parser 0x010df6d0 accepts one submessage carrying one int32. Its own machine sends 0, 1, 2 and 3 in that order (swsh_trade.SYNC_COMMANDS)" = "当 CONFIRMATION 信封（40040）发送一个主体以 `0100` 结尾的四字节状态时 —— 这与选择 content 在其宝可梦之前发送的提示相同 —— 在该 content 的 10000 基址 holder（ID 10040，可靠端口 0）上用 SyncSaveDataHolder{syncCommand{data:N}} 答复，并在端口 1 上答复状态本身。Content 40 接受命令而不是宝可梦：其解析器 0x010df6d0 接受一条携带一个 int32 的子消息。它自己的状态机按该顺序发送 0、1、2 和 3（swsh_trade.SYNC_COMMANDS）"
"when the console follows its selection-phase Pokemon with the status whose body ends `0100`, offer OUR Pokemon on that content's 10000-base holder (id 10050) on reliable port 0 and answer the status on port 1" = "当主机在其选择阶段的宝可梦之后跟上一个主体以 `0100` 结尾的状态时，在该 content 的 10000 基址 holder（ID 10050）上、通过可靠端口 0 提供我们的宝可梦，并在端口 1 上答复该状态"
"when the hosting console leaves, ack its update session carrying the host-migration state and leave the network on its START_HOST_MIGRATION, as its own clients do; each step waits 10 s unanswered" = "当主持的主机离开时，确认其携带主持人迁移状态的更新会话，并在其 START_HOST_MIGRATION 上离开网络，就像它自己的客户端所做的那样；每个步骤都会等待 10 秒无人答复"
"WHEN to open the selection phase with a 40050 pair on 0x7c port 1. \"offer\" sends it as soon as our offer is acknowledged, the only window the console is still reading in; \"migration\" sends it on the migration start, after the console has stopped. The pair is the same envelope as the console's own 40030 at offset 50 with our station id; the builder reproduces its 40030 pair byte for byte" = "何时在 0x7c 端口 1 上用 40050 对打开选择阶段。「offer」在我们的报价被确认后立即发送它，这是主机仍在读取的唯一窗口；「migration」在迁移开始时发送它，此时主机已经停止。该对与主机自己的 40030 在偏移 50 处是同一信封，但用我们的站点 ID；构建器会逐字节复现它的 40030 对"
"which of the 32 ack slots to fill; \"all\" (the default) fills every one, because only the slot at some station index is read and whose index it is has not been settled. \"0\" is the console, \"1\" is us" = "要填充 32 个确认槽中的哪些；「all」（默认）会填充每一个，因为只会读取某个站点索引处的槽，而该索引究竟是谁的尚未确定。「0」是主机，「1」是我们"
"which party slot of --send-snapshot to offer back, 1-6; 0 offers nothing and only records what the console offers us" = "回发 --send-snapshot 的哪个队伍栏位，1-6；0 不提供任何东西，只记录主机提供给我们的内容"
"which SyncPingDataHolder field --sync-after-hash sends: 1 ping, 2 pingReply, 3 pingSynced (`780000001a00`, the one the trace records)" = "--sync-after-hash 发送 SyncPingDataHolder 的哪个字段：1 为 ping，2 为 pingReply，3 为 pingSynced（`780000001a00`，即跟踪记录中的那个）"
"while the confirmation ladder waits on the console, send our 40040 pair again every SECONDS with its clock advanced to the present. 0 is off" = "在确认阶梯等待主机期间，每隔 SECONDS 秒再次发送我们的 40040 对，并把它的时钟推进到当前。0 表示关闭"
"whose constant and variable id go in the response's two id fields - a deduction, so 'both' alternates them across the retransmits" = "响应中两个 ID 字段放入谁的常量 ID 和变量 ID —— 这是一种推断，所以「both」会在多次重传中交替使用它们"
"with --migrate, ladder done to box command 3 and the migration" = "配合 --migrate 时，阶梯完成后执行盒子命令 3 和迁移"
"with --raid-event: roll each drop's chance as a den does, or give every drop" = "配合 --raid-event：像巢穴一样为每个掉落物抽取概率，或给出每个掉落物"
"with --raid-event: the boss, numbered as the list printed without it" = "配合 --raid-event：首领，编号方式与不带此选项时打印的列表一致"
"with --raid-event: the den area whose table the boss comes from" = "配合 --raid-event：首领所来自的表对应的巢穴区域"
"with --raid-event: the star rank, 1 to 5" = "配合 --raid-event：星级，1 到 5"
"with --raid-event: whose table the boss comes from; the advertisement's version by default" = "配合 --raid-event：首领来自哪个表；默认为广播的版本"
"with --selection-offer, answer the console's selection status with our PK8 in field 5 (`body`) of a 40050 Data carrying OUR ownerId, on the RPC port, instead of a PokemonTradeDataHolder on 10050 port 0. Content 50's receive handler resolves the sender to a station index and drops silently when it cannot; the holder shape carries no owner" = "配合 --selection-offer 时，在 RPC 端口上用一个携带「我们」ownerId 的 40050 Data、在其字段 5（`body`）中放入我们的 PK8，来答复主机的选择状态，而不是在 10050 端口 0 上使用 PokemonTradeDataHolder。Content 50 的接收处理程序会把发送方解析为站点索引，无法解析时就会静默丢弃；holder 形态不携带所有者"
"with --selection-offer, answer the selection status with our PK8 as a PokemonTradeDataHolder on the 20000-base holder (id 20050), which is where the BOX phase's own Pokemon rides one content over. Overrides --selection-offer-mirror and --selection-offer-data" = "配合 --selection-offer 时，把我们的 PK8 作为 PokemonTradeDataHolder 放在 20000 基址 holder（ID 20050）上来答复选择状态，这正是 BOX 阶段自己的宝可梦在隔一个 content 处搭载的位置。会覆盖 --selection-offer-mirror 和 --selection-offer-data"
"with --selection-offer, answer the selection status with our PK8 in a 40050 carrying the console's OWN field set - syncId, clock, body, and neither elementId nor ownerId, which is how its own selection offer decodes. Overrides --selection-offer-data" = "配合 --selection-offer 时，把我们的 PK8 放在一个携带主机「自己」字段集的 40050 中来答复选择状态 —— syncId、clock、body，且既无 elementId 也无 ownerId，这正是它自己的选择报价解码的方式。会覆盖 --selection-offer-data"
"write the joiner's Pokemon here; trade N > 1 writes FILE-N" = "在此写入加入方的宝可梦；交换 N > 1 时写入 FILE-N"
"write the PK8 the console offers to this file; trade N > 1 writes FILE-N" = "把主机提供的 PK8 写入此文件；交换 N > 1 时写入 FILE-N"
"write the PK8 we will offer to this file, before the radio is touched" = "在触碰无线之前，把我们将要提供的 PK8 写入此文件"
"write the record and its fragments here and exit" = "在此写入记录及其分片，然后退出"

# 高级选项：钻石/珍珠（BDSP）
"1 against an expected 0 is a guaranteed 'version is too high'" = "1 与预期的 0 相比，必定得到「version is too high」"
"3 is French" = "3 为法语"
"a comma-separated list of ids to probe instead" = "改为探测的 id 列表，以逗号分隔"
"a game message to put on the reliable stream before the first --request-ids request, e.g. 0x59:01000100 to add station 1 to the console's match-wait list. Repeatable, sent in order" = "在第一个 --request-ids 请求之前放入可靠流的一条游戏消息，例如 0x59:01000100 用于把站点 1 加入主机的匹配等待列表。可重复，按顺序发送。"
"a PB8 to offer (328 or 344 bytes, encrypted or PKHeX's decrypted export), edited by --trade-nickname and --trade-ot. 328 bytes hold much more than this project has identified, so what we send is a real Pokemon with named fields changed rather than one invented from nothing. Repeatable, one per trade in order; the last is offered again after the list" = "用于提供的 PB8（328 或 344 字节，加密或 PKHeX 解密的导出），由 --trade-nickname 和 --trade-ot 编辑。328 字节包含的内容远超本项目已识别的部分，因此我们发送的是一只真实宝可梦，只改动了命名字段，而不是凭空编造。可重复，按顺序每次交换一个；列表结束后会再次提供最后一个。"
"a protocol id the console does not register, so its version is 0" = "主机未注册的一个协议 id，因此其版本为 0"
"ack the mesh join response, on the STATION protocol" = "在 STATION 协议上对网格加入响应进行确认"
"acknowledge the console's reliable data as it arrives" = "主机的可靠数据到达时即确认"
"after answering the talk reservation, send this game message on the reliable stream - `0x08:00` is NetDataSelectData{index: 0}. Repeatable, sent in order. The console parks in TalkState GREETING and waits to be advanced, and which message does it is not readable offline: this is the sweep handle" = "在应答交谈预约之后，在可靠流上发送这条游戏消息——`0x08:00` 是 NetDataSelectData{index: 0}。可重复，按顺序发送。主机会停在 TalkState GREETING 等待被推进，而究竟哪条消息能推进它无法离线读出：这是用于扫描的切入点。"
"after identifying, vary the variable id to find what result 7 tests" = "在识别之后，改变 variable id，以找出结果 7 所检验的内容"
"after the count, read each candidate protocol's registered version" = "计数之后，读取每个候选协议的注册版本"
"after the join, sweep the bulk acknowledgement until the console's reliable retransmission stops" = "加入之后，扫描批量确认，直到主机的可靠重传停止"
"after the reliable handshake, send N position messages of our own and watch the console's screen" = "在可靠握手之后，发送 N 条我方位置消息，并观察主机的屏幕"
"after the station handshake, send up to N mesh join requests" = "在站点握手之后，最多发送 N 个网格加入请求"
"after the walk, send a NetDataTranerCardData for our own station. It is the message that says what a player LOOKS like, and the probe is whether the character the game drew for us changes on screen" = "行走之后，为我们自己的站点发送一条 NetDataTranerCardData。这条消息描述玩家【看起来是什么样】，而探测点在于游戏为我们绘制的角色是否会在屏幕上发生变化。"
"after the walk, send a NetRequestData for each of these data ids, one at a time on the reliable stream, and print what comes back. The Union Room answers six ids (docs/bdsp_protocol.md); 0x22 is the opaque one" = "行走之后，针对这些 data id 各发送一条 NetRequestData，在可靠流上一次一条，并打印返回的内容。联盟交谊厅会应答六个 id（docs/bdsp_protocol.md）；0x22 是含义不明的那一个。"
"after THEY answer our approach, send this message - the initiator's own next one. `0x06:0000000000` is NetDataTalkData{sexId 0, CHECK}, which is what SwitchTalkStateMine builds. Repeatable, sent in order" = "在【对方】应答我们的接近之后，发送这条消息——发起方自己的下一条。`0x06:0000000000` 是 NetDataTalkData{sexId 0, CHECK}，正是 SwitchTalkStateMine 所构造的内容。可重复，按顺序发送。"
"answer a NetDataTalkReserveData with a NetDataTalkReserveResultData. unanswered, the player's character freezes" = "用 NetDataTalkReserveResultData 应答一条 NetDataTalkReserveData。若不应答，玩家的角色会卡住不动。"
"answer NetDataTradeReadyOkData (0x21) with tradeState=WAIT and LET THE TRADE COMPLETE. THIS WRITES THE CONSOLE'S SAVE: the message is the only writer of the console's `targetTradeState`, both states at WAIT move UnionTradeManager to SECURIY_TRADE, and TradeStateModel$$InitState calls PlayerSave. The Pokemon the player picked leaves their box and ours takes its place. Needs --trade-reply. ASK THE USER FIRST" = "以 tradeState=WAIT 应答 NetDataTradeReadyOkData（0x21），并【让交换完成】。【这会写入主机的存档】：该消息是主机 `targetTradeState` 的唯一写入者，两个状态都为 WAIT 时会把 UnionTradeManager 推进到 SECURIY_TRADE，而 TradeStateModel$$InitState 会调用 PlayerSave。玩家选中的宝可梦会离开其盒子，由我们的宝可梦取而代之。需要 --trade-reply。【请先询问用户】"
"answer the console's NetDataReturnSelectData, a round reset, ONCE; the answer has no measured effect" = "应答主机的 NetDataReturnSelectData（一次回合重置），且仅【一次】；该应答没有测得任何效果。"
"answer the console's NetRequestData with the message it names. It has asked for data id 0x23 in every capture since the first join and has never been answered; this is the probe, so arm it on its own" = "用它所指定的消息应答主机的 NetRequestData。自第一次加入以来，它在每次抓包中都请求 data id 0x23，却从未得到应答；这就是本次探测，因此请单独启用它。"
"answer the console's request for NetDataIsMatchWaitData (0x23) with isMatchWait=1 instead of 0. ONE comparison in UnionRoomManager$$SetNetData gates the trade on it (`cmp w23, #1` at main.bin 0x01fd56e4, then UnionFrontDeskTradeController$$StartMatch); every run has answered 0, which is a station declining to be matched" = "用 isMatchWait=1 而非 0 应答主机对 NetDataIsMatchWaitData（0x23）的请求。UnionRoomManager$$SetNetData 中【一处】比较据此控制交换能否进行（main.bin 0x01fd56e4 处的 `cmp w23, #1`，随后是 UnionFrontDeskTradeController$$StartMatch）；每次运行都应答 0，也就是站点拒绝被匹配。"
"answer the console's RTT requests (protocol 0x58) while we hold the seat" = "在我们占用座位期间应答主机的 RTT 请求（协议 0x58）"
"answer the console's trade messages with ours. It sends a trainer record and then a Pokemon and waits; with neither answered the player sits on \"En attente d'une reponse\". THIS DOES NOT COMPLETE A TRADE - the player still confirms on their own screen, and declining there leaves the save untouched" = "用我方的消息应答主机的交换消息。它会先发送一条训练家记录，然后是一只宝可梦，并等待；若两者都不应答，玩家会停留在「En attente d'une reponse」。【这不会完成一次交换】——玩家仍需在自己的屏幕上确认，在那里拒绝则不会改动存档。"
"answer the ready-ok, after which the console writes its save" = "应答 ready-ok，此后主机会写入其存档"
"APPROACH the console's character instead of waiting to be approached. Picking an emote locks a player in place waiting to be interacted with, so a recruiting console can only be reached by someone walking up to it. Waits for its broadcast state to say it is advertising, then sends NetDataTalkReserveData - the console's own bytes, 63 00 01 00" = "【主动接近】主机的角色，而不是等待被接近。选择表情会把玩家锁定在原地等待被互动，因此招募中的主机只有靠他人走上前才能触及。等待其广播状态表明正在招募，然后发送 NetDataTalkReserveData——主机自己的字节 63 00 01 00。"
"default the Union Room's, or the password room's with --password" = "默认为联盟交谊厅的，使用 --password 时为密码房间的"
"Grand Underground: once the console's NetZoneData arrives, send a NetUgJoinData in its zone at its position plus --join-offset-x/z" = "地下大洞窟：一旦主机的 NetZoneData 到达，就在其区域、以其位置加上 --join-offset-x/z 发送一条 NetUgJoinData"
"host the room the player enters with this password, e.g. 00000000" = "以该密码开设玩家进入的房间，例如 00000000"
"how long one connection request waits for its answer" = "一个连接请求等待其应答的时长"
"how long silence has to last to count as an ack that landed" = "静默持续多久才算一次已送达的确认"
"how long to host" = "作为主机持续多久"
"how long to keep acking the mesh join response; the host repeats it every 500 ms until it is acknowledged" = "持续确认网格加入响应的时长；主机会每 500 ms 重发一次，直到被确认"
"how many times to ack the acceptance; the console repeats it until acked" = "确认接受消息的次数；主机会重复发送直到被确认"
"how many times to retransmit the approach before giving up" = "放弃前重传接近消息的次数"
"how many values of the byte at offset 1 to try" = "尝试偏移 1 处字节的取值个数"
"leave the network when the console host starts host migration (Local Protocol 0x13), which its player leaving the room sends; a station that stays sees it repeated for 10 s before the console closes its network" = "当主机开始主机迁移（Local Protocol 0x13）时离开网络，该消息由主机玩家离开房间时发送；留在原处的站点会看到它重复 10 秒，随后主机关闭其网络"
"NetDataTalkReserveResultData.IsCanTalk - 1 accepts the talk, 0 refuses it. A refusal is the SAFE probe: it should release the player rather than open a flow we cannot hold up" = "NetDataTalkReserveResultData.IsCanTalk——1 接受交谈，0 拒绝。拒绝是 SAFE 探测：它应当释放玩家，而不是开启一段我们无法维持的流程。"
"NetJoinData.avatarId, which is what picks the MODEL: it indexes UnionCharacterTable and OpLoadCharacter loads that asset name. 8 is what the default, the girl the screen shows" = "NetJoinData.avatarId，它决定【模型】：该值索引 UnionCharacterTable，OpLoadCharacter 会加载对应的资源名。默认值为 8，即屏幕上显示的那个女孩。"
"NetJoinData.colorId. The game also derives one from the avatar id (OpcManager.GetNpcColorId), so this may not be the deciding field" = "NetJoinData.colorId。游戏也会根据 avatar id 推导出一个值（OpcManager.GetNpcColorId），因此这可能不是决定性的字段。"
"nickname for the offered Pokemon" = "所提供宝可梦的昵称"
"offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常数提供它，保留异色状态，使之前接受过它的存档会再次接受它"
"only the broadcast pass, the framing the ack proved" = "仅广播这一遍，即确认所证实的帧格式"
"only the unicast pass, skipping the broadcast one" = "仅单播这一遍，跳过广播那一遍"
"OT name for the offered Pokemon" = "所提供宝可梦的初训家名"
"our Pia variable id; random by default" = "我方的 Pia variable id；默认为随机"
"our trade trainer record" = "我方的交换训练家记录"
"poll this file and send each new `ID:HEX` line as a game message on the reliable window, retransmitted until acked. Lines are sent once, in order; `#` starts a comment" = "轮询此文件，把每一行新的 `ID:HEX` 作为游戏消息发送到可靠窗口，重传直到被确认。各行只发送一次，按顺序；`#` 表示注释。"
"position messages in the burst pattern's walk. At the console's own stride, 60 is 55.8 units and leaves the Union Room entirely; pass 8 for a walk that ends where the screen can still see it" = "突发模式行走中的位置消息条数。按主机自身的步幅，60 相当于 55.8 个单位，会完全走出联盟交谊厅；传入 8 可让行走结束时仍留在屏幕可见范围内。"
"probe all 256 protocol ids, not only the ones the wiki names" = "探测全部 256 个协议 id，而不只是 wiki 中列出的那些"
"--room-pattern fixed: seconds a join has to draw the console's request for NetCharacterStateData before the next goes out" = "--room-pattern fixed：每次加入在下一个发出之前，用于引出主机对 NetCharacterStateData 请求的秒数"
"scans for the console's room before giving up; it may not exist yet" = "放弃前扫描主机房间的次数；它可能尚未存在"
"seconds after the console's NetZoneData before the Underground join" = "主机 NetZoneData 之后到地下加入之前的秒数"
"seconds after the player's trade emote before our character approaches (no walk)" = "玩家做出交换表情之后到我们的角色接近之前的秒数（不行走）"
"seconds after the walk before the first request" = "行走结束后到第一个请求之前的秒数"
"seconds between approach retransmissions" = "接近消息重传之间的秒数"
"seconds between one request landing and the next going out" = "一个请求送达与下一个发出之间的秒数"
"seconds between position messages in the burst pattern. The default is the console's own median gap" = "突发模式中位置消息之间的秒数。默认为主机自身的中位间隔"
"seconds between repeats of our security-phase state, until the console reports SEND_READYOK. A CHILD console's SEND_READYOK only ends when a message arrives inside it" = "重复我方安全阶段状态的间隔秒数，直到主机报告 SEND_READYOK。CHILD 主机的 SEND_READYOK 只有在其中收到一条消息时才会结束"
"seconds between the approach answer and each --after-approach message" = "接近应答与每条 --after-approach 消息之间的秒数"
"seconds between the talk answer and each --after-talk message" = "交谈应答与每条 --after-talk 消息之间的秒数"
"seconds per channel in the scan; 0.8 missed a live network twice" = "扫描中每个频道的秒数；0.8 曾两次漏掉一个活跃网络"
"seconds to wait after the console starts advertising before approaching" = "主机开始招募后到接近之前的等待秒数"
"seconds to wait for a reply; every probe gets one, so this is short" = "等待回复的秒数；每个探测都会得到一次，因此该值很短"
"send N well-formed connection requests and report what comes back" = "发送 N 个格式正确的连接请求，并报告返回的内容"
"square spawns one avatar per corner; line and fixed ask whether the game's idea of identity is the station or the position" = "square 在每个角落生成一个角色；line 和 fixed 用来判断游戏对身份的定义是站点还是位置"
"StateData.isRecruiment, the second byte of the same answer" = "StateData.isRecruiment，即同一应答的第二个字节"
"the byte to answer it with (default 0, what a console answers a {1} with [0x1c27f48]; a {1} reads as our back-out and, past phase 2, shows 'the partner canceled the trade')" = "用于应答它的字节（默认为 0，即主机对 {1} 给出的应答值 [0x1c27f48]；{1} 会被读作我方退出，且在阶段 2 之后显示「the partner canceled the trade」）"
"the console's protocol count, if already measured; skips the sweep" = "主机的协议数量（若已测量）；会跳过扫描"
"the LDN protocol the advertisement is encrypted for" = "该广播所加密用于的 LDN 协议"
"the name in OUR trainer record" = "我方训练家记录中的名字"
"the OnlineState we report when asked; 4 raises the trade bubble" = "被询问时我们报告的 OnlineState；4 会显示交换气泡"
"the OpcState.OnlineState our character reports when the console asks for NetCharacterStateData. 0 NONE means \"doing nothing\" and is a character doing nothing; 3 RECRUITMENT_BATTLE, 4 RECRUITMENT_TRADE, 5 RECRUITMENT_RECORD, 6 RECRUITMENT_GREETINGS, 8 COMMUNICATE" = "当主机请求 NetCharacterStateData 时，我们的角色所报告的 OpcState.OnlineState。0 NONE 表示「什么也不做」，即角色处于空闲；3 RECRUITMENT_BATTLE、4 RECRUITMENT_TRADE、5 RECRUITMENT_RECORD、6 RECRUITMENT_GREETINGS、8 COMMUNICATE。"
"the player name our side carries" = "我方携带的玩家名"
"the PlayerInfo language byte, a MsgLangId (3 is French); 1, 8, 9 and 10 cap the greeting's name at 6 characters, others at 12 (docs/bdsp_protocol.md)" = "PlayerInfo 的语言字节，即 MsgLangId（3 为法语）；1、8、9 和 10 会把问候语中的名字限制在 6 个字符，其他则为 12 个（docs/bdsp_protocol.md）"
"the Pokemon we trade: a complete, legal, encrypted 328-byte PB8 whose PID the console's save does not already hold; repeatable, one per trade in order, the last offered again after the list" = "我们用于交换的宝可梦：一个完整、合法、加密的 328 字节 PB8，其 PID 尚未被主机存档持有；可重复，按顺序每次交换一个，列表结束后会再次提供最后一个。"
"the same on z" = "在 z 轴上的相同设置"
"units one position message spans. The default is what a console's own walk measures (0.93 units every 0.41 s, over 80 of its messages); our first walks did 0.15 every 0.6 s, which is a ninth of a real player's speed and is the whole of the stutter" = "一条位置消息跨越的单位数。默认值取自主机自身行走的测量结果（0.93 个单位每 0.41 秒，基于其 80 条消息）；我们最初的行走为每 0.6 秒 0.15，只有真实玩家速度的九分之一，这正是卡顿的全部来源。"
"when the console sends game message ID, answer once with the body in FILE (raw bytes, no header): 0x15:capsule.bin answers its ball capsule with ours, 0x14:record.bin its record" = "当主机发送游戏消息 ID 时，用 FILE 中的正文应答一次（原始字节，无头部）：0x15:capsule.bin 用我们的球壳回应它的球壳，0x14:record.bin 回应它的记录。"
"where our character spawns relative to the console's own, on x. The default +2.0 is one fixed side, and a player standing against the wall on that side gets a character spawned out of bounds (followed by a crash). Negative puts it on the other side" = "我们的角色相对主机角色在 x 轴上生成的位置。默认的 +2.0 固定在一侧，若玩家站在该侧靠墙处，生成的角色的位置会越界（随后崩溃）。负值则置于另一侧。"
"where our character stands: x,y,z,rot_y (a retail host's own spot)" = "我们的角色所站的位置：x,y,z,rot_y（零售主机的自身位置）"
"where to write the Pokemon the console offers; trade N > 1 writes FILE-N" = "写出主机所提供宝可梦的路径；交换 N > 1 时写出 FILE-N"
"with --match-wait, ALSO send NetDataIsMatchWaitData{1} every S seconds for the whole hold (0 disables, leaving the answer-on-request). The console requests 0x23 once, at t=8.4-9.4, and the player reaches the trade option in the Y menu long after that" = "配合 --match-wait 时，在整个保持期间【也】每 S 秒发送 NetDataIsMatchWaitData{1}（0 表示禁用，仅保留按请求应答）。主机只在 t=8.4-9.4 请求一次 0x23，而玩家要很久之后才会在 Y 菜单中进入交换选项。"
"write the Pokemon the console offers in trade N to PREFIX_N.pb8" = "把第 N 次交换中主机提供的宝可梦写入 PREFIX_N.pb8"

# 高级选项：传说阿尔宙斯（Legends Arceus）
"0 male, 1 female: the gender in our data exchange record; its look follows" = "0 为雄性，1 为雌性：我方数据交换记录中的性别；其外观随之变化"
"0 male, 1 female: the gender in that record, whose look follows it" = "0 为雄性，1 为雌性：该记录中的性别，其外观随之而定"
"act as the player too: offer once the host shows, confirm once it offers, then selector 7; without it the console's player leads" = "也扮演玩家：房主出现后即提供，其提供后即确认，然后选择器 7；若不用此选项，则由主机的玩家主导"
"after answering phase 3, wait for the console's phase 6, then leave without answering it; this deliberately triggers the game's trade restriction" = "应答阶段 3 之后，等待主机的阶段 6，然后不应答便离开；这会故意触发游戏的交换限制。"
"after the response, send a type-5 station-list update (sets job+0x7c). Its per-station layout is provisional pending the 0x739050 decode" = "在响应之后，发送一次类型 5 的站点列表更新（设置 job+0x7c）。其逐站点布局在 0x739050 解码完成前只是暂定的。"
"also send an RTT request, which a peer answers with no state at all" = "同时再发送一个 RTT 请求，对端对其应答时不带任何状态"
"answer the console's clone-clock (0x77) with a host clock message; the console's ClockProtocol is parked in state 4 and an inbound clock message resets its state machine (report 157)" = "用一条主机时钟消息应答主机的 clone-clock（0x77）；主机的 ClockProtocol 停在状态 4，而收到时钟消息会重置其状态机（报告 157）。"
"destination bitmap word, big-endian at wire[9]; the console drops a message unless the bit for its own station index (1) is set, so bit 1 = 0x2" = "目的位图字，在 wire[9] 处按大端序；除非自身站点索引（1）对应的位被置位，主机会丢弃该消息，因此位 1 = 0x2。"
"destination-bit count on the host's reliable message; 2 so the console's own station index (1) is in range of the body destination-bitmap check" = "房主可靠消息中的目的位数量；设为 2 可使主机自身站点索引（1）落在正文目的位图检查的范围内。"
"do not answer a join request with the type-1 ack (buys 8 s, completes nothing)" = "不要用类型 1 的确认应答加入请求（可争取 8 秒，但什么也完成不了）"
"do not answer a join request with the type-2 join response" = "不要用类型 2 的加入响应应答加入请求"
"give the board this station MAC first" = "先为板卡指定这个站点 MAC"
"hex, 16 bytes: the host's player id in the station-list update, a real principal id in place of the placeholder" = "十六进制，16 字节：站点列表更新中房主的玩家 id，用真实的 principal id 替代占位符"
"hex, four bytes: the player id in our data exchange record" = "十六进制，4 字节：我方数据交换记录中的玩家 id"
"hex, sixteen bytes: the player id in the session join request" = "十六进制，16 字节：会话加入请求中的玩家 id"
"hex: once the console speaks on reliable, send this as the host's own reliable seq-1 data (the game leaves at +10 s if the host never speaks)" = "十六进制：一旦主机在可靠流上发言，就把其作为房主自己的 seq-1 可靠数据发送（若房主始终不发言，游戏会在 +10 秒离开）"
"hex: the four-byte player id in that record" = "十六进制：该记录中的 4 字节玩家 id"
"hex: the personality value in the offered record. HYPOTHESIS: a record is shiny when the trainer id, the secret id and the two halves of this value exclusive-or to under 16, which is the Gen-6 rule and is untested here" = "十六进制：所提供记录中的性格值。【假设】：当训练家 id、里 id 与该校验值的两半异或结果小于 16 时记录为异色，这是第六世代的规则，此处尚未验证。"
"hold the Session join request this long after the host's first Net 0x11. A join the console accepts after its WaitMember draws the type 7 that hands us the host role (docs/pla.md, Joining a console's network)" = "在房主第一个 Net 0x11 之后保持会话加入请求这么久。主机在其 WaitMember 之后接受的加入会引出类型 7，把房主角色交给我们（docs/pla.md, Joining a console's network）"
"how long one seat is held" = "一个座位保持多久"
"how long to hold the network up" = "保持网络运行的时长"
"how many times to send it; a console sends four" = "发送它的次数；主机会发送四次"
"--ip-join: hold one scan socket and connect the instant a fresh network appears, to land before the host latches its node list" = "--ip-join：保持一个扫描套接字，一出现新网络就立即连接，以便在房主锁定其节点列表之前接入"
"--ip-join: our address" = "--ip-join：我方地址"
"--ip-join: the console's address" = "--ip-join：主机的地址"
"join over ldn_mitm on the LAN; no radio and no root" = "通过局域网上的 ldn_mitm 加入；无需无线电，也无需 root"
"keep the network up and go silent after the leave instead of ending the run; separates what a console reads in the leave from what it reads in the network going down. Also keeps the run (and BOOT marks) after a console leaves following a trade" = "在离开后保持网络运行并保持静默，而不是结束本次运行；以此区分主机从离开消息中读到的内容与从网络关闭中读到的内容。还会在主机交换后离开时保留本次运行（以及 BOOT 标记）。"
"offer a record of the host's own rather than the captured one: the same Pokemon under the data exchange's player name and id and a new identity, so the console is not offered the record it is itself holding" = "提供房主自己的记录而不是抓包得到的记录：同一只宝可梦，使用数据交换中的玩家名和 id 以及新的身份，以免把主机自己持有的记录提供给它。"
"offer the host's own Pokemon on the game channel: answer the console's trade box with one of ours at sequence 2 on port 0" = "在游戏通道上提供房主自己的宝可梦：在端口 0 上以序号 2 用我方的一只宝可梦应答主机的交换框"
"offer the record under a new PID and encryption constant, drawn once per run, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常数提供该记录，每次运行抽取一次，保留异色状态，使之前接受过它的存档会再次接受它。"
"offer this record file instead of the reference one; stored or party, encrypted or decrypted. Repeatable, one per trade in order; the last is offered again after the list" = "提供此记录文件而不是参考记录；可为存储或队伍中，加密或解密。可重复，按顺序每次交换一个；列表结束后会再次提供最后一个。"
"once joined, echo RTT and acknowledge the reliable stream so the console does not time out after 12 s and leave" = "加入后，回显 RTT 并确认可靠流，使主机不会在 12 秒后超时离开"
"once the mesh is running, send one Atomic (0x74) kind-0 announce; a probe for whether a host announce fills an element slot (report 163)" = "网格运行后，发送一次 Atomic（0x74）kind-0 通告；用于探测房主通告是否会占用一个元素槽位（报告 163）"
"open the game's own reliable channel (0x7c) once the data exchange is done: answer the console's channel message, send the same back, and open the host's own port-0 channel, which is what the trade flow's step 0x20 ticks its network object for" = "数据交换完成后打开游戏自身的可靠通道（0x7c）：应答主机的通道消息，回送相同内容，并打开房主自己的端口 0 通道，交换流程的第 0x20 步正是为它驱动网络对象"
"progress the host's reliable stream in lockstep: for each console reliable data message, send the host's own next-sequence data with the same payload (the console advances only as the host advances)" = "以同步方式推进房主的可靠流：对主机的每条可靠数据消息，发送房主自己的下一序号数据并带上相同载荷（主机只有随房主推进才会推进）"
"put the skip-source-check flag on the record, where a reference host sends none; one variable if a run shows the record is not dispatched" = "在该记录上设置跳过来源检查的标记，而参考房主不发送该标记；若某次运行显示记录未被分发，这就只是一个变量。"
"seconds after a station's session join to send it the type-3 leave and end the run; the one direction no capture shows" = "站点完成会话加入后，经过多少秒向其发送类型 3 的离开并结束本次运行；这是任何抓包都未显示的那个方向。"
"seconds per channel in a scan" = "一次扫描中每个频道的秒数"
"send the host's own record on the 0x81 data exchange once the console opens its stream; the exchange the trade scene is the success branch of" = "一旦主机打开其流，就在 0x81 数据交换上发送房主自己的记录；交换场景正是该交换的成功分支。"
"send the Session join request with no Net 0x12 answer to the host's 0x11; the 0x12 is what a console answers by asking for host migration" = "发送会话加入请求，且不对房主的 0x11 给出 Net 0x12 应答；主机正是以要求房主迁移的方式给出 0x12"
"send this 139-byte record file instead of building one" = "发送此 139 字节的记录文件，而不是构建一个"
"stay silent after a join, to measure what the joiner does unprompted" = "加入后保持静默，以测量加入方在无提示时会做什么"
"the eight digits the player types" = "玩家输入的八位数字"
"the eight digits; '' joins any code" = "八位数字；'' 表示加入任意代码"
"the experience in the offered record; the level the game shows is the curve's, so this and --trade-box-level go together" = "所提供记录中的经验值；游戏显示的等级由成长曲线决定，因此此项与 --trade-box-level 需配合使用"
"the host's player name in the station-list update, which the game reads as identity; a real name in place of the placeholder single space" = "站点列表更新中房主的玩家名，游戏会将其读取为身份；用真实名字替代占位的单个空格"
"the LDN application version; the console's own is unread" = "LDN 应用版本；主机自身的版本未被读出"
"the LDN node name; a retail console publishes its profile name here" = "LDN 节点名；零售主机会在此发布其个人档案名"
"the level byte in the offered record's party tail" = "所提供记录队伍尾部中的等级字节"
"the name in our data exchange record; the console shows it" = "我方数据交换记录中的名字；主机会显示它"
"the Net protocol id to send the connection request under" = "发送连接请求所使用的 Net 协议 id"
"the nickname in the offered record" = "所提供记录中的昵称"
"the player name in that record; the game shows it as the trade partner (default --player-name)" = "该记录中的玩家名；游戏会将其显示为交换对象（默认为 --player-name）"
"the protocol the host sends its reliable game data on; the game's own reader polls 0x80 (BroadcastReliable), so 0x80 puts data where the game drains it" = "房主发送其可靠游戏数据所用的协议；游戏自身的读取器轮询 0x80（BroadcastReliable），因此 0x80 会把数据送到游戏读取的位置"
"the record to trade away, stored or party, encrypted or not; the default is the reference Azelf under our player name. Repeatable: one per trade in order, on this seat or in the host role once taken" = "要交换出去的记录，可为存储或队伍中，加密或不加密；默认是使用我方玩家名的参考由克希。可重复：按顺序每次交换一个，可在本座位或取得后的房主角色中使用"
"the RTT protocol version byte" = "RTT 协议的版本字节"
"the sequence id the join response promises; a type-5 update must reach it" = "加入响应所承诺的序号 id；类型 5 的更新必须达到它"
"the whole run" = "整个运行过程"
"when the console hands us the host role, leave its network and become the host with bin/pla_host.py on the same code and channel" = "当主机把房主角色交给我们时，离开其网络，并用相同代码和通道通过 bin/pla_host.py 成为房主"
"write every record the console showed or offered to this directory" = "把主机显示或提供的每个记录写入此目录"
"write every record the console shows or offers to this directory, one file per distinct record, named by species and nickname" = "把主机显示或提供的每个记录写入此目录，每个不同记录一个文件，按物种和昵称命名"
"write the record the console traded to this file" = "把主机交换出去的记录写入此文件"
"write the record the console traded to this file, -N before the extension for trade N above 1" = "把主机交换出去的记录写入此文件，第 N 次交换（N 大于 1）时在扩展名前加 -N"

# 高级选项：火红/叶绿（FRLG）
"(live) override the RFU connection id (hex, e.g. 7036) sent in the emulator connect ('C') frame. Default: a random nonzero id - any nonzero value works. --parent-pid is a deprecated alias." = "（联机）覆盖模拟器连接（「C」）帧中发送的 RFU 连接 ID（十六进制，例如 7036）。默认：随机的非零 ID——任何非零值均可。--parent-pid 是已弃用的别名。"
"0-based host party slot offered for one trade (default: 1)" = "单次交换所提供的队伍栏位，从 0 开始计数（默认：1）"
"a complete FRLG .pokegift file, or a .wc3 Wonder Card" = "完整的 FRLG .pokegift 文件，或一个 .wc3 神秘卡片"
"comma-separated 0-based offered slots for multiple trades" = "多次交换所提供的栏位，从 0 开始计数，以逗号分隔"
"decline at the confirm prompt (confirm-NO -> immediate READY_CANCEL, graceful cancel-to-leave) [trade.c:2019-2023]" = "在确认提示处拒绝（confirm-NO -> 立即 READY_CANCEL，优雅地取消并离开）[trade.c:2019-2023]"
"directory for --make-artifact output (default: artifacts)" = "--make-artifact 输出的目录（默认：artifacts）"
"explicit comma list of 0-based party slots to offer, one per trade (len must == --trades, distinct, each < party size), e.g. --slots 0,2,4" = "显式指定要提供的队伍栏位列表，从 0 开始计数，每次交换一个（长度必须等于 --trades、互不相同、每个都小于队伍规模），例如 --slots 0,2,4"
"host for the Union Room (the middle NPC on Pokemon Center 2F) instead of the trade centre's third NPC; use with --union-room-keepalive 120 and --board-type" = "主持联盟房间（宝可梦中心 2F 中间的 NPC），而不是交换中心的第三个 NPC；配合 --union-room-keepalive 120 和 --board-type 使用"
"host the cable-club COLOSSEUM instead of the trade centre (Pokemon Center 2F, third NPC -> Colosseum -> Single Battle -> JOIN). The entry is the trade centre's, so --card-flag-id still arms the console's card counters, and only this path increments its battlesWon [decomp:src/cable_club.c:792]. The whole party fights" = "主持电缆俱乐部的 COLOSSEUM，而不是交换中心（宝可梦中心 2F，第三个 NPC -> 竞技场 -> 单打对战 -> JOIN）。入口仍属于交换中心，因此 --card-flag-id 仍会启用主机的卡片计数器，且只有这条路径会增加其 battlesWon [decomp:src/cable_club.c:792]。整支队伍都会参战"
"join the real Switch" = "连接真实的 Switch"
"LDN local_communication_id (hex) to join (live); if omitted, joins the only available network (scan logs candidates)" = "要加入的 LDN local_communication_id（十六进制）（联机）；省略时加入唯一可用的网络（扫描会记录候选项）"
"LDN passphrase as hex (live); default = the built-in 64-byte emulator passphrase (shared by frlg/rse)" = "以十六进制表示的 LDN 口令（联机）；默认 = 内置的 64 字节模拟器口令（frlg/rse 共用）"
"live: minimum ms between two datagrams to the console, merging what is due into one (0 = off). See sim.PACE_MIN_GAP_MS for the measurement." = "联机：发往主机的两个数据报之间的最小毫秒间隔，将到期的数据合并为一个（0 = 关闭）。测量方法见 sim.PACE_MIN_GAP_MS。"
"number of sequential trades to perform, 1..6 (default 1; 6 = swap both entire parties). After the Nth trade the sim cancels-to-leave." = "要执行的连续交换次数，1..6（默认 1；6 = 交换双方整支队伍）。第 N 次交换后，模拟器取消并离开。"
"offline: replay a capture's host stream" = "离线：重放已捕获的主机数据流"
"override the level shown on the trading board" = "覆盖交换板上显示的等级"
"override the proven trade-animation frame delay" = "覆盖已验证的交换动画帧延迟"
"party slot to offer on the first round (default 1); the per-round default list grows ascending from here (or [0..N-1] for a full-party swap)" = "第一轮要提供的队伍栏位（默认 1）；每一轮的默认列表从此处开始递增（整队交换时为 [0..N-1]）"
"received file size (100=party, 80=box)" = "接收文件的大小（100=队伍，80=箱子）"
"received mon format: pk3=decrypted (opens in PKHeX), ek3=encrypted/raw" = "接收宝可梦的格式：pk3=已解密（可在 PKHeX 中打开），ek3=已加密/原始"
"received-mon output path" = "接收宝可梦的输出路径"
"save a .pokegift file and exit without using the radio" = "保存为 .pokegift 文件并退出，不使用无线"
"save the received mon here (trades=1); for trades>1 this is a base/prefix and each received mon is saved as <stem>_trade<k>_<species>.pk3" = "将接收的宝可梦保存到此处（trades=1）；当 trades>1 时这是基础名/前缀，每只接收的宝可梦保存为 <stem>_trade<k>_<species>.pk3"
"send each block fragment once (fire-and-forget) instead of the console's re-send-until-confirmed loop. Default off (faithful re-send): against the real client, a block streams in 1-2s with aggressive re-sends (~1.5x) and completes; trust_pia's send-once crawled (~0.1 frag/s) and never completed. trust_pia was a workaround for the 'flood', but that was the rtt deadlock (now fixed). --trust-pia re-enables send-once" = "每个数据块分片只发送一次（发后不管），而不是主机那套重发直至确认的循环。默认关闭（忠实重发）：面对真实客户端时，一个数据块以激进重发（约 1.5 倍）在 1-2 秒内流式传输完成；trust_pia 的只发一次极其缓慢（约 0.1 分片/秒），从未完成。trust_pia 曾是对「flood」的变通方案，但那是 rtt 死锁（现已修复）。--trust-pia 会重新启用只发一次"
"store the gift on the ESP32 board, which then hosts it for every console that joins, with no computer, at every power-up, and exit" = "将礼物存储到 ESP32 板上，之后它无需电脑即可在每次上电时为每个加入的主机提供该礼物，然后退出"
"treat an offered Deoxys/Mew as PARTNER_MON_INVALID and cancel-to-leave (the host's illegitimate-legend gate; legitimacy is not offline-decodable) [trade.c:1965-1968]" = "将对方提供的代欧奇希斯/梦幻视为 PARTNER_MON_INVALID 并取消离开（主机的不合法传说宝可梦关卡；合法性无法离线解码）[trade.c:1965-1968]"
"Union Room battle with --battle-fight: which of the active Pokemon's four move slots to use. The default 0 is whatever move slot one holds, which for the tracked party is refresh and does no damage" = "配合 --battle-fight 的联盟房间对战：使用当前出战宝可梦四个招式栏位中的哪一个。默认值 0 是手上恰好持有的招式栏位，对于被追踪的队伍来说是 refresh，不造成伤害"
"Union Room battle: pick fight with the first move instead of forfeiting at the first action prompt. Only the forfeit path has been proven on hardware" = "联盟房间对战：在第一个行动提示处用第一个招式开打，而不是认输。只有认输路径已在实机验证"
"Union Room chat: a line to send once the chat opens, repeatable. Up to 15 Gen-3 charmap characters each, the console's own keyboard limit and the width its chat line can draw; they go out one at a time, 1.5s apart" = "联盟房间聊天：聊天开启后要发送的一行，可重复。每行最多 15 个 Gen-3 字符映射字符，即主机键盘自身的上限和其聊天行可绘制的宽度；它们逐个发出，间隔 1.5 秒"
"Union Room chat: tail this file while the host runs and send every line appended to it, so the chat can be answered live instead of queued at launch" = "联盟房间聊天：主机运行时监视此文件，并发送追加到其中的每一行，从而可以实时应答聊天，而不是在启动时排队"
"Union Room trading board: register the offered Pokemon (its species and level) and ask for this type in return, so the console's board lists us. The console must have a Pokemon of that type to start the trade" = "联盟房间交换板：登记所提供的宝可梦（其物种和等级）并请求以此类型作为回报，从而让主机的交换板列出我们。主机必须拥有该类型的宝可梦才能开始交换"
"Union Room: accept the console's Combat instead of declining it. The console needs two non-egg party mons at level 30 or lower or it refuses on its own screen; it is master and runs the battle, we answer its controller commands" = "联盟房间：接受主机的 Combat 而不是拒绝。主机需要两只等级 30 或以下的非蛋队伍宝可梦，否则它会在自己的画面上拒绝；它是主控方并运行对战，我们只应答其控制器命令"
"Union Room: accept the console's 'Tchat' instead of declining it. Both sides send a join block, then the console's keyboard opens and every line it types is logged" = "联盟房间：接受主机的「Tchat」而不是拒绝。双方都会发送加入数据块，随后主机的键盘打开，它输入的每一行都会被记录"
"Union Room: re-present a parent NI_START for N VBlanks before the first UNI frame; the room child drops the link after five unanswered frames, and enters UNI 480 frames after the last NI_START. 120 is proven" = "联盟房间：在第一个 UNI 帧之前重新呈现父级 NI_START 共 N 个 VBlank；房间子进程在五个无应答帧后断开链路，并在最后一个 NI_START 后 480 帧进入 UNI。120 已获验证"
"which activity --union-room advertises; default 'in-room', the bare IN_UNION_ROOM a console standing in the room connects to. 'search' is what the screen before the room looks for (untested)" = "--union-room 广播哪一项活动；默认为「in-room」，即站在房间里的主机所连接的那个裸 IN_UNION_ROOM。「search」是房间之前那一画面所查找的（未经测试）"
"which map in that group the RAM script binds to." = "RAM 脚本绑定到该组中的哪一张地图。"
"wire mpId / gLocalLinkPlayerId (joiner = 1 = right seat; the only valid value - mpId 0 is the host/parent) [trade.c:1816; link_rfu_2.c:1633-1638]" = "写入 mpId / gLocalLinkPlayerId（加入者 = 1 = 右席；唯一有效值——mpId 0 是主机/父级）[trade.c:1816; link_rfu_2.c:1633-1638]"
"with a dumping --buffer-script: write the bytes that come back to this file" = "配合会转储的 --buffer-script：将返回的字节写入此文件"
"with --buffer-script create-mon --create-mon-ot-id-type 1: the OT id to use" = "配合 --buffer-script create-mon --create-mon-ot-id-type 1：要使用的 OT ID"
"with --buffer-script create-mon: the level, 1..%d" = "配合 --buffer-script create-mon：等级，1..%d"
"with --buffer-script flash-patch: byte offset of the field inside the sector's data" = "配合 --buffer-script flash-patch：该字段在扇区数据内的字节偏移"
"with --buffer-script flash-read: byte offset into the sector to start reading at" = "配合 --buffer-script flash-read：在该扇区内开始读取的字节偏移"
"with --buffer-script flash-write: added to each word of the pattern" = "配合 --buffer-script flash-write：加到模式的每个字上"
"with --buffer-script flash-write: how many words of the sector to compose" = "配合 --buffer-script flash-write：要构造该扇区的多少个字"
"with --buffer-script flash-write: word[0] of the pattern the console composes" = "配合 --buffer-script flash-write：主机所构造模式的 word[0]"
"with --buffer-script install-resident: a hook parameter, e.g. extra=6" = "配合 --buffer-script install-resident：一个钩子参数，例如 extra=6"
"with --buffer-script install-resident: the hook to install (turbo)" = "配合 --buffer-script install-resident：要安装的钩子（turbo）"
"with --buffer-script rom-reset-probe: word[0] of the pattern (default 'EMER')" = "配合 --buffer-script rom-reset-probe：模式的 word[0]（默认「EMER」）"
"with --buffer-script save-dump: byte offset into that block. Accepts 0x hex" = "配合 --buffer-script save-dump：该数据块内的字节偏移。接受 0x 十六进制"
"with --buffer-script save-write: the bytes to write, as hex" = "配合 --buffer-script save-write：要写入的字节，以十六进制表示"
"with --buffer-script sloop-svc: a syscall, 0x40..0x62 (0x4D is the bad-word check); repeat for up to eight, issued in order in one session" = "配合 --buffer-script sloop-svc：一个系统调用，0x40..0x62（0x4D 是坏字检查）；可重复至多八次，在一次会话中按顺序发出"
"with --buffer-script sloop-svc: issue THUMB `bkpt N` instead of `swi N` (0xFF is the one the game never issues; needs --write-unsafe)" = "配合 --buffer-script sloop-svc：发出 THUMB 的 `bkpt N` 而不是 `swi N`（0xFF 是游戏从不发出的那个；需要 --write-unsafe）"
"with --buffer-script sloop-svc: point this register at the console's copy of the data" = "配合 --buffer-script sloop-svc：让该寄存器指向主机持有的数据副本"
"with --buffer-script sloop-svc: r0, r1, r2, r3 in order (repeatable)" = "配合 --buffer-script sloop-svc：依次为 r0、r1、r2、r3（可重复）"
"with --buffer-script sloop-svc: the data as hex instead" = "配合 --buffer-script sloop-svc：改为以十六进制表示的数据"
"with --buffer-script sloop-svc: up to 256 bytes of UTF-8 data to send" = "配合 --buffer-script sloop-svc：最多 256 字节要发送的 UTF-8 数据"
"with --buffer-script string-gather: how many pointers to follow at most" = "配合 --buffer-script string-gather：最多追踪多少个指针"
"with --buffer-script table-scan: the watchdog, in calls (= frames)" = "配合 --buffer-script table-scan：看门狗，以调用次数计（= 帧）"
"with --flash-footer: the save counter written at +0xFFC" = "配合 --flash-footer：写入 +0xFFC 处的存档计数器"
"with --flash-footer: the sector id written at +0xFF4" = "配合 --flash-footer：写入 +0xFF4 处的扇区 ID"
"with --gift %s: the level that species appears at." = "配合 --gift %s：该物种出现的等级。"
"with --rom-transfer: write and check every block, then end the session without booting" = "配合 --rom-transfer：写入并校验每个数据块，然后结束会话而不启动"
"with --save-backup: keep a backup the link cut short here; the next one goes on from it" = "配合 --save-backup：在此处链路中断前保留一份备份；下一次将从它继续"
"zstd-compress out payloads" = "对发出的负载进行 zstd 压缩"

# 高级选项：Let's Go 皮卡丘/伊布
"1, 6, 11; code (default): the channel the link code puts a searching console on, the only one it joins on; auto: scan for the console's own network under our scene id and host on its channel" = "1、6、11；code（默认）：连接码将搜索中的主机置于的频道，也是它唯一会加入的频道；auto：在我们的场景 ID 下扫描主机自身的网络，并在其频道上主持"
"232-byte box structure for the next trade in the same session; repeatable, one per trade after the first" = "同一会话中下一次交换的 232 字节箱子结构；可重复，第一次之后的每次交换各一个"
"address our own clone announce to the peer alone. A real joiner addresses the first announce of a clone to the whole mesh (dest 0x0003), which is the default here" = "只把我们自己的克隆公告发往对端。真实加入者会把克隆的首次公告发往整个网格（dest 0x0003），这也是此处的默认值"
"answer a peer re-announcement with an acknowledgement carrying its clock rather than a second take-over. A reference joiner takes a clone over once and never again" = "对来自对端的重新公告，以携带其时钟的确认来应答，而不是再次接管。参考加入者只接管一次克隆，绝不再接管"
"answer only the first of a peer's repeated publishes with a copy of our own and acknowledge the rest. Measured to stop the peer publishing at all, so the default answers each one" = "仅对来自对端重复发布中的第一次以我们自己的副本应答，其余只做确认。实测会完全阻止对端发布，因此默认对每一次都做应答"
"answer the console's offer with this 232-byte box structure (echo: its own back), and its commits with commits" = "以此 232 字节箱子结构应答主机的提议（echo：回送它自己的），并以提交应答其提交"
"answer the host's offers with a box structure of our own. 'echo' returns the host's own, which the game accepts by construction; a path is a 232-byte structure, encrypted or not. Repeatable, one per trade on the seat; trade N writes what it received to --received with -N. After the last, a further trade is not answered and the player backs out" = "以我们自己的箱子结构应答主机的提议。「echo」返回主机自己的那份，游戏在构造上会接受它；路径则为 232 字节结构，加密与否皆可。可重复，席位上的每次交换各一个；第 N 次交换会把收到的内容以 -N 写入 --received。最后一笔之后，再有的交换将不再应答，玩家会退出"
"answered clock requests of our own before the participate (measured 10)" = "参与之前我们自己已应答的时钟请求数（实测为 10）"
"carry the peer's announcement clock in our acknowledgement on clone type 2 rather than the clock round-tripped from our own announcement, which is what a reference joiner carries" = "在克隆类型 2 的确认中携带对端的公告时钟，而不是我们自身公告往返所得的时钟，后者才是参考加入者所携带的"
"do not accept the frames rtw88 has already decrypted. With this the host reads nothing on that adapter" = "不接受 rtw88 已解密的帧。启用此项后主机在该适配器上读不到任何内容"
"files, comma-separated, holding the game payloads to send on the Reliable Protocol (0x7c) once the clone elements are up; by default the recorded identity in pokeldn.lgpe.reference, and an empty value sends nothing there" = "以逗号分隔的文件，存放克隆元素就绪后要通过可靠协议（0x7c）发送的游戏负载；默认使用 pokeldn.lgpe.reference 中记录的身份，空值则在那里不发送任何内容"
"how long to retransmit the connection request and listen for its reply" = "重传连接请求并监听其回复的时长"
"how long to wait for the scan response and the sync" = "等待扫描响应和同步的时长"
"how many kind 1 identities to send, 0.3 s apart under successive steps" = "要发送多少个 kind 1 身份，在连续步骤之间间隔 0.3 秒"
"how many party clones (ids 2 up) to announce after the identities; the reference host announced two" = "身份之后要公告多少个队伍克隆（ID 从 2 起）；参考主机公告了两个"
"keep scanning this long for a console before giving up" = "放弃之前持续扫描主机的时长"
"leave the session the way a console backs out of its trade screen, this long after the first trade step we answered (docs/lgpe_session.md)" = "按照主机退出其交换画面的方式离开会话，时间为在我们应答的第一步交换步骤之后的该时长（docs/lgpe_session.md）"
"leave the way a console backs out when both players have voted and the host has not agreed for this long, before any commit; 0 never. It ends the wait, not the trade lock a confirmed trade already saved" = "当双方玩家都已投票、而主机在此时长内仍未同意时，按主机退出的方式离开，且在任何提交之前；0 表示从不。它结束的是等待，而不是已确认交换已保存的交换锁"
"let the LDN layer encrypt in software. The Archer T3U wants the hardware path, which is the default here" = "让 LDN 层在软件中加密。Archer T3U 需要硬件路径，这也是此处的默认值"
"let the LDN layer pick the session id. A Let's Go network's is the fixed value every console advertises, which is the default here" = "让 LDN 层选择会话 ID。Let's Go 网络的会话 ID 是每台主机都广播的固定值，这也是此处的默认值"
"local_communication_id to join, hex. Omit to join the only unknown one" = "要加入的 local_communication_id，十六进制。省略则加入唯一未知的那个"
"offer every --offer and --next-offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常数提供每个 --offer 和 --next-offer 结构，保留异色状态，使先前已接收它的存档能再次接收"
"offer every --offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常数提供每个 --offer 结构，保留异色状态，使先前已接收它的存档能再次接收"
"once in the mesh, do not answer the host's RTT requests and send none of our own. Default: answer them and send one a second" = "进入网格后，不应答主机的 RTT 请求，也不发送我们自己的请求。默认：应答它们并每秒发送一个"
"once in the mesh, do not run the clone clock exchange (requests every 0.2 s, replies with our ms clock, participate after ten answers: docs/lgpe_session.md). Default: run it" = "进入网格后，不运行克隆时钟交换（每 0.2 秒一次请求，以我们的毫秒时钟回复，十次应答后参与：docs/lgpe_session.md）。默认：运行它"
"once in the mesh, do not run the Sync Clock Protocol (0x1c): a request every 2 s, the host's reply carrying the mesh clock in ms. Default: run it" = "进入网格后，不运行同步时钟协议（0x1c）：每 2 秒一次请求，主机的回复以毫秒携带网格时钟。默认：运行它"
"our kind-1 identity message, sent when the console's arrives: a captured 376-byte message, header included, or echo for the console's own back" = "我们的 kind-1 身份消息，在主机的身份消息到达时发送：一条捕获到的 376 字节消息（含报头），或用 echo 回送主机自己的那条"
"our own variable id, any nonzero value" = "我们自己的可变 ID，任意非零值"
"our own variable id, any nonzero value (the console's is random)" = "我们自己的可变 ID，任意非零值（主机的为随机值）"
"override, as ASCII" = "覆盖值，以 ASCII 表示"
"publish anyway this many seconds after the announce if the peer never published its own copy. Not a measured value" = "若对端从未发布它自己的副本，则在公告之后经过该秒数仍照常发布。并非实测值"
"publish no clone data on clone types 4 and 1. Without it the console never passes the gate at 0x11b080 and stays on its search screen" = "在克隆类型 4 和 1 上不发布克隆数据。否则主机永远无法通过 0x11b080 的关卡，会停留在其搜索画面"
"publish our copy of a clone on clone type 2 as part of the announce burst. A real joiner waits for the peer to publish its own copy first, which is the default here" = "在公告突发中将我们持有的克隆副本发布在克隆类型 2 上。真实加入者会先等待对端发布它自己的副本，这也是此处的默认值"
"put our own address in the station location's public field as well as its private one. A Let's Go joiner leaves the public field empty" = "把我们自己的地址同时填入站点位置的公有字段和私有字段。Let's Go 加入者会将公有字段留空"
"reach the peer over plain UDP instead of the radio: no scan, no LDN association, the Pia socket straight at --host-ip:12345. For an emulated host under a debugger. Needs --app-data, --host-mac, --our-mac" = "通过普通 UDP 而非无线抵达对端：不扫描、不进行 LDN 关联，Pia 套接字直连 --host-ip:12345。用于调试器下的模拟主机。需要 --app-data、--host-mac、--our-mac"
"replace the trainer id pair in the first message. A payload captured between two emulators that share a save carries the host's own pair, which presents the joiner as the station it is trading with" = "替换首条消息中的训练家 ID 对。在两个共享存档的模拟器之间捕获的负载会携带主机自己的那一对，从而把加入者呈现为它正在交换的对象站点"
"seconds after our identity to announce them" = "在我们发出身份后多少秒公告它们"
"seconds after the party clones to move our state word to 2 and send the offer, which is what a station does as its own state word reaches 2" = "在队伍克隆之后多少秒把我们的状态字移至 2 并发送提议，这正是站点在自身状态字达到 2 时会做的事"
"seconds after the second commit to send the result, the next trade's first slot, with two clones announced 0.5 s before it; a retail host sent it 26.8 s after, behind its trade animation" = "在第二次提交之后多少秒发送结果，即下一次交换的首个栏位，并在其前 0.5 秒公告两个克隆；零售主机是在 26.8 秒后、在其交换动画之后才发送"
"seconds after the take-over burst to publish our copy, with --publish-on-announce. Zero puts it in the burst's own frame" = "配合 --publish-on-announce，在接管突发之后多少秒发布我们的副本。零表示把它放进突发自身的帧中"
"seconds between the payloads of --reliable-payload" = "--reliable-payload 各负载之间的秒数"
"seconds between the steps the host drives an offered clone through" = "主机驱动一个被提供的克隆所经过各步骤之间的秒数"
"seconds past --connect-seconds or --hold to keep a seat whose trade is half done: a trade left mid-way locks the console out of trading" = "超过 --connect-seconds 或 --hold 之后仍保留交换进行到一半的席位的秒数：交换中途离开会让主机被锁定而无法交换"
"seconds past --seconds to hold a session whose trade is half done" = "超过 --seconds 之后仍保持交换进行到一半的会话的秒数"
"send a version-9 station connection request to the host and classify the reply, retransmitting every 0.5 s the way Pia does. Without it, listen only" = "向主机发送版本 9 的站点连接请求并分类其回复，像 Pia 那样每 0.5 秒重传一次。否则仅监听"
"send nat flags 5 and nat location 1. A Let's Go joiner sends zero for both on local wireless" = "发送 NAT 标志 5 和 NAT 位置 1。Let's Go 加入者在本地无线下两者都发送零"
"send the 0x3c-byte connection response instead of the full 0x348-byte one, which carries no network id and no player" = "发送 0x3c 字节的连接响应，而不是完整的 0x348 字节响应，后者不携带网络 ID 和玩家"
"send the announcement of our own copy a tick after the take-over burst. Both stations of a session that works put all seven in one frame, which is the default here" = "在接管突发之后一个 tick 时发送我们自身副本的公告。可正常工作的会话中两个站点都会把全部七条放进一个帧，这也是此处的默认值"
"stamp our own clock on the take-over instead of the clock the peer's announcement carried. The peer completes a take-over only when it matches the sequence it allocated, so the echo is the default" = "在接管上盖用我们自己的时钟，而不是对端公告携带的时钟。对端只有在其分配的序列匹配时才会完成接管，因此默认回送（echo）"
"test only, for bin/lgpe_join.py: act as a console host's player, each step this many seconds after the last. Offer unprompted after the party clones and after each result, vote on the offered clone, announce and vote the commit clone, commit (docs/lgpe_session.md). Never against a console" = "仅用于测试，适用于 bin/lgpe_join.py：扮演主机方的玩家，每一步都在上一步之后这么多秒进行。在队伍克隆之后以及每个结果之后主动提议，对所提供的克隆投票，公告并对提交克隆投票，提交（docs/lgpe_session.md）。绝不针对真实主机使用"
"test only: carry the drive on through a withdrawn vote, as the host did before it answered state 2 (docs/lgpe_session.md). Locks a console's save" = "仅用于测试：在投票被撤回后仍继续驱动流程，如同主机在应答状态 2 之前所做的那样（docs/lgpe_session.md）。会锁定主机的存档"
"test only: ignore the console's first answer to our clone 0 pair, as if lost, so the pair goes again" = "仅用于测试：忽略主机对克隆 0 配对的首次应答，如同丢失一样，使该配对再次发送"
"test only: send no answer to the host's first clone 0 pair (0xa1, 0xb1), as if lost, to see whether the host repeats it" = "仅用于测试：对主机的首个克隆 0 配对（0xa1、0xb1）不作应答，如同丢失一样，以观察主机是否会重发"
"test only: skip the first N of our announcements to the console alone, as if lost, so the resend carries them" = "仅用于测试：只对主机跳过我们前 N 条公告，如同丢失一样，使重发能携带它们"
"test only: skip the first N of our announcements to the host alone, as if lost, so the resend carries them" = "仅用于测试：只对主机跳过我们前 N 条公告，如同丢失一样，使重发能携带它们"
"the advertised scene id, in place of the one --code gives" = "要广播的场景 ID，取代 --code 所给出的那个"
"the hosting station's MAC, as it appears in its own advertisement" = "主持站点的 MAC，即其自身广播中出现的那个"
"the host's advertise data as hex, or @FILE, instead of scanning for it. Needs --host-mac alongside" = "主机的广播数据，以十六进制表示，或 @FILE，而不是去扫描它。需要同时提供 --host-mac"
"the LDN advertisement protocol. A title sees only its own: Let's Go advertises and scans on 1, measured off the console's own beacon" = "LDN 广播协议。一个游戏只看到自己的：Let's Go 在 1 上广播和扫描，这是从主机自身信标测得的"
"the link code the player enters: three picker names (English or French) or indices 0-9, comma-separated" = "玩家输入的连接码：三个选择器名称（英文或法文）或索引 0-9，以逗号分隔"
"the MAC we present; any value the host has not seen" = "我们呈现的 MAC；任意主机未见过的值"
"the nickname our connection response carries" = "我们连接响应所携带的昵称"
"the nickname the connection response carries, what the console shows as the partner (a real station sends its Switch profile's)" = "连接响应所携带的昵称，即主机显示为对方的名称（真实站点会发送其 Switch 个人资料的昵称）"
"the player name our identity carries, the one the trade screen shows" = "我们身份所携带的玩家名，即交换画面显示的那个"
"the trainer id pair written over the identity's" = "覆盖身份中自带那一对的训练家 ID 对"
"write the peer's offered PB7 here" = "在此写入对端提供的 PB7"

# 高级选项：传说 Z-A
"a 354-byte offer message to send once the streams are open. Repeatable, one per trade in the seat; the last serves every later trade" = "流打开后要发送的 354 字节提议消息。可重复，席位中的每次交换各一个；最后一个用于其后所有交换"
"a file to write the moment a seat forms and again when it ends, so a watcher on the other side can act on the seat without a relay" = "在席位形成时以及结束时写入的文件，使另一侧的监视程序无需中继即可对该席位作出反应"
"a searching console put both of its measured sessions on channel 6" = "搜索中的主机将其两个实测会话都置于频道 6"
"address our datagrams to the host rather than to the broadcast" = "将我们的数据报发往主机，而不是发往广播地址"
"address our datagrams to the link-local broadcast, as a retail station does" = "将我们的数据报发往链路本地广播，如同零售站点所做的那样"
"bound the association alone; the seat itself is not bounded by it" = "仅限制关联的时长；席位本身不受其限制"
"end a seat on which the console has sent nothing for this long" = "主机在此长时间内未发送任何内容时结束席位"
"give the phy this MAC before associating" = "在关联之前给 phy 设置此 MAC"
"hex packet flags ORed into the Session join's header: 4 is the band's skip-network-connection-check bit, which a station the console has not yet connected may owe" = "以 OR 并入 Session 加入报头的十六进制数据包标志：4 是该频段的跳过网络连接检查位，尚未与主机连接过的站点可能需要设置它"
"hex; the application communication version the Session join declares. Six is what a reference joiner sends and what the advertisement carries" = "十六进制；Session 加入所声明的应用通信版本。参考加入者发送的是 6，广播所携带的也是它"
"hex; the default is Legends Z-A's" = "十六进制；默认值为传说 Z-A 的值"
"hex; the default is the title's. An emulated Z-A advertises and scans for ffffffffffffffff over ldn_mitm" = "十六进制；默认值为该游戏的值。模拟的 Z-A 会通过 ldn_mitm 广播并扫描 ffffffffffffffff"
"hex; the Session join's 32-byte identification token, zero-padded. A reference joiner sends 0x06 and zeroes" = "十六进制；Session 加入的 32 字节标识令牌，零填充。参考加入者发送 0x06 和零"
"how long to hold one seat" = "保持一个席位的时长"
"how many selection records to send; a reference joiner sent sixteen" = "要发送多少个选择记录；参考加入者发送了十六个"
"id:version pairs the Session join declares; the default is the set a reference Legends Z-A joiner declares" = "Session 加入所声明的 id:version 对；默认值为参考传说 Z-A 加入者所声明的那一组"
"join an emulated host over the LAN through its ldn_mitm bridge, with no radio and no root" = "通过其 ldn_mitm 桥接，经由局域网加入模拟主机，无需无线且无需 root"
"leave this long after the last queued trade's fourth step; by default the seat is kept until the player backs out or --hold ends, as every joiner does" = "在最后一个排队交换的第四步之后这么久离开；默认会保留席位，直到玩家退出或 --hold 结束，正如每个加入者所做的那样"
"make our pick this many seconds after the preview, without waiting for the console's; the default answers the console's pick" = "在预览之后这么多秒作出我们的选择，而不等待主机的选择；默认会应答主机的选择"
"never send this answer, to find what a seat needs (docs/za.md, Unresolved); repeatable" = "从不发送此应答，用于探明席位需要什么（docs/za.md，Unresolved）；可重复"
"once the session is up, open the game's reliable streams and send the identity, the selection record and, with --trade-offer, an offer" = "会话建立后，打开游戏的可靠流，并发送身份、选择记录，以及在配合 --trade-offer 时发送提议"
"only join a console waiting on this link code" = "仅加入正在等待此连接码的主机"
"optional seconds to keep the seat once the console is back on its box after a trade, then hand the console the session and close; by default the host waits for the console to leave" = "可选：交换后主机回到其箱子画面时保留席位的秒数，随后把会话交给该主机并关闭；默认由我方作为主机等待该主机离开"
"our own address on that LAN" = "我们在该局域网上的自身地址"
"our own constant id in the Session join: the LDN permutation of our MAC, which is the form the console publishes for itself, or the MAC as it is" = "我们在 Session 加入中的自身固定 ID：我们 MAC 的 LDN 置换，即主机为自身发布的那个形式，或 MAC 原样"
"seconds after the identity before the selection record starts; a reference joiner waits about 0.46 s" = "在身份之后到选择记录开始之间的秒数；参考加入者等待约 0.46 秒"
"seconds after the streams open before the offer goes out" = "流打开之后到提议发出之间的秒数"
"seconds between selection records; a reference joiner sends about four a second, each under a fresh sequence" = "选择记录之间的秒数；参考加入者每秒发送约四个，每个都在新的序列之下"
"send the band's Net connection request once seated" = "入座后发送该频段的 Net 连接请求"
"send the offer under a new PID and encryption constant, shiny state kept, so a save that took this record before takes it again" = "在新的 PID 和加密常数下发送提议，保留异色状态，使先前已接收此记录的存档能再次接收"
"send the Session join request once the console's Net is acknowledged" = "在主机的 Net 被确认后发送 Session 加入请求"
"stay silent; the run then measures what the console sends on its own" = "保持静默；随后运行将测量主机自行发送的内容"
"the 354-byte offer message: the preview, then our pick. Repeatable, one per trade in the seat; the last serves every later trade" = "354 字节的提议消息：先是预览，然后是我们的选择。可重复，席位中的每次交换各一个；最后一个用于其后所有交换"
"the LDN node name; a searching console advertises one space" = "LDN 节点名；搜索中的主机广播的是一个空格"
"the link code the player types" = "玩家输入的连接码"
"the local communication version our NodeInfo publishes on the LAN path; a host publishes its own application version there" = "我们的 NodeInfo 在局域网路径上发布的本地通信版本；主机在那里发布它自己的应用版本"
"the name the Session join's PlayerInfo carries; a reference joiner sends one space" = "Session 加入的 PlayerInfo 所携带的名称；参考加入者发送一个空格"
"the station platform byte; both retail consoles here are Switch 2" = "站点平台字节；此处两台零售主机都是 Switch 2"
"the variable id we send as our own until the console names one" = "在主机指定之前，我们作为自身发送的可变 ID"
"V-Blank ticks between re-sends of an unanswered Session join; 0 is once" = "未获应答的 Session 加入重发之间的 VBlank tick 数；0 表示只发一次"
"where identity10.bin, identity11b.bin and selection.bin live; by default the ones pokeldn.za.reference ships" = "identity10.bin、identity11b.bin 和 selection.bin 所在的位置；默认使用 pokeldn.za.reference 随附的那些"
"where the reference payloads (identity10.bin, selection.bin, ...) live; by default the ones pokeldn.za.reference ships" = "参考负载（identity10.bin、selection.bin、……）所在的位置；默认使用 pokeldn.za.reference 随附的那些"
"write the host's offered PA9 here; trade N > 1 writes FILE-N" = "在此写入主机提供的 PA9；第 N 次交换（N > 1）写入 FILE-N"
"write the Pokemon the console picks here; trade N > 1 writes FILE-N. A preview, the console's cursor on its box, is not written" = "在此写入主机选中的宝可梦；第 N 次交换（N > 1）写入 FILE-N。预览（主机光标在其箱子上的位置）不会被写入"
