# POKELDN 界面简体中文语言包：高级选项帮助文本（help）
# 存放未写英文 help 的旗标描述；键格式为 "工具键:--旗标"。

# 朱/紫 交换 Host、太晶团体战 Host（sv-host / sv-raid-host）
"sv-host:--seconds" = "本次运行的时长上限，秒（默认 240）"
"sv-host:--channel" = "LDN 频道号；默认自动选择"
"sv-host:--app-version" = "广播的游戏版本号；默认取游戏当前版本"
"sv-host:--no-net-probe" = "不发送开局时的 Net 探测包"
"sv-host:--no-session-ack" = "不发送 Session 请求的确认"
"sv-host:--no-session-response" = "不发送 Session 加入响应"
"sv-host:--no-session-update" = "不发送 Session 站点列表更新"
"sv-host:--join-seq" = "Session 加入响应中的序列号（默认 1）"
"sv-host:--host-player-name" = "我们在会话中扮演的主机玩家名字（默认 POKELDN）"
"sv-host:--host-player-id" = "主机玩家 id，32 位十六进制数（16 字节）"
"sv-host:--raid-version" = "巢穴遭遇使用的游戏版本（scarlet 或 violet，默认 violet）"
"sv-host:--raid-map" = "巢穴所在的地图（paldea、kitakami 或 blueberry，默认 paldea）"
