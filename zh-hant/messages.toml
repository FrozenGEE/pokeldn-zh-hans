# 高級選項：共享啟動器旗標（--online、--keys、--capture 等）
"trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)" = "與遠方的玩家交換：對方主機的報價會在這裡提供，雙方都收到報價後才各自確認（docs/online.md）"
"the room both players enter; default the link code, and no code meets anyone else trading online without one" = "雙方玩家進入的房間；預設使用連接碼，不設碼則會遇到其他同樣無碼線上交換的玩家"
"the Switch's prod.keys; default keys_path from config/host.toml or host.local.toml" = "Switch 的 prod.keys；預設取 config/host.toml 或 host.local.toml 中的 keys_path"
"a Linux Wi-Fi card's phy (phyN), or auto; POKELDN_RADIO selects a board instead" = "Linux 無線網卡的 phy（phyN），或 auto；POKELDN_RADIO 則改為選擇一片開發板"
"write every datagram here, one JSON line each" = "把每個資料報寫入此檔案，每行一筆 JSON"
"Linux: the station interface" = "Linux：station 介面"
"Linux: the tap the host's Pia runs on" = "Linux：主機 Pia 執行所在的 tap"
"Linux: the access point interface" = "Linux：存取點介面"
"Linux: the monitor interface" = "Linux：監聽介面"
"host an emulated console over ldn_mitm on the LAN; no radio and no root" = "透過 ldn_mitm 在區域網路上主持一台模擬主機；無需無線網卡和 root"
"with --ip-host, the address to advertise" = "配合 --ip-host：要廣播的位址"
"close the session this long after the last queued trade; by default the run keeps it until the console leaves or the time limit ends" = "最後一次排隊交換後等待這麼久再關閉連線；預設會一直開到主機離開或時限結束"
"leave the seat this long after the last queued trade; by default the run keeps it until the console leaves or the time limit ends" = "最後一次排隊交換後等待這麼久再離開座位；預設會一直坐到主機離開或時限結束"
"after each trade, trade again and offer the Pokemon the console just sent, so one that evolves by trade evolves on the console; the player offers ours back (docs/architecture.md, Trade back)" = "每次交換後再交換一次，把主機剛發來的寶可夢提供給它，通信進化的寶可夢便會在主機上進化；對方玩家也會把我們的寶可夢還回來（docs/architecture.md，換回）"
"the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "每個 --trade-offer 由哪張神秘禮物卡片生成，順序一致：填它在 PKHeX 活動資料庫中的鍵（pokeldn.pokemon.Service.gift_events）"
"make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)" = "在交換過程中，把每張贈送接收方自己訓練家的 --gift-event 卡片，針對主機的存檔重新生成：主機先報價，其存檔捕捉的寶可夢給出訓練家，我們的報價按它客製；其餘卡片則用主機連線資料給出的訓練家。兩者都失敗時，報價按原樣發出，使用設定中的訓練家（pokeldn.receiver_gift，docs/gift_simulated.md）"

# 高級選項：朱/紫 主持（sv-host / sv-raid-host）
"advertise Violet's local communication id instead of Scarlet's" = "以紫的本地通訊 ID 進行廣播，而不是朱的"
"advertise this local communication id" = "廣播這個本地通訊 ID"
"the LDN scene: 4 for a Link Trade, 7 for a Tera Raid" = "LDN 場景：4 為連接交換，7 為太晶團體戰"
"the LDN participant limit; a Tera Raid advertises 4" = "LDN 參與者上限；太晶團體戰廣播為 4"
"the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to" = "站點的平台位元組：1 是 Switch 2，兩台零售主機都廣播該值；0 是 Switch，也是 LDN 層的預設值"
"hex, 16 bytes; default lets the LDN layer pick" = "十六進位，16 位元組；預設由 LDN 層選擇"
"the LDN node name" = "LDN 節點名稱"
"leave a console's Session type-3 leave request unanswered; it then resends it every 0.5 s and leaves after the fourth (docs/sv.md, Leaving)" = "不回應主機的 Session 3 型離開請求；主機隨後每 0.5 秒重發一次，第四次後離開（docs/sv.md，Leaving）"
"do not answer RTT requests" = "不回應 RTT 請求"
"do not acknowledge reliable streams" = "不對可靠流發送確認"
"print every packet in and out; the --capture file keeps them either way" = "列印每個進出的封包；無論是否列印，--capture 檔案都會記錄"
"seconds between the periodic bulk acks on every port the console used" = "在主機使用過的每個連接埠上，週期性批次確認的間隔秒數"
"answer clone clock requests, if any" = "回應克隆時鐘請求（如果有）"
"the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0" = "站點清單更新中的序號；朱主機在加入回應中為 0，此處發送 1"
"also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later" = "在發送加入回應的同時附帶一份站點清單，使用該序號；模擬的朱主機在此處發送 id 為 0 的清單，約兩秒後發送第二份"
"seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s" = "Session 加入回應與站點清單更新之間的秒數；朱主機間隔約 1.5 秒"
"the message flags on the Session replies; a Scarlet host sends 0x00, this host's own default is 0x01" = "Session 回覆的訊息旗標；朱主機發送 0x00，本工具預設為 0x01"
"the packet id in the Pia header of the Session replies; a Scarlet host's join response carries 1" = "Session 回覆的 Pia 標頭中的封包 id；朱主機的加入回應中為 1"
"the 41-byte Session join response a Scarlet host sends, with no route bytes, rather than Arceus's 43-byte one" = "發送朱主機的 41 位元組 Session 加入回應（不含路由位元組），而不是阿爾宙斯的 43 位元組回應"
"the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01" = "Net 0x11 開場訊息的旗標；零售主機發送 0x31，本工具預設為 0x01"
"send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them" = "按此間隔發送 RTT 請求（成對主機每 410 毫秒一次）；否則主機只回應 RTT 請求"
"the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all" = "Net 0x50 的訊息旗標；成對主機在 0x50 和 0x11 上都發送 0x31，而本工具的 0x11 需要 0x01 才會得到回應"
"send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51" = "發送成對主機在其 0x11 之後 0.37 秒發出的 Net 0x50 屬性更新訊息，重傳直到收到主機的 0x51"
"how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is" = "Net 0x11 攜帶的 21 位元組站點槽數量；無論遊戲的參與者上限是多少，零售主機都寫 4 個"
"the Link Code the player sets, e.g. 12345678; empty for none" = "玩家設定的連接碼，例如 12345678；留空表示不設"
"hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21" = "十六進位，廣播中的 40 個遊戲位元組；搜尋中的主機將其置零，被加入者連上的主機在 +0x21 處攜帶 648cf4"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], a reliable data message sent that many seconds after the seat; the sequence follows the port's own. A pair's host sends its 0x7c port 1 table update at nine seconds this way" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在入座後指定秒數發送的可靠資料訊息；序號遵循該連接埠自身的序列。成對主機以這種方式在第 9 秒發送其 0x7c 連接埠 1 的表更新"
"a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib; by default the recorded set in pokeldn.sv.reference" = "一個 NNN.bin 記錄目錄，作為本主機自己的身分在 0x81 連接埠 0 上發送，如同成對主機發送其 46 條記錄；首條帶有 INITIALIZED，且每條都已是 zlib 格式；預設使用 pokeldn.sv.reference 中錄製的記錄集"
"the player name record 1 of our identity carries, the one the trade screen shows" = "我們身分的記錄 1 所攜帶的玩家名字，即交換畫面顯示的名字"
"send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference" = "除非 --record-set 或 --send-on-open 指定了身分，否則不發送站點身分；預設發送 pokeldn.sv.reference 中錄製的身分"
"seconds after the seat before the record set goes out" = "入座後延遲多少秒再發送記錄集"
"bundle the record set N to a packet, each after the first with its header inherited, as a retail host's retransmit round does (docs/sv.md)" = "將記錄集按每包 N 條打包，首條之後的每條繼承其標頭，如同零售主機的重傳輪次（docs/sv.md）"
"seconds between the record packets; a retail raid host spreads its identity over about 0.13 s" = "記錄封包之間的間隔秒數；零售團體戰主機將其身分分散在約 0.13 秒內發出"
"run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)" = "用站點 id 執行遊戲的連接埠 2 開場，而非重播：在 0x80 連接埠 2 上發送攜帶本主機站點 id 的 7 型通告，並以攜帶主機站點 id 的 9 型訊息回應它在 0x7c 連接埠 2 上的 3 型加入（pokeldn.sv.port2）"
"seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3" = "入座後多少秒再發送 7 型訊息；成對主機約在 2.3 秒時發送"
"offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "每條記錄以新的 PID 和加密常數提供，異色狀態保留，這樣之前收過它的存檔可以再次收下"
"a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本主機提供的 348 位元組記錄的檔案（原始位元組或十六進位文字；352 位元組的遊戲訊息會剝去標頭）。指定後，本主機會用自己的報價回應主機的報價並確認，然後像成對主機一樣跟隨主機完成提交和四個交換步驟（pokeldn.sv.trade）。可重複：第二份及之後的記錄在同一座位中提供，每次交換一份，隨每次交換結束"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存前寫入所提供記錄的欄位，使用 pokeldn.sv.pokemon 的欄位名：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重複，單獨的 `shiny` 會按記錄自身的 id 隨機出一個異色性格值"
"write the offered record's 348-byte body to this file as hex and exit, which needs no radio" = "將所提供記錄的 348 位元組本文以十六進位寫入此檔案後結束，無需無線網卡"
"a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon" = "把主機自己的報價寫入此檔案，即其 80 00 02 00 訊息的 348 位元組本文，以十六進位文字保存。其內容由 pokeldn.sv.pokemon 讀取"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the console announces its own key 0x80 open on 0x7c port 1. A port-0 message sent before that open is acknowledged by the console and never reaches the game, and so is everything after it on that port; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主機於 0x7c 連接埠 1 通告其金鑰 0x80 開啟後指定秒數發送。在該開啟之前發出的連接埠 0 訊息會被主機確認、卻永遠到不了遊戲，該連接埠上其後的一切訊息也是如此；可重複；預設為 pokeldn.sv.reference 中的身分片段"
"seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open" = "在主機金鑰 0x80 開啟後多少秒由本主機先報價；與 --send-on-open 相同的門控"
"seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer" = "入座後多少秒由本主機先於主機報價，如同成對主機那樣；不指定時本主機回應主機的報價"
"seconds after the console's offer before the host's confirmation" = "主機報價後多少秒本主機再確認"
"host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags" = "主持太晶團體戰：團體戰種子，八位十六進位數；頭目、其太晶屬性和獎勵由它與四個 --raid-* 上下文旗標決定"
"the party record our player brings to the raid, legal per PKHeX; with --raid-seed" = "我方玩家帶入團體戰的隊伍記錄，需通過 PKHeX 合法性檢查；配合 --raid-seed 使用"
"a reward row in place of the seed's, in order; up to 45" = "取代種子自帶獎勵的獎勵列，按順序；至多 45 條"
"the story stage, which sets a standard crystal's star odds" = "劇情進度階段，決定標準結晶的星級機率"
"a standard or a black (six-star) crystal" = "標準結晶或黑色（六星）結晶"
"host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused" = "主持活動團體戰：寶可入口站新聞配信的資料夾（EventsGallery 活動或其 Files）；種子按 --raid-version 和 --raid-progress 從活動的遭遇中抽取，--raid-map 與 --raid-content 不使用"
"the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress" = "活動巢穴的配信分組，1 到 10；預設取該進度下第一個有巢穴且有遭遇的分組"
"with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)" = "配合 --raid-event：把只能捕捉一次的遭遇（每個七星團體戰、波盪水、鐵斑葉……）作為普通捕捉提供：捕獲率正常，記錄編號換成沒有存檔捕捉過的替身，這樣抓過它的存檔可以再抓一次；本來就抓不到的仍然抓不到（docs/sv_raid.md，活動團體戰）"
"consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out" = "團體戰等待的主機數量，1 到 3；大廳中集齊 N 台且全部準備完畢即開始，或大廳計時器耗盡時開始"
"an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)" = "團體戰安插的 NPC 隊友，按槽位順序，主機空出的每個槽位一名（一台主機時 2 名，兩台時 1 名，三台時沒有）：Austin、Ava、Logan、Hailey、Evan、Charlotte、Kylie、Hunter、Gianna、Eli、Henry、Chase、Claire、Brooklyn、Zoe、Samantha、Dylan、Luke；主機會抽一個安插他們的隊友種子，其餘隨機（docs/sv_raid.md，隊友）"
"the unlock stage the partners come from, which sets their pool, their level being four fifths of --raid-pokemon's; by default --raid-progress's, six stars for a black crystal or a seven-star event raid" = "隊友來自的解鎖階段，決定可選池，其等級為 --raid-pokemon 的五分之四；預設取 --raid-progress，黑色結晶或七星活動團體戰為六星"
"serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)" = "用外掛的對戰伺服器（NAME 或載入的第一個）從該站點主持團體戰對戰：主機與我們的寶可夢打一場；僅限一台主機；失敗時按未指定處理，交出網路（docs/sv_raid.md，主持對戰）"
"PROTO:PORT:HEX, a reliable data message to send once the console has joined (host seq 1 on that port, INITIALIZED); repeatable" = "PROTO:PORT:HEX，主機加入後發送的可靠資料訊息（該連接埠上主機序號為 1，INITIALIZED）；可重複"

# 高級選項：朱/紫 加入（sv-join / sv-raid-join / sv-circle-join）
"join only a console searching with this Link Code; empty takes any" = "只加入以此連接碼搜尋的主機；留空則接受任意"
"local communication id to join, hex; default is either cartridge's" = "要加入的本地通訊 ID，十六進位；預設為任一卡帶的 ID"
"join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys" = "透過 ldn_mitm 經區域網路加入一台模擬主機，而不是走無線網卡：無需 root、phy 或 prod.keys"
"--ip-join: the emulator's address" = "--ip-join：模擬器的位址"
"--ip-join: our own address" = "--ip-join：我們自己的位址"
"--ip-join: seconds to wait for one ldn_mitm scan answer" = "--ip-join：等待一次 ldn_mitm 掃描應答的秒數"
"seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it" = "掃描時每個頻道停留的秒數；主機的開放窗口只有幾秒，停留太久會錯過"
"how long to keep trying" = "持續嘗試的時長"
"how long to stay in one joined session before scanning again" = "在已加入的連線中停留多久再重新掃描"
"the LDN node name we publish" = "我們發布的 LDN 節點名稱"
"the station platform byte we publish; 1 is what a Switch 2 sends" = "我們發布的站點平台位元組；1 是 Switch 2 發送的值"
"set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back" = "關聯前設定網卡的 MAC，例如 48:f1:eb:11:22:33。Pia 從 MAC 推導站點的固定 id，兩台主機都是任天堂 OUI 而網卡不是。啟動器中的驅動重載會還原網卡自己的位址"
"join only a network of this LDN scene: 4 a Link Trade, 7 a Tera Raid" = "只加入該 LDN 場景的網路：4 為連接交換，7 為太晶團體戰"
"join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console" = "加入主機主持的太晶團體戰大廳並帶上這份隊伍記錄，需通過 PKHeX 合法性檢查；我方玩家會準備、回應開始並在對戰開始時離開，其寶可夢繼續為主機作戰"
"seconds in the raid lobby before our player readies" = "進入團體戰大廳後多少秒我方玩家準備"
"join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)" = "像加入團體戰的賓客那樣加入主機主持的聯盟圓環：入座、發送我們的身分、開啟遊戲頻道、回應主機的開始、把我們玩家放到主機玩家所在的位置並保持 --hold 時長（docs/sv_union_circle.md）"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "配合 --union-circle：任務完成後我方玩家離開圓環並結束執行：snacksworth 把主機缺少的每種點心傳說寶可夢的組隊與單人通關記錄送給主機，從開始演示結束起每秒一條；bp 則送給主機一筆 --bbq-clear BP 的通關獎勵"
"the BP, 1 to 9999999, --circle-task bp gives" = "--circle-task bp 贈送的 BP，1 到 9999999"
"with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it" = "配合 --union-circle：我方玩家模仿主機玩家的移動、動畫和坐騎，與其保持 5 米並面向它"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "配合 --union-circle：圓環開始演示結束 10 秒後，在距主機玩家 15 到 25 米處保持 3 隻該種類（dev 編號）的野生寶可夢，如同主機分享自己的野生寶可夢：被主機對戰、移除或距離超過 50 米的個體會再次出現在附近"
"Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)" = "太晶屬性，按屬性順序 0 一般到 17 妖精（預設 %(default)s）"
"held item id" = "攜帶道具 id"
"0 to 255 (default random)" = "0 到 255（預設隨機）"
"1 female (default 0)" = "1 為雌性（預設 0）"
"0 to 24 (default random)" = "0 到 24（預設隨機）"
"six IVs 0 to 31 (default each random, as a wild one's)" = "六項個體值，各 0 到 31（預設各自隨機，與野生個體相同）"
"ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)" = "特性槽位，2 為隱藏特性（預設隨機取 0 或 1，與野生個體相同）"
"the mark the spawn carries, by PKHeX's RibbonIndex (53 Lunchtime to 97 Slump; default none)" = "生成個體攜帶的證章，按 PKHeX 的 RibbonIndex（53 午餐到 97 消沉；預設無）"
"with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)" = "配合 --spawn：只當主機站在 PKHeX 認可該生成個體可捕捉的區域時才生成，區域由主機的主機分享的野生寶可夢推斷（我方玩家靠近後它才會分享：--follow-host）"
"report what the console advertises and join nothing" = "只報告主機廣播的內容，不加入任何網路"
"send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one" = "以零售版版面發送 Pia Session 加入請求（docs/sv.md，Session 加入請求）：十個協定及其版本、一個四位元組 nonce、兩個位置 id、一個七位元組站點位址和一條玩家記錄。網狀加入是單播，被動抓包看不到零售版的請求"
"after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here" = "入座後，在 0x81 連接埠 1（我們的站點流）上發送這條 1395 位元組身分記錄作為遊戲的資料交換，重傳直到主機確認。零售加入者在此發送自己的身分"
"do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers" = "不發送克隆時鐘請求。已入座的加入者會先在其他一切之前在 0x77 上發送十八個零位元組，由主機回應"
"announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)" = "在 0x7c 上通告我們自己的頻道表。站點透過發送對端在連接埠 1 發出的同款 31 位元組表、連接埠 2 的開啟以及之後每次表更新的鏡像來開啟遊戲頻道；只有我們通告之後，對端才會在連接埠 0 上把資料交給遊戲（docs/sv.md）"
"send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference" = "在 0x81 連接埠 1 上按序號順序把該目錄的記錄作為我們自己的發送，取代 --mirror-records，這樣可以重播整套真實身分，而不是把主機的鏡像回去；預設使用 pokeldn.sv.reference 中錄製的記錄集"
"send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed" = "把主機放到 0x81 連接埠 0 的每條記錄按順序在連接埠 1 上作為我們自己的發回。零售加入者會用自己的一套記錄回應主機的記錄；這裡用遊戲自己編寫的記錄來填滿這套"
"seconds after the seat before the first identity record goes out" = "入座後多少秒再發出第一條身分記錄"
"do not acknowledge the host's messages on the game's reliable channel 0x7c" = "不確認主機在遊戲可靠頻道 0x7c 上的訊息"
"send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)" = "隨頻道表直接發送遊戲在 0x7c 連接埠 2 上的 3 型加入，而不是等主機在 0x80 連接埠 2 上的 7 型通告再回應。成對的加入者會回應通告（docs/sv.md，連接埠 2）"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主機於 0x7c 連接埠 1 通告金鑰 0x80 開啟後指定秒數發送。站點的身分是 0x7c 連接埠 0 上的四條訊息（兩個片段各兩次），在通告之前從該連接埠發出的任何內容都到不了遊戲；可重複；預設為 pokeldn.sv.reference 中的身分片段"
"a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本加入者提供的 348 位元組記錄的檔案（原始位元組或十六進位文字；352 位元組的遊戲訊息會剝去標頭）。指定後，加入者用自己的報價回應主機的報價、確認、提交，並像成對加入者一樣跟隨四個交換步驟（pokeldn.sv.trade）。可重複：第二份及之後的記錄在同一座位中提供，每次交換一份，隨每次交換結束"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存前寫入所提供記錄的欄位，使用 pokeldn.sv.pokemon 的欄位名：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重複，單獨的 `shiny` 會按記錄自身的 id 隨機出一個異色性格值"
"a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text" = "把主機自己的報價寫入此檔案，即其 80 00 02 00 訊息的 348 位元組本文，以十六進位文字保存"
"seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer" = "在主機金鑰 0x80 開啟後多少秒由加入者先報價；不指定時加入者回應主機的報價"
"seconds after the host's confirmation before the joiner's own" = "主機確認後多少秒加入者再確認"
"seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind" = "主機確認後多少秒加入者提交；成對的加入者在自己確認 1.5 秒後提交，其主機也以同樣方式回應"
"end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold" = "主機超過這麼多秒完全沒有發送任何內容時結束該座位並回到掃描。在主機開放階段之外建立的關聯不會有流量；不設此項時執行會一直佔滿整個 --hold 時長"
"end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold" = "在主機要求我們接管主持角色（Session 7 型）這麼多秒後結束座位並回到掃描。實測中發出該請求的主機之後只發送 NetStartHostMigration；不設此項時執行會一直佔座到 --hold 結束"
"hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s" = "收到主機的 NetStartHostMigration（Net 0x40）後仍保持座位。預設加入者在收到第一個時離開：主機正在銷毀其網路，會重發直到所有用戶端離開，最長 4 秒"
"end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s" = "入座後超過這麼多秒主機仍未在 0x80 連接埠 2 上通告時結束座位並回到掃描。座位可以把每條流走完卻始終沒有通告（docs/sv.md，未解之謎）；開發板上完成交換的座位分別在 5.8 和 7.7 秒時通告"
"when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration" = "當主機在通告前把主持角色交給我們（並非玩家離開）時，離開其網路並以相同頻道和連接碼用 bin/sv_host.py 成為主機，如同 bin/pla_join.py；需要 --answer-migration"
"answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over" = "用 8 型確認回應主機的 7 型帶主持遷移的離開，告知它我們接受其移交的主持角色"
"do not answer a Session type-5 station update with the type 6" = "不用 6 型回應 Session 5 型站點更新"
"hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)" = "入座後等待這麼久再發送 Session 加入請求。WaitMember（3 到 4 秒）結束仍無人加入的主機會帶著主持遷移離開，因此在它的離開等待中被接受的加入會引發 7 型訊息（docs/sv.md，什麼決定座位）"
"with --session-join, re-send it every N seconds (0 sends it once)" = "配合 --session-join：每 N 秒重發一次（0 表示只發一次）"
"the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)" = "加入請求中的 16 位元組玩家 id：'arceus'（1 後跟 0，作為兩個大端 u64，即零售阿爾宙斯聲明的值）、'random'、'high'（以 0xff 開頭的隨機值）或 32 位十六進位數。朱主機自己的是 10047bd4a25543e057cee5c71ab1f2a2（sv18）"
"the player name in the join request's one player record; a retail console's is a single space" = "加入請求中那條玩家記錄裡的玩家名字；零售主機的是一個空格"
"the message flags on the join request; a joining Arceus sends 0x01, skip the source check, on every repeat of it" = "加入請求的訊息旗標；加入的阿爾宙斯在每次重發中都發送 0x01，跳過來源檢查"
"the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own" = "加入請求封包標頭中的目標變數 id：0（加入的阿爾宙斯所用），或主機自己的 id"
"answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)" = "用 0x12 確認回應主機的 Net 0x11。零售加入者不回應，而該確認會讓主機轉而請求主持遷移（sv08）"
"seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own" = "允許關聯本身耗費的秒數；主機開放階段在連線中途結束時，ldn.connect 會一直阻塞且自身沒有逾時"
"seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join" = "加入回應之後（未用 --session-join 時為入座之後）多少秒再發出十一個確認和兩個流開啟；零售加入者在加入 0.75 秒後開啟"
"seconds between our own RTT requests (0 sends none)" = "我們自己 RTT 請求的間隔秒數（0 表示不發送）"
"answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)" = "延遲 SECONDS 秒再回應每個 RTT 請求；RTT 樣本供主機的重傳計時器使用（docs/sv.md）"
"acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)" = "對已經持有的記錄，每條流每 SECONDS 秒至多確認一次；新記錄立即確認。0 表示每次都確認（docs/sv.md）"
"ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)" = "確認收到最高 id 的下一個號，不帶遮罩，而不是像零售站點那樣確認連續段加遮罩（docs/sv.md）"
"the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body" = "我們批次確認上的 Pia 訊息旗標；0xa0 是兩台零售站點發送的值，第 5 位壓縮訊息本文"
"entries in the ack payload; a retail station sends four" = "確認負載中的條目數；零售站點發送四條"
"the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header" = "可靠標頭的目標位元；3 會加上零售站點發送的四位元組點陣圖，0 則保留九位元組標頭"
"rotate every combination of --ack-flags, --ack-entries and --ack-dest-bits through the seat, one per --ack-sweep-period, and print each as it goes live. One seat then says which shape the guest parses" = "在座位中輪換 --ack-flags、--ack-entries 和 --ack-dest-bits 的每種組合，每個 --ack-sweep-period 切換一種並在生效時列印。這樣一個座位就能看出對方能解析哪種形態"
"seconds each sweep variant stays live" = "每種輪換形態生效的秒數"
"seconds between the periodic bulk acks on every stream the host uses" = "在主機使用的每條流上，週期性批次確認的間隔秒數"
"send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer" = "發送到主機位址而不是 LDN 廣播位址。兩台零售站點都會廣播每個 Pia 封包（sv11），廣播無需對端的 ARP 解析"
"print the RTT traffic too" = "也列印 RTT 流量"
"with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way" = "配合 --union-circle：也列印我們發送的每條圓環訊息和區域搜尋的每一步；無論是否列印，--capture 檔案都會記錄這些步驟"

# 高级选项：其他游戏
# 高级选项：剑/盾（Sword/Shield）
"`ping` content N's 10000-base holder at the 0x84 snapshot ack, before either side offers. The console's box send is gated on a ready bool at content+0x4c that only `0x010ce040` sets, on a zero result code; until then every command the game tries to send is parked in content+0x48. A parked command that does not match the next one sets the error byte +0x4d, and `0x010c9bb0` turns that into trade state 9: abort, with nothing on the application layer" = "在 0x84 快照確認時向 content N 的 10000 基址 holder 傳送 `ping`，早於任何一方的報價。主機的盒子傳送受 content+0x4c 處一個 ready 布林值控制，只有 `0x010ce040` 會在結果碼為零時置位；在此之前，遊戲嘗試傳送的每條命令都停在 content+0x48。停駐的命令若與下一條不匹配，就會置位錯誤位元組 +0x4d，`0x010c9bb0` 會把它變成交換狀態 9：中止，應用層沒有任何動作"
"0 is accepted" = "0 會被接受"
"0 makes the game roll one" = "0 會讓遊戲隨機產生一個"
"0x80 (the broadcast reliable window, the default: it asks us for sequence 1 once a second) or 0x7c (the unicast one, which has never had an ack to send us because it has never had our data)" = "0x80（廣播可靠視窗，預設值：它每秒向我們要一次序號 1）或 0x7c（單播視窗，它從來沒有確認可傳給我們，因為它從未有過我們的資料）"
"a .pk8 to put in --offer-slot in place of the snapshot's record: stored or party form, encrypted or PKHeX's decrypted export. Its OT name and ids become the snapshot's unless --offer-file-as-is. Repeatable, one per trade on the session: the console's player picks again from the box; the last serves every later trade" = "要放入 --offer-slot 以替代快照記錄的一個 .pk8：儲存形態或隊伍形態，加密形式或 PKHeX 解密匯出的形式。其 OT 名稱和 ID 會成為快照的，除非指定 --offer-file-as-is。可重複，會話中每次交換一個：主機的玩家會再次從盒子中挑選；最後一個會用於之後所有交換"
"a .pokegift or 720-byte .wc8 record to send instead of building one" = "要傳送的 .pokegift 或 720 位元組的 .wc8 記錄，而不是建構一個"
"a 3456-byte trade snapshot to send back on 0x84 once the console sends its own, or live (the default under --preset trade) for the console's own from this session. A short 2965-byte payload is inflated first. The identity is rewritten by --snapshot-name/-tid/-sid" = "一個 3456 位元組的交換快照，在主機傳送自己的快照後於 0x84 回傳，或使用即時模式（--preset trade 下的預設值）使用本次會話中主機自己的快照。較短的 2965 位元組負載會先被填充。身分資訊會由 --snapshot-name/-tid/-sid 重寫"
"a Dynamax Adventure (Max Lair) guest: the lobby, the paths and the battles; use with --scene 50000" = "極巨巢穴（Dynamax Adventure）訪客：大廳、路線和對戰；與 --scene 50000 一起使用"
"a Max Raid den guest: after the snapshot send PlayerInfo, BattleReady and SelectPokemon (the --offer-slot Pokemon); use with --scene 60006" = "極巨團體戰巢穴訪客：在快照之後傳送 PlayerInfo、BattleReady 和 SelectPokemon（即 --offer-slot 的寶可夢）；與 --scene 60006 一起使用"
"a PK8 to place in the offered party slot, encrypted or PKHeX export. Repeatable, one per trade: the player trades again from the box, or searches again; the last serves every later trade" = "要放入所提供隊伍欄位的 PK8，加密形式或 PKHeX 匯出形式。可重複，每次交換一個：玩家會再次從盒子交換，或重新搜尋；最後一個會用於之後所有交換"
"a reward row, item id and count; up to 15; none gives an emulated den's rows" = "一行獎勵，包含道具 ID 和數量；最多 15 行；不指定則使用模擬巢穴的獎勵行"
"a ribbon index; repeatable" = "緞帶索引；可重複"
"a SECOND stream, on --send2-protocol, sent once the console says --send2-trigger. `60ea000012020801` is BlockDataHolder{imReady:true}, which the console says on 0x80 and waits on" = "第二條流，使用 --send2-protocol，在主機說出 --send2-trigger 後傳送。`60ea000012020801` 是 BlockDataHolder{imReady:true}，主機在 0x80 上傳送它並等待它"
"accept without waiting for the joiner's acceptance, as a player would; for our own joiner, which accepts after its partner" = "像玩家一樣接受，而不等待加入方的接受；用於我們自己的加入方，它在夥伴之後接受"
"ACK the console's 0x84 fragments (kind 0x21, a contiguous base and a bitmask). Nothing here has ever acked this protocol, which is why the console retransmits one snapshot 19142 times and never moves on" = "確認主機的 0x84 分片（kind 0x21，一個連續基址和一個位元遮罩）。此前沒有任何實作確認過這個協定，這就是主機把一個快照重傳 19142 次卻從不動向下一步的原因"
"acknowledge the 0x7C reliable window. The pass signal is the retransmits STOPPING and the sequence ids moving on" = "確認 0x7C 可靠視窗。通過的訊號是重傳停止且序號繼續前進"
"advertise 0x00, hex; a searching Sword joins only a larger one than its own; default 0xFFFF and two random bytes" = "要廣播的 0x00，十六進位；搜尋中的劍只會加入比自己的值更大的；預設 0xFFFF 加兩個隨機位元組"
"after answering an RPC pair, send BOTH members again with the clock advanced by this much. The console advances its own pair's clock by 2 each burst (b41c, b61c, b81c). A repeated clock is a repeated state, so an answer that carries one clock never moves ours. 0 is off" = "在答覆一個 RPC 對之後，再次傳送兩個成員，並把時鐘推進這個量。主機每輪會把自己那對的時鐘推進 2（b41c、b61c、b81c）。重複的時鐘是重複的狀態，所以攜帶同一時鐘的答覆永遠不會推進我們的時鐘。0 表示關閉"
"after our offer is acknowledged, send `ping` on content N's 10000-base holder for each N - `382700000a00` for 40, which is exactly the opener nxldn-lab's client sends to start the confirmation phase, rebuilt here from our own content registry rather than copied" = "在我們的報價被確認後，對每個 N 在 content N 的 10000 基址 holder 上傳送 `ping` —— 40 對應 `382700000a00`，這正是 nxldn-lab 的用戶端為啟動確認階段所傳送的開場訊息，此處由我們自己的 content 註冊表重建，而非照抄"
"after our offer is acknowledged, send boxSyncStateCommand{data:N} on the trade holder for each N in turn, one per acknowledged sequence. 20030 is a BoxSyncStateDataHolder and its field 2 is a command enum; this project 1 offers and 2 withdraws; 4 confirms and 5 withdraws the confirmation" = "在我們的報價被確認後，依次對每個 N 在交換 holder 上傳送 boxSyncStateCommand{data:N}，每個已確認的序號傳送一次。20030 是 BoxSyncStateDataHolder，其欄位 2 是一個命令列舉；本專案 1 表示報價、2 表示撤回；4 表示確認、5 表示撤回確認"
"after our offer is acknowledged, send imReady on the TRADE holder (20030). The console has never sent these bytes and the published client waits for them before it offers, so it may be our turn to say them" = "在我們的報價被確認後，在 TRADE holder（20030）上傳送 imReady。主機從未傳送過這些位元組，而已發布的用戶端在報價前會等待它們，所以也許輪到我們來說"
"after the ack, sweep the version-4 connection request on protocol 0x14" = "在確認之後，在協定 0x14 上掃描版本 4 的連線請求"
"after the CONFIRMATION content answers our syncCommand with a hash, re-arm the 40040 pair and send BOTH members again at this clock delta - the move --selection-final-delta makes on 40050, which carries the selection phase past its own hash" = "在 CONFIRMATION content 用雜湊答覆我們的 syncCommand 後，重新裝載 40040 對，並以這個時鐘增量再次傳送兩個成員 —— 這正是 --selection-final-delta 在 40050 上所做的動作，它讓選擇階段越過自己的雜湊"
"after the selection HASH is answered, send the 40050 pair AGAIN - both members - at this clock delta. nxldn-lab's `selection_final_delta` is 9 (nxldn-lab's `selection_final_delta`). --rpc-pair latches per envelope, so the second pair needs the latch cleared. 0 is off" = "在選擇雜湊被答覆後，以這個時鐘增量再次傳送 40050 對 —— 兩個成員都要。nxldn-lab 的 `selection_final_delta` 是 9（nxldn-lab 的 `selection_final_delta`）。--rpc-pair 按信封鎖存，所以第二對需要清除鎖存。0 表示關閉"
"after the station handshake closes, send the Mesh Protocol (0x18) join request and ack whatever comes back" = "在站點握手關閉後，傳送 Mesh Protocol（0x18）加入請求，並確認返回的任何內容"
"an encrypted party PK8 sent as our rental instead of the offered one" = "作為我們的租用寶可夢傳送的加密隊伍 PK8，而非所提供的那隻"
"answer a connection request the CONSOLE sends us with a connection response" = "用連線回應來答覆主機發給我們的連線請求"
"answer each payload the console sends ONCE instead of re-deriving an answer to its last payload every period. `said` never clears, so without this an offer goes out hundreds of times. The console sends each of its own messages once" = "對主機傳送的每個負載只答覆一次，而不是每個週期都重新推導對其最後一個負載的答覆。`said` 從不清除，所以沒有這個選項時一個報價會被發出數百次。主機自己的每條訊息只傳送一次"
"answer every DISTINCT (envelope, base, field-5 body) in the 40000 band once, on top of the opening pair. The clock advances on every message so the payload cannot be the key, but the body can: `00000000` and `000018fc` are the openers and anything else is new. A per-envelope guard stops answering at the hash body and stalls there" = "對 40000 頻段中每個不同的（信封、基址、欄位 5 主體）各答覆一次，此外還有開場對。時鐘隨每條訊息推進，所以負載不能作為鍵，但主體可以：`00000000` 和 `000018fc` 是開場者，其他任何值都是新的。按信封的守衛會在雜湊主體處停止答覆並卡在那裡"
"answer the confirmation content's four-byte steps with phase N in the LOW u16 instead of echoing the console's own. The console reads its phase out of exactly those bytes (`0x006d6490` stores them, `0x006d3260` reads them), and every step this project has sent so far echoed the value back unchanged" = "用位於低位 u16 的階段 N 來答覆確認 content 的四位元組步驟，而不是回顯主機自己的值。主機會恰好從這些位元組中讀取自己的階段（`0x006d6490` 儲存它們，`0x006d3260` 讀取它們），而本專案迄今傳送的每個步驟都把值原樣回顯"
"answer the console's 0x58 RTT requests. Sixteen bytes at version 4, and the reply echoes the seven bytes nothing has read yet" = "答覆主機的 0x58 RTT 請求。版本 4 下為十六位元組，答覆會回顯那七個尚無人讀取的位元組"
"answer the console's 40030 RPC as the PAIR it is: collect both members one per base, 10000 then 20000, keyed on the BASE FIELD. `payload[5] in (0x19, 0x1A)` is the inner length and moves with the sender's station-id varint (0x1A/0x1B on some consoles). Send both once in that order and nothing more on this window; `said_by_port` keeps only the last payload, so a mirror sends one member repeatedly and never the other" = "把主機的 40030 RPC 當作它本來的對來答覆：按基址欄位歸鍵，每個基址收集一個成員，先 10000 後 20000。`payload[5] in (0x19, 0x1A)` 是內部長度，會隨發送方的站點 ID varint 變化（某些主機上是 0x1A/0x1B）。按該順序各傳送一次，然後在此視窗上不再傳送；`said_by_port` 只保留最後一個負載，所以鏡像實作會反覆傳送一個成員而從不傳送另一個"
"answer the console's MIGRATION_START on 0x18 port 1 with a MIGRATION_RESPONSE. `440001` arrives there only when the player accepts, and the console goes silent on every window afterwards: the last thing it asks for is two bytes of mesh, not application data" = "用 MIGRATION_RESPONSE 答覆主機在 0x18 連接埠 1 上的 MIGRATION_START。只有當玩家接受時 `440001` 才會到達那裡，之後主機在所有視窗上都會靜默：它最後要的是兩位元組的 mesh，而不是應用資料"
"answer the trade RPC on its OWN Pia port with its own reliable window. The console sends them on 0x7C port 1; an answer on port 0 lands on a window it does not read them on" = "在交換 RPC 自己的 Pia 連接埠上用它自己的可靠視窗答覆。主機在 0x7C 連接埠 1 上傳送它們；在連接埠 0 上的答覆會落在它不讀取這些內容的視窗上"
"answer with `pokeldn.swsh.trade.SYNC_ANSWERS` instead of echoing one payload: the ping, and the three other sync holders the console is expected to raise after the trade snapshot. A payload with no rule is REPORTED and left unanswered - that report is the point of the run" = "用 `pokeldn.swsh.trade.SYNC_ANSWERS` 答覆，而不是回顯一個負載：即 ping，以及主機在交換快照之後預期會發起的另外三個 sync holder。沒有規則的負載會被報告並保持未答覆 —— 該報告正是這次執行的意義"
"any other record field by name: shiny_type=3, ball=1, held_item=236, gender=1, nature=10, ability_type=2, iv_hp=31, dynamax_level=10, gigantamax=1, tid=12345, sid=54321 ..." = "按名稱指定的任何其他記錄欄位：shiny_type=3、ball=1、held_item=236、gender=1、nature=10、ability_type=2、iv_hp=31、dynamax_level=10、gigantamax=1、tid=12345、sid=54321 ……"
"between our own fragments" = "在我們自己的分片之間"
"between whole re-sends; the console retransmits its own until acked" = "在整次重送之間；主機會重傳自己的內容直到被確認"
"build the record in --offer-slot instead of sending it as it came: this national dex number, in the party record the snapshot advertises AND in the offer, so the two still tell one story" = "在 --offer-slot 中建構記錄，而不是按原樣傳送：使用這個全國圖鑑編號，既寫入快照所宣稱的隊伍記錄，也寫入報價，這樣兩者仍然講述同一個故事"
"byte [1]. 0xFD is what 0x017c1700 compares against; anything else is the instrument that says the handler was reached" = "位元組 [1]。0xFD 是 0x017c1700 所比較的值；其他任何值都是表明已到達處理常式的探針"
"bytes written over the record at OFFSET before sealing, for the fields no name covers (0x15=0b for the title index); repeatable" = "在封存前覆寫寫入記錄 OFFSET 處的位元組，用於沒有名稱涵蓋的欄位（0x15=0b 表示稱號索引）；可重複"
"clear [3], which makes the console skip the variable-id comparison" = "清除 [3]，這會讓主機跳過變數 ID 比較"
"compress the message, the way the console compresses every 0x80 message it sends. The flag is the Pia message's (0x10 at version 4), so this is free either way - and it is one variable, so sweep it alone" = "壓縮訊息，就像主機壓縮它傳送的每條 0x80 訊息那樣。該旗標屬於 Pia 訊息（版本 4 下為 0x10），所以無論設不設定都沒有代價 —— 而且它只是一個變數，所以可以單獨掃描它"
"draw a new encryption constant and PID for every offered Pokemon" = "為每個被提供的寶可夢產生新的加密常數和 PID"
"draw a new encryption constant and PID for the offered Pokemon" = "為被提供的寶可夢產生新的加密常數和 PID"
"end with box command 3 and MIGRATION_START, as the retail Sword that led our joiner did; by default the host keeps the session" = "以盒子命令 3 和 MIGRATION_START 結束，就像引導我們加入方的零售版劍所做的那樣；預設情況下主機會保留會話"
"fixed ack id for the join request; random when omitted" = "加入請求的固定確認 ID；省略時隨機"
"four move ids, comma-separated; 0 empties a slot. PP is left as the template had it" = "四個招式 ID，以逗號分隔；0 會清空一個欄位。PP 保持模板中的值"
"hex; defaults to Sword's 0x0100abf008968000" = "十六進位；預設為劍的 0x0100abf008968000"
"host a Dynamax Adventure (Max Lair) lobby whose legendary is this species; the host leaves once the adventure starts (docs/swsh_raid.md)" = "主持一個傳說寶可夢為該物種的極巨巢穴（Dynamax Adventure）大廳；冒險開始後主持人會離開（docs/swsh_raid.md）"
"host a Max Raid den lobby with this boss instead of a Link Trade (docs/swsh_raid.md)" = "主持一個以該首領為 Boss 的極巨團體戰巢穴大廳，而不是連線交換（docs/swsh_raid.md）"
"host a Max Raid with a boss of this Wild Area Event delivery (an EventsGallery 'Index NNN' folder) instead of --raid-boss; its rewards unless --raid-reward (docs/swsh_raid.md, Event raids)" = "主持一場極巨團體戰，其首領來自這個曠野地帶活動的派發（EventsGallery 的「Index NNN」資料夾），而不是 --raid-boss；除非指定 --raid-reward，否則使用其獎勵（docs/swsh_raid.md，活動團體戰）"
"host a session for a console in Sword's LAN mode on this IP network (docs/swsh_session.md, LAN mode); no radio, no root, no keys" = "為此 IP 網路上處於劍的 LAN 模式的主機主持一個會話（docs/swsh_session.md，LAN 模式）；無需無線，無需 root，無需金鑰"
"how far to advance a trade RPC's clock in our answer. 5 is nxldn-lab's and is the one number in this path nothing here has measured" = "在我們的答覆中把交換 RPC 的時鐘推進多少。5 是 nxldn-lab 的值，也是這條路徑上唯一一個此處尚未測量過的數字"
"how long to keep retransmitting if nothing acknowledges it; 0 sends until the run ends" = "在沒有收到任何確認時繼續重傳多久；0 表示一直傳送到執行結束"
"how long to retransmit the join request; Pia's own joiner gives up at 10" = "重傳加入請求的時長；Pia 自己的加入方在 10 時放棄"
"how long to wait for the station acceptance before giving up on joining" = "在放棄加入之前等待站點接受多久"
"how long to wait for the station handshake before giving up on sending" = "在放棄傳送之前等待站點握手多久"
"how many sequence ids of ours to send in all; 0 has no limit. One message does not hold the console's state; it sends its own heartbeat about 580 times in 180 s" = "總共傳送多少個我們的序號；0 表示不限制。一條訊息不足以維持主機的狀態；它在 180 秒內會傳送自己的心跳約 580 次"
"how often to broadcast it; the console sent one about every 2 s" = "廣播它的頻率；主機大約每 2 秒傳送一次"
"how often to retransmit the migration response until it is acked" = "在遷移回應被確認之前，重傳它的頻率"
"--ip-join: our own address on that LAN" = "--ip-join：我們在該 LAN 上的自身位址"
"--ip-join: the address a scan leaves from; default --our-ip" = "--ip-join：掃描發出的位址；預設為 --our-ip"
"join a console in Sword's LAN mode over the IP network: its address, the subnet broadcast, or auto for every local /24 (docs/swsh_session.md, LAN mode); no radio, no keys" = "透過 IP 網路加入處於劍的 LAN 模式的主機：其位址、子網廣播，或 auto 表示每個本地 /24（docs/swsh_session.md，LAN 模式）；無需無線，無需金鑰"
"join an emulated console hosting over ldn_mitm on the LAN; no radio, no root, no keys. Each of --scans waits --dwell seconds for an answer" = "加入一個透過 ldn_mitm 在 LAN 上主持的模擬主機；無需無線，無需 root，無需金鑰。每次 --scans 都會等待 --dwell 秒以取得答覆"
"keep the file's own OT name and trainer ids" = "保留檔案自身的 OT 名稱和訓練家 ID"
"--lan from a loopback address: the address a console on this machine believes it has; default this machine's own" = "--lan 從回送位址發出：本機上某台主機認為自己擁有的位址；預設為本機自己的位址"
"--lan: our station port" = "--lan：我們的站點連接埠"
"--lan: seconds of silence that mean the console left" = "--lan：多少秒的靜默表示主機已離開"
"--lan: seconds to repeat the host request before the station handshake" = "--lan：在站點握手之前重複主機請求的秒數"
"--lan: the console's broadcast address; default --lan's /24" = "--lan：主機的廣播位址；預設為 --lan 的 /24"
"--lan: the maximum the session info states" = "--lan：會話資訊所宣告的最大值"
"--lan: the session maximum to browse for; default 4 for a raid or adventure, 2 for a trade" = "--lan：瀏覽時尋找的會話最大值；團體戰或冒險預設為 4，交換預設為 2"
"--lan: the subnet broadcast address the console's challenge uses" = "--lan：主機的挑戰所使用的子網廣播位址"
"LDN advertisement protocol version" = "LDN 廣播協定版本"
"leave this long after the legendary is sent; a computer partner then takes our seat and picks our rental" = "在傳說寶可夢傳送後等待這麼久再離開；隨後電腦夥伴會坐上我們的位置並挑選我們的租用寶可夢"
"make --open-content send our PK8 on the 10000-base holder instead of an empty `ping`. The ping opens content 50 and is taken as our Pokemon: the console reaches the confirmation phase and asks the player to trade theirs for an egg. Same moment, same holder, a Pokemon in it" = "讓 --open-content 在 10000 基址 holder 上傳送我們的 PK8，而不是空的 `ping`。該 ping 會開啟 content 50，並被當作我們的寶可夢：主機會進入確認階段，並要求玩家用自己的寶可夢換一個蛋。同一時刻、同一 holder，裡面放一隻寶可夢"
"offer back the exact PK8 the console just offered us, unchanged, instead of one out of --send-snapshot. These bytes came out of its own save, so a run that still aborts rules the record out" = "原樣回傳主機剛剛提供給我們的那個 PK8，而不是來自 --send-snapshot 的一個。這些位元組出自它自己的存檔，所以仍然中止的執行可以排除該記錄"
"once a hash body has been answered, `ping` content N's 10000-base holder on port 0 to open the next phase - 40 is the confirmation, so this sends `382700000a00`. The console stops sending 40050 once the hash answer lands and says nothing further; Pia retransmits anything it still waits on, so that silence means satisfied and the next phase needs opening" = "一旦雜湊主體被答覆，就在連接埠 0 上 `ping` content N 的 10000 基址 holder 以開啟下一階段 —— 40 是確認階段，因此這裡會傳送 `382700000a00`。雜湊答覆到達後，主機便停止傳送 40050，並不再說任何東西；Pia 會重傳它仍在等待的任何內容，所以那種靜默意味著已滿足，而下一階段需要開啟"
"once a hash body has been answered, open content N's phase by sending the two-member RPC pair for it (40 is the confirmation). A pair is the only shape that opens a phase on this console: 40030 opened the offer and 40050 the selection. A bare content ping (`382700000a00`) and a bare sync-120 ping (`780000000a00`) are both ignored" = "一旦雜湊主體被答覆，就透過傳送該 content N 的兩成員 RPC 對來開啟它的階段（40 是確認階段）。對是在這台主機上開啟階段的唯一形態：40030 開啟了報價，40050 開啟了選擇。裸 content ping（`382700000a00`）和裸 sync-120 ping（`780000000a00`）都會被忽略"
"once a hash body has been answered, send `ping` on sync holder N (120 is the confirmation's) on port 0. The console drives 97, 60000, 110 and 130 itself and opens the selection phase when 130's pingSynced lands; it never sends 120. A phase follows its sync, not a content ping" = "一旦雜湊主體被答覆，就在連接埠 0 上向 sync holder N 傳送 `ping`（確認階段的是 120）。主機會自己驅動 97、60000、110 和 130，並在 130 的 pingSynced 到達時開啟選擇階段；它從不傳送 120。階段跟隨它的 sync，而不是 content ping"
"once the confirmation ladder has produced its first step, end the run as soon as SECONDS pass with no NEW step body: stop transmitting, drop the link and let the console report a lost connection. Holding a stalled ladder open with acks instead makes the game declare the TRADE failed, which costs the player about an hour. Nothing but acks follows the last step body. 0 is off and the hold runs in full." = "一旦確認階梯產生了第一個步驟，那麼在沒有新步驟主體的情況下經過 SECONDS 秒就結束執行：停止傳送、斷開鏈路，並讓主機報告連線遺失。反之，用確認把停滯的階梯保持開啟會讓遊戲宣布交換失敗，這會讓玩家損失約一小時。最後一個步驟主體之後只有確認。0 表示關閉，此時會完整執行保持流程。"
"once the migration makes us the host, broadcast UPDATE_MESH the way the console did: its own last one with the host index set to ours. The console stops sending these once it hands the role over, and the mesh is gone about 1.3 s later if nothing takes over" = "一旦遷移讓我們成為主持人，就按主機的方式廣播 UPDATE_MESH：用它自己的最後一條，並把主持人索引設為我們的。主機一旦移交該角色就停止傳送這些，而如果沒有東西接管，mesh 會在約 1.3 秒後消失"
"optional saved Sword 0x84 snapshot; otherwise use the joining console's snapshot from this session" = "可選的已儲存劍 0x84 快照；否則使用本次會話中加入主機的快照"
"optional Sword advertisement (hex, raw, or swsh_net_facts.json); without one, build a fresh station record" = "可選的劍廣播（十六進位、原始資料或 swsh_net_facts.json）；沒有則建構一個全新的站點記錄"
"our own station variable id; fresh random when omitted, because a reused one is 'already one of my stations' on BDSP" = "我們自己的站點變數 ID；省略時隨機產生新的，因為在 BDSP 上重複使用的 ID 會變成「already one of my stations」"
"our player readies this long after the guest's lobby opens" = "我們的玩家在訪客的大廳開啟後等待這麼久再準備"
"per reading" = "每個讀數"
"Pia port(s) for our 0x84 messages; the console sends on 0" = "我們 0x84 訊息所使用的 Pia 連接埠；主機在 0 上傳送"
"Pia retransmits an unacknowledged join request every 500 ms" = "Pia 每 500 毫秒重傳未獲確認的加入請求"
"press ready this many seconds after the host acked the lobby messages" = "在主持人確認大廳訊息後這麼多秒按下準備"
"put our PK8 in field 5 of the 40050 pair's second member. Content 50 is PokemonTradeDataHolder, the transfer; content 30 is the box exchange. A 344-byte PK8 rides that field" = "把我們的 PK8 放入 40050 對中第二個成員的欄位 5。Content 50 是 PokemonTradeDataHolder，即傳輸；content 30 是盒子交換。一個 344 位元組的 PK8 搭載在該欄位中"
"put the console first in BattleStart and framework object 0, so it serves the battle and the board answers as a client (docs/swsh_raid.md)" = "在 BattleStart 和框架物件 0 中把主機放在第一位，這樣由它來主持對戰，而面板作為用戶端答覆（docs/swsh_raid.md）"
"queue a sync on holder N right behind our selection offer, in the branch that actually runs when --selection-offer is on. --sync-after-hash cannot fire there: this one can" = "在我們的選擇報價之後立即在 holder N 上排隊一個 sync，放在 --selection-offer 開啟時實際執行的那個分支裡。--sync-after-hash 在那裡無法觸發：這一個可以"
"readings of the header byte at 0x05, in order; the IV's source id follows each one" = "0x05 處標頭位元組的讀數，按順序排列；每個讀數後面緊跟 IV 的來源 ID"
"replace the three ids at the front of the snapshot's profile (pseudo device id, account Uid, network service account id). They are the console's own, handed back unchanged otherwise" = "替換快照設定檔最前面的三個 ID（偽裝置 ID、帳號 Uid、網路服務帳號 ID）。它們是主機自己的，否則會原樣交回"
"scans for a matching search (--scene) before giving up" = "放棄之前進行的匹配搜尋（--scene）的掃描次數"
"seconds after acceptance before the first data message, so the mesh join and the RTT exchange are already running when it lands" = "接受之後到第一條資料訊息之間的秒數，這樣當它到達時 mesh 加入和 RTT 交換已經在執行"
"seconds between requests; the console answered BDSP's in 40 ms" = "請求之間的秒數；主機在 40 毫秒內答覆了 BDSP 的請求"
"seconds between the queued post-offer payloads. Spread them so the sweep spans the accept: the console tears down on the accept, not on a timer, so commands sent inside a couple of seconds all land before it" = "排隊的報價後負載之間的秒數。把它們分散開，使掃描覆蓋接受時刻：主機在接受的瞬間拆除，而不是按計時器，所以在幾秒內傳送的命令都會在它之前到達"
"seconds each fragment stays on the air" = "每個分片在空中停留的秒數"
"seconds of listening before the first packet out, so the capture holds the console's own rate to compare against" = "在發出第一個封包之前監聽的秒數，這樣擷取中就包含主機自己的速率可供對比"
"seconds past --hold to keep a session whose trade is under way: the console has offered and the ladder has not finished" = "超過 --hold 後繼續保留交換正在進行中的會話的秒數：主機已報價而階梯尚未完成"
"seconds without an update session that count as the rebroadcast stopping - the console sends ten a second, so this is fifteen missed" = "沒有更新會話即視為重廣播停止的秒數 —— 主機每秒傳送十個，所以這是漏掉十五個"
"send APPLICATION DATA once the mesh is up - the first of the project. The payload as hex; \"610000000a00\" is the six bytes the console repeats at us on 0x7C. Nothing is sent without this flag" = "在 mesh 建立後傳送 APPLICATION DATA —— 本專案的第一次。負載以十六進位給出；「610000000a00」是主機在 0x7C 上反覆向我們傳送的六個位元組。沒有此旗標則不會傳送任何內容"
"send back whatever the console last said on this protocol, rather than the fixed --send-data. --send-data is still the first payload, before the console has said anything" = "回傳主機在此協定上最後說的內容，而不是固定的 --send-data。--send-data 仍然是在主機說任何內容之前的第一條負載"
"send our own 40050 pair the moment the console says id 130 pingSynced, before its own selection burst. nxldn-lab's client opens the selection phase this way and nothing here has ever opened one; the console sends 820000001a00 in our own captures 0.3 s before its 40050 burst" = "在主機說出 id 130 pingSynced 的瞬間、即它自己的選擇突發之前，傳送我們自己的 40050 對。nxldn-lab 的用戶端以這種方式開啟選擇階段，而此處從未開啟過；在我們自己的擷取中，主機會在其 40050 突發前 0.3 秒傳送 820000001a00"
"send our PK8 as a Data on elementId 10000 and as a holder on the 30000-base id (30050), which every content registers. More than one variable at once" = "把我們的 PK8 作為 Data 傳送到 elementId 10000，並作為 holder 傳送到 30000 基址的 ID（30050），後者每個 content 都會註冊。一次涉及多個變數"
"send the --raid-boss file's own level, IVs, nature, size and PID instead of a den seed's; a console's catch then fails PKHeX's raid check (docs/swsh_raid.md, A boss a catch keeps legal)" = "傳送 --raid-boss 檔案自身的等級、個體值、性格、大小和 PID，而不是巢穴種子的；這樣主機的捕獲會無法通過 PKHeX 的團體戰檢查（docs/swsh_raid.md，A boss a catch keeps legal）"
"send the requests to the console rather than the broadcast address" = "把請求傳送給主機而不是廣播位址"
"send them to the broadcast address instead" = "改為傳送到廣播位址"
"send these box commands as soon as the console acks our 0x84 snapshot - BEFORE either side offers a Pokemon. The game sends command 3 exactly once, on the first frame after its trade session is built and only when the role bit at session+0x419 is clear (0x010c9bb0), so one of the two sides owes the other an opener before anything else happens. Sent after both offers instead, the console leaves while the player is still picking" = "在主機確認我們的 0x84 快照後立即傳送這些盒子命令 —— 早於任何一方提供寶可夢。遊戲只傳送命令 3 一次，在其交換會話建構後的第一幀，且僅當 session+0x419 處的角色位元為清除狀態（0x010c9bb0），所以兩方中有一方欠另一方一個開場，之後才會有其他事情發生。若改為在雙方報價之後傳送，主機就會在玩家還在挑選時離開"
"send these box commands the moment MIGRATION_START arrives - the only signal that says the player pressed accept. The console keeps acking for about five seconds after it" = "在 MIGRATION_START 到達的瞬間傳送這些盒子命令 —— 這是唯一表明玩家按下接受的訊號。之後主機會持續確認約五秒"
"send to the console rather than the broadcast address" = "傳送給主機而不是廣播位址"
"set a field of the League Card the console may keep after the trade (pokeldn.swsh.league_card: name, trainer_id, dex_owned, poke1_species, ...)" = "設定主機在交換後可能保留的訓練家卡欄位（pokeldn.swsh.league_card：name、trainer_id、dex_owned、poke1_species、……）"
"six IVs, comma-separated, in PKHeX's HP,ATK,DEF,SPE,SPA,SPD order" = "六個個體值，以逗號分隔，按 PKHeX 的 HP,ATK,DEF,SPE,SPA,SPD 順序"
"store the gift on the ESP32 board, which then advertises it with no computer at every power-up, and exit" = "把禮物儲存到 ESP32 板子上，之後它在每次上電時無需電腦即可廣播它，然後退出"
"test only, for bin/swsh_connect.py: act as a console host's player: after a trade with another --offer-file queued, offer it from the box this many seconds after the ladder, without waiting for the joiner's offer" = "僅測試用，針對 bin/swsh_connect.py：扮演某台主機主持人的玩家：在一次交換後若佇列中還排有另一個 --offer-file，就在階梯結束後這麼多秒從盒子提供它，而不等待加入方的報價"
"the ability id of the built record; --offer-species leaves the template's ability where it was" = "建構記錄的特性 ID；--offer-species 會把模板的特性留在原處"
"the adventure seed (ChikaBattleSeed): the rentals and encounters; random by default" = "冒險種子（ChikaBattleSeed）：租用寶可夢和遭遇；預設隨機"
"the BattleSeed value; random by default" = "BattleSeed 的值；預設隨機"
"THE CONTROL. Ack a sequence id the console never sent: a rebroadcast that carries on under --seq-delta 1 is what attributes a stop under 0 to the ack's CONTENT rather than to our merely having transmitted" = "對照組。確認一個主機從未傳送過的序號：在 --seq-delta 1 下仍繼續的重廣播，正是把 0 下的停止歸因於確認的內容、而非僅僅歸因於我們傳送過這一點的依據"
"the experience word at 0x10 of the built record" = "建構記錄在 0x10 處的經驗值字"
"the handshake form of --confirm-command: send the NEXT of these on each new four-byte body the confirmation content puts on elementId 20000. Content 40's own machine sends 0,1,2,3 and parks after each; one command buys two rungs and then the ladder stops" = "--confirm-command 的握手形式：每當確認 content 在 elementId 20000 上給出新的四位元組主體時，傳送其中這些值的下一個。Content 40 自己的狀態機傳送 0,1,2,3 並在每次之後停駐；一個命令可以換取兩級，然後階梯就會停止"
"the header's destination list. \"console\" names its station constant id, which is what its own broadcast acks do to us; \"none\" sends count 0, which 0x01859578 never filters and every 0x7C message carries. \"auto\" mirrors the console per protocol: none on 0x7C, the console on 0x80" = "標頭的目標清單。「console」使用它的站點常數 ID，這正是它自己的廣播確認對我們要做的；「none」傳送計數 0，0x01859578 從不篩選它，且每條 0x7C 訊息都會攜帶。「auto」按協定鏡像主機：0x7C 上為 none，0x80 上為 console"
"the header's own 'lowest sequence pending ack'. We have sent nothing on this protocol, so 1 (the next id we would use) and 0 are both readings; the console itself sends 1 while waiting on its own first message" = "標頭自身的「lowest sequence pending ack」。我們在此協定上尚未傳送任何內容，所以 1（我們接下來會使用的 ID）和 0 都是讀數；主機自己在等待它的第一條訊息時會傳送 1"
"the LDN scene id to seat in: 60001 a Link Trade search; any takes the first Sword network (a Max Raid den, docs/swsh_gift.md)" = "要落座的 LDN 場景 ID：60001 為連線交換搜尋；任意值則取第一個劍網路（一個極巨團體戰巢穴，docs/swsh_gift.md）"
"the level byte at 0x148 of the built record, 1..100; the experience word is left alone unless --offer-experience is given" = "建構記錄在 0x148 處的等級位元組，範圍 1..100；除非指定 --offer-experience，否則經驗值字保持不變"
"the Link Code the player searches with, e.g. 12345678; none by default" = "玩家搜尋所用的連線密碼，例如 12345678；預設不設"
"the lobby's LDN scene; by default the console's own lobby's, found by a scan, else 50000 (docs/swsh_raid.md)" = "大廳的 LDN 場景；預設採用主機自己大廳的場景，透過掃描找到，否則為 50000（docs/swsh_raid.md）"
"the move slot our Pokemon uses every turn" = "我們的寶可夢每回合使用的招式欄位"
"the name the raid lobby shows for us" = "團體戰大廳為我們顯示的名字"
"the network's own name" = "網路自身的名稱"
"the nickname of the built record; sets the nicknamed flag" = "建構記錄的暱稱；會設定已起暱稱旗標"
"the offer place we take; by default the first the host left" = "我們佔據的提供位置；預設是主持人留下的第一個"
"the original trainer name of the built record" = "建構記錄的初訓家名稱"
"the party slot we offer" = "我們提供的隊伍欄位"
"the Pia message port. The console sends its 0x80 acks on 0 AND 1, each packet carrying both; \"0,1\" mirrors that" = "Pia 訊息連接埠。主機在 0 和 1 上傳送其 0x80 確認，每個封包都攜帶兩者；「0,1」即鏡像這一點"
"the Pia port the join travels on; the update mesh uses the reliable one" = "加入所經過的 Pia 連接埠；更新 mesh 使用可靠的連接埠"
"the --raid-boss boss is Gigantamax; a retail console accepts it where a base den holds that Gigantamax Pokemon (docs/swsh_raid.md)" = "--raid-boss 的首領是超極巨化；當基礎巢穴容納該超極巨化寶可夢時，零售版主機會接受它（docs/swsh_raid.md）"
"the retransmit interval. A window retransmits until it is acked" = "重傳間隔。視窗會重傳直到被確認"
"the sequence id. 1 is what both windows ask for; the first message also carries FLAG_IS_INITIALIZED and DEFINES where the stream starts" = "序號。兩個視窗要求的都是 1；第一條訊息還攜帶 FLAG_IS_INITIALIZED 和 DEFINES，用於指明流的起點"
"the station BITMAP on 0x58 and 0x7C. The console sends 2 to us, station index 1; 1 is the bit for station 0, which is the console" = "0x58 和 0x7C 上的站點 BITMAP。主機發給我們的是 2，即站點索引 1；1 是站點 0 的位，也就是主機"
"the stream id. 0 is what the console sends on both protocols" = "流 ID。主機在兩個協定上都傳送 0"
"the tested flag set: 'capture' records the console's party snapshot, 'trade' needs --send-snapshot, 'raid' a Max Raid den guest, 'lair' a Dynamax Adventure guest" = "測試用的旗標集合：「capture」記錄主機的隊伍快照，「trade」需要 --send-snapshot，「raid」為極巨團體戰巢穴訪客，「lair」為極巨巢穴訪客"
"values for byte [0x10]" = "位元組 [0x10] 的取值"
"values for byte [1], list or LO-HI" = "位元組 [1] 的取值，清單或 LO-HI"
"values for the header byte at 0x05 on the requests, and their IV source id; list or LO-HI" = "請求中 0x05 處標頭位元組的取值，及其 IV 來源 ID；清單或 LO-HI"
"values for the MESSAGE flags byte. 0x09 is what the console puts on its own Local Protocol messages; BDSP's station requests carry 0x11" = "MESSAGE 旗標位元組的取值。0x09 是主機在自己的 Local Protocol 訊息上使用的值；BDSP 的站點請求攜帶 0x11"
"values for the platform byte at [2]. 9 is the real one; ANY other value is answered with a connection response rather than dropped, which is the probe for whether our message reaches the 0x14 handler at all" = "[2] 處平台位元組的取值。9 是真正的值；任何其他值都會以連線回應答覆而不是被丟棄，這就是用來探測我們的訊息是否到達 0x14 處理常式的探針"
"wait for this payload on --send2-protocol before sending; omit to send as soon as the mesh is up" = "傳送前在 --send2-protocol 上等待這個負載；省略則在 mesh 建立後立即傳送"
"what to send when the console migrates the mesh. \"auto\" sends MIGRATION_FINISH when the start names US as the next host and a MIGRATION_RESPONSE when it names anyone else, which is what the binary says. \"response\" always answers 0x48, for comparison" = "當主機遷移 mesh 時傳送什麼。「auto」在開始訊息把「我們」指定為下一個主持人時傳送 MIGRATION_FINISH，指定其他任何物件時傳送 MIGRATION_RESPONSE，這正是二進位檔所說的。「response」總是答覆 0x48，用於對比"
"when the CONFIRMATION envelope (40040) sends a four-byte status whose body ends `0100` - the same cue the selection content sends before its Pokemon - reply with SyncSaveDataHolder{syncCommand{data:N}} on that content's 10000-base holder, id 10040, reliable port 0, and answer the status itself on port 1. Content 40 takes a command and not a Pokemon: its parser 0x010df6d0 accepts one submessage carrying one int32. Its own machine sends 0, 1, 2 and 3 in that order (swsh_trade.SYNC_COMMANDS)" = "當 CONFIRMATION 信封（40040）傳送一個主體以 `0100` 結尾的四位元組狀態時 —— 這與選擇 content 在其寶可夢之前傳送的提示相同 —— 在該 content 的 10000 基址 holder（ID 10040，可靠連接埠 0）上用 SyncSaveDataHolder{syncCommand{data:N}} 答覆，並在連接埠 1 上答覆狀態本身。Content 40 接受命令而不是寶可夢：其解析器 0x010df6d0 接受一條攜帶一個 int32 的子訊息。它自己的狀態機按該順序傳送 0、1、2 和 3（swsh_trade.SYNC_COMMANDS）"
"when the console follows its selection-phase Pokemon with the status whose body ends `0100`, offer OUR Pokemon on that content's 10000-base holder (id 10050) on reliable port 0 and answer the status on port 1" = "當主機在其選擇階段的寶可夢之後跟上一個主體以 `0100` 結尾的狀態時，在該 content 的 10000 基址 holder（ID 10050）上、透過可靠連接埠 0 提供我們的寶可夢，並在連接埠 1 上答覆該狀態"
"when the hosting console leaves, ack its update session carrying the host-migration state and leave the network on its START_HOST_MIGRATION, as its own clients do; each step waits 10 s unanswered" = "當主持的主機離開時，確認其攜帶主持人遷移狀態的更新會話，並在其 START_HOST_MIGRATION 上離開網路，就像它自己的用戶端所做的那樣；每個步驟都會等待 10 秒無人答覆"
"WHEN to open the selection phase with a 40050 pair on 0x7c port 1. \"offer\" sends it as soon as our offer is acknowledged, the only window the console is still reading in; \"migration\" sends it on the migration start, after the console has stopped. The pair is the same envelope as the console's own 40030 at offset 50 with our station id; the builder reproduces its 40030 pair byte for byte" = "何時在 0x7c 連接埠 1 上用 40050 對開啟選擇階段。「offer」在我們的報價被確認後立即傳送它，這是主機仍在讀取的唯一視窗；「migration」在遷移開始時傳送它，此時主機已經停止。該對與主機自己的 40030 在偏移 50 處是同一信封，但用我們的站點 ID；建構器會逐位元組復現它的 40030 對"
"which of the 32 ack slots to fill; \"all\" (the default) fills every one, because only the slot at some station index is read and whose index it is has not been settled. \"0\" is the console, \"1\" is us" = "要填充 32 個確認槽中的哪些；「all」（預設）會填充每一個，因為只會讀取某個站點索引處的槽，而該索引究竟是誰的尚未確定。「0」是主機，「1」是我們"
"which party slot of --send-snapshot to offer back, 1-6; 0 offers nothing and only records what the console offers us" = "回傳 --send-snapshot 的哪個隊伍欄位，1-6；0 不提供任何東西，只記錄主機提供給我們的內容"
"which SyncPingDataHolder field --sync-after-hash sends: 1 ping, 2 pingReply, 3 pingSynced (`780000001a00`, the one the trace records)" = "--sync-after-hash 傳送 SyncPingDataHolder 的哪個欄位：1 為 ping，2 為 pingReply，3 為 pingSynced（`780000001a00`，即追蹤記錄中的那個）"
"while the confirmation ladder waits on the console, send our 40040 pair again every SECONDS with its clock advanced to the present. 0 is off" = "在確認階梯等待主機期間，每隔 SECONDS 秒再次傳送我們的 40040 對，並把它的時鐘推進到當前。0 表示關閉"
"whose constant and variable id go in the response's two id fields - a deduction, so 'both' alternates them across the retransmits" = "回應中兩個 ID 欄位放入誰的常數 ID 和變數 ID —— 這是一種推斷，所以「both」會在多次重傳中交替使用它們"
"with --migrate, ladder done to box command 3 and the migration" = "配合 --migrate 時，階梯完成後執行盒子命令 3 和遷移"
"with --raid-event: roll each drop's chance as a den does, or give every drop" = "配合 --raid-event：像巢穴一樣為每個掉落物抽取機率，或給出每個掉落物"
"with --raid-event: the boss, numbered as the list printed without it" = "配合 --raid-event：首領，編號方式與不帶此選項時列印的清單一致"
"with --raid-event: the den area whose table the boss comes from" = "配合 --raid-event：首領所來自的表對應的巢穴區域"
"with --raid-event: the star rank, 1 to 5" = "配合 --raid-event：星級，1 到 5"
"with --raid-event: whose table the boss comes from; the advertisement's version by default" = "配合 --raid-event：首領來自哪個表；預設為廣播的版本"
"with --selection-offer, answer the console's selection status with our PK8 in field 5 (`body`) of a 40050 Data carrying OUR ownerId, on the RPC port, instead of a PokemonTradeDataHolder on 10050 port 0. Content 50's receive handler resolves the sender to a station index and drops silently when it cannot; the holder shape carries no owner" = "配合 --selection-offer 時，在 RPC 連接埠上用一個攜帶「我們」ownerId 的 40050 Data、在其欄位 5（`body`）中放入我們的 PK8，來答覆主機的選擇狀態，而不是在 10050 連接埠 0 上使用 PokemonTradeDataHolder。Content 50 的接收處理常式會把發送方解析為站點索引，無法解析時就會靜默丟棄；holder 形態不攜帶所有者"
"with --selection-offer, answer the selection status with our PK8 as a PokemonTradeDataHolder on the 20000-base holder (id 20050), which is where the BOX phase's own Pokemon rides one content over. Overrides --selection-offer-mirror and --selection-offer-data" = "配合 --selection-offer 時，把我們的 PK8 作為 PokemonTradeDataHolder 放在 20000 基址 holder（ID 20050）上來答覆選擇狀態，這正是 BOX 階段自己的寶可夢在隔一個 content 處搭載的位置。會覆蓋 --selection-offer-mirror 和 --selection-offer-data"
"with --selection-offer, answer the selection status with our PK8 in a 40050 carrying the console's OWN field set - syncId, clock, body, and neither elementId nor ownerId, which is how its own selection offer decodes. Overrides --selection-offer-data" = "配合 --selection-offer 時，把我們的 PK8 放在一個攜帶主機「自己」欄位集的 40050 中來答覆選擇狀態 —— syncId、clock、body，且既無 elementId 也無 ownerId，這正是它自己的選擇報價解碼的方式。會覆蓋 --selection-offer-data"
"write the joiner's Pokemon here; trade N > 1 writes FILE-N" = "在此寫入加入方的寶可夢；交換 N > 1 時寫入 FILE-N"
"write the PK8 the console offers to this file; trade N > 1 writes FILE-N" = "把主機提供的 PK8 寫入此檔案；交換 N > 1 時寫入 FILE-N"
"write the PK8 we will offer to this file, before the radio is touched" = "在觸碰無線之前，把我們將要提供的 PK8 寫入此檔案"
"write the record and its fragments here and exit" = "在此寫入記錄及其分片，然後退出"

# 高级选项：钻石/珍珠（BDSP）
"1 against an expected 0 is a guaranteed 'version is too high'" = "1 與預期的 0 相比，必定得到「version is too high」"
"3 is French" = "3 為法語"
"a comma-separated list of ids to probe instead" = "改為探測的 id 列表，以逗號分隔"
"a game message to put on the reliable stream before the first --request-ids request, e.g. 0x59:01000100 to add station 1 to the console's match-wait list. Repeatable, sent in order" = "在第一個 --request-ids 請求之前放入可靠串流的一條遊戲訊息，例如 0x59:01000100 用於把站點 1 加入主機的匹配等待清單。可重複，依序發送。"
"a PB8 to offer (328 or 344 bytes, encrypted or PKHeX's decrypted export), edited by --trade-nickname and --trade-ot. 328 bytes hold much more than this project has identified, so what we send is a real Pokemon with named fields changed rather than one invented from nothing. Repeatable, one per trade in order; the last is offered again after the list" = "用於提供的 PB8（328 或 344 位元組，加密或 PKHeX 解密的匯出），由 --trade-nickname 和 --trade-ot 編輯。328 位元組包含的內容遠超本專案已識別的部分，因此我們發送的是一隻真實寶可夢，只改動了具名欄位，而不是憑空編造。可重複，依序每次交換一個；清單結束後會再次提供最後一個。"
"a protocol id the console does not register, so its version is 0" = "主機未註冊的一個協定 id，因此其版本為 0"
"ack the mesh join response, on the STATION protocol" = "在 STATION 協定上對網格加入回應進行確認"
"acknowledge the console's reliable data as it arrives" = "主機的可靠資料到達時即確認"
"after answering the talk reservation, send this game message on the reliable stream - `0x08:00` is NetDataSelectData{index: 0}. Repeatable, sent in order. The console parks in TalkState GREETING and waits to be advanced, and which message does it is not readable offline: this is the sweep handle" = "在應答交談預約之後，在可靠串流上發送這條遊戲訊息——`0x08:00` 是 NetDataSelectData{index: 0}。可重複，依序發送。主機會停在 TalkState GREETING 等待被推進，而究竟哪條訊息能推進它無法離線讀出：這是用於掃描的切入點。"
"after identifying, vary the variable id to find what result 7 tests" = "在識別之後，改變 variable id，以找出結果 7 所檢驗的內容"
"after the count, read each candidate protocol's registered version" = "計數之後，讀取每個候選協定的註冊版本"
"after the join, sweep the bulk acknowledgement until the console's reliable retransmission stops" = "加入之後，掃描批次確認，直到主機的可靠重傳停止"
"after the reliable handshake, send N position messages of our own and watch the console's screen" = "在可靠握手之後，發送 N 條我方位置訊息，並觀察主機的畫面"
"after the station handshake, send up to N mesh join requests" = "在站點握手之後，最多發送 N 個網格加入請求"
"after the walk, send a NetDataTranerCardData for our own station. It is the message that says what a player LOOKS like, and the probe is whether the character the game drew for us changes on screen" = "行走之後，為我們自己的站點發送一條 NetDataTranerCardData。這條訊息描述玩家【看起來是什麼樣】，而探測點在於遊戲為我們繪製的角色是否會在畫面上發生變化。"
"after the walk, send a NetRequestData for each of these data ids, one at a time on the reliable stream, and print what comes back. The Union Room answers six ids (docs/bdsp_protocol.md); 0x22 is the opaque one" = "行走之後，針對這些 data id 各發送一條 NetRequestData，在可靠串流上一次一條，並列印返回的內容。聯盟交誼廳會應答六個 id（docs/bdsp_protocol.md）；0x22 是含義不明的那一個。"
"after THEY answer our approach, send this message - the initiator's own next one. `0x06:0000000000` is NetDataTalkData{sexId 0, CHECK}, which is what SwitchTalkStateMine builds. Repeatable, sent in order" = "在【對方】應答我們的接近之後，發送這條訊息——發起方自己的下一條。`0x06:0000000000` 是 NetDataTalkData{sexId 0, CHECK}，正是 SwitchTalkStateMine 所建構的內容。可重複，依序發送。"
"answer a NetDataTalkReserveData with a NetDataTalkReserveResultData. unanswered, the player's character freezes" = "用 NetDataTalkReserveResultData 應答一條 NetDataTalkReserveData。若不應答，玩家的角色會卡住不動。"
"answer NetDataTradeReadyOkData (0x21) with tradeState=WAIT and LET THE TRADE COMPLETE. THIS WRITES THE CONSOLE'S SAVE: the message is the only writer of the console's `targetTradeState`, both states at WAIT move UnionTradeManager to SECURIY_TRADE, and TradeStateModel$$InitState calls PlayerSave. The Pokemon the player picked leaves their box and ours takes its place. Needs --trade-reply. ASK THE USER FIRST" = "以 tradeState=WAIT 應答 NetDataTradeReadyOkData（0x21），並【讓交換完成】。【這會寫入主機的存檔】：該訊息是主機 `targetTradeState` 的唯一寫入者，兩個狀態都為 WAIT 時會把 UnionTradeManager 推進到 SECURIY_TRADE，而 TradeStateModel$$InitState 會呼叫 PlayerSave。玩家選中的寶可夢會離開其盒子，由我們的寶可夢取而代之。需要 --trade-reply。【請先詢問使用者】"
"answer the console's NetDataReturnSelectData, a round reset, ONCE; the answer has no measured effect" = "應答主機的 NetDataReturnSelectData（一次回合重置），且僅【一次】；該應答沒有測得任何效果。"
"answer the console's NetRequestData with the message it names. It has asked for data id 0x23 in every capture since the first join and has never been answered; this is the probe, so arm it on its own" = "用它所指定的訊息應答主機的 NetRequestData。自第一次加入以來，它在每次擷取中都請求 data id 0x23，卻從未得到應答；這就是本次探測，因此請單獨啟用它。"
"answer the console's request for NetDataIsMatchWaitData (0x23) with isMatchWait=1 instead of 0. ONE comparison in UnionRoomManager$$SetNetData gates the trade on it (`cmp w23, #1` at main.bin 0x01fd56e4, then UnionFrontDeskTradeController$$StartMatch); every run has answered 0, which is a station declining to be matched" = "用 isMatchWait=1 而非 0 應答主機對 NetDataIsMatchWaitData（0x23）的請求。UnionRoomManager$$SetNetData 中【一處】比較據此控制交換能否進行（main.bin 0x01fd56e4 處的 `cmp w23, #1`，隨後是 UnionFrontDeskTradeController$$StartMatch）；每次執行都應答 0，也就是站點拒絕被匹配。"
"answer the console's RTT requests (protocol 0x58) while we hold the seat" = "在我們佔用座位期間應答主機的 RTT 請求（協定 0x58）"
"answer the console's trade messages with ours. It sends a trainer record and then a Pokemon and waits; with neither answered the player sits on \"En attente d'une reponse\". THIS DOES NOT COMPLETE A TRADE - the player still confirms on their own screen, and declining there leaves the save untouched" = "用我方的訊息應答主機的交換訊息。它會先發送一條訓練家記錄，然後是一隻寶可夢，並等待；若兩者都不應答，玩家會停留在「En attente d'une reponse」。【這不會完成一次交換】——玩家仍需在自己的畫面上確認，在那裡拒絕則不會改動存檔。"
"answer the ready-ok, after which the console writes its save" = "應答 ready-ok，此後主機會寫入其存檔"
"APPROACH the console's character instead of waiting to be approached. Picking an emote locks a player in place waiting to be interacted with, so a recruiting console can only be reached by someone walking up to it. Waits for its broadcast state to say it is advertising, then sends NetDataTalkReserveData - the console's own bytes, 63 00 01 00" = "【主動接近】主機的角色，而不是等待被接近。選擇表情會把玩家鎖定在原地等待被互動，因此招募中的主機只有靠他人走上前才能觸及。等待其廣播狀態表明正在招攬，然後發送 NetDataTalkReserveData——主機自己的位元組 63 00 01 00。"
"default the Union Room's, or the password room's with --password" = "預設為聯盟交誼廳的，使用 --password 時為密碼房間的"
"Grand Underground: once the console's NetZoneData arrives, send a NetUgJoinData in its zone at its position plus --join-offset-x/z" = "地下大洞窟：一旦主機的 NetZoneData 到達，就在其區域、以其位置加上 --join-offset-x/z 發送一條 NetUgJoinData"
"host the room the player enters with this password, e.g. 00000000" = "以該密碼開設玩家進入的房間，例如 00000000"
"how long one connection request waits for its answer" = "一個連線請求等待其應答的時長"
"how long silence has to last to count as an ack that landed" = "靜默持續多久才算一次已送達的確認"
"how long to host" = "作為主機持續多久"
"how long to keep acking the mesh join response; the host repeats it every 500 ms until it is acknowledged" = "持續確認網格加入回應的時長；主機會每 500 ms 重發一次，直到被確認"
"how many times to ack the acceptance; the console repeats it until acked" = "確認接受訊息的次數；主機會重複發送直到被確認"
"how many times to retransmit the approach before giving up" = "放棄前重傳接近訊息的次數"
"how many values of the byte at offset 1 to try" = "嘗試偏移 1 處位元組的取值個數"
"leave the network when the console host starts host migration (Local Protocol 0x13), which its player leaving the room sends; a station that stays sees it repeated for 10 s before the console closes its network" = "當主機開始主機遷移（Local Protocol 0x13）時離開網路，該訊息由主機玩家離開房間時發送；留在原處的站點會看到它重複 10 秒，隨後主機關閉其網路"
"NetDataTalkReserveResultData.IsCanTalk - 1 accepts the talk, 0 refuses it. A refusal is the SAFE probe: it should release the player rather than open a flow we cannot hold up" = "NetDataTalkReserveResultData.IsCanTalk——1 接受交談，0 拒絕。拒絕是 SAFE 探測：它應當釋放玩家，而不是開啟一段我們無法維持的流程。"
"NetJoinData.avatarId, which is what picks the MODEL: it indexes UnionCharacterTable and OpLoadCharacter loads that asset name. 8 is what the default, the girl the screen shows" = "NetJoinData.avatarId，它決定【模型】：該值索引 UnionCharacterTable，OpLoadCharacter 會載入對應的資源名。預設值為 8，即畫面上顯示的那個女孩。"
"NetJoinData.colorId. The game also derives one from the avatar id (OpcManager.GetNpcColorId), so this may not be the deciding field" = "NetJoinData.colorId。遊戲也會根據 avatar id 推導出一個值（OpcManager.GetNpcColorId），因此這可能不是決定性的欄位。"
"nickname for the offered Pokemon" = "所提供寶可夢的暱稱"
"offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常數提供它，保留異色狀態，使之前接受過它的存檔會再次接受它"
"only the broadcast pass, the framing the ack proved" = "僅廣播這一遍，即確認所證實的訊框格式"
"only the unicast pass, skipping the broadcast one" = "僅單播這一遍，跳過廣播那一遍"
"OT name for the offered Pokemon" = "所提供寶可夢的初訓家名"
"our Pia variable id; random by default" = "我方的 Pia variable id；預設為隨機"
"our trade trainer record" = "我方的交換訓練家記錄"
"poll this file and send each new `ID:HEX` line as a game message on the reliable window, retransmitted until acked. Lines are sent once, in order; `#` starts a comment" = "輪詢此檔案，把每一行新的 `ID:HEX` 作為遊戲訊息發送到可靠視窗，重傳直到被確認。各行只發送一次，依序；`#` 表示註解。"
"position messages in the burst pattern's walk. At the console's own stride, 60 is 55.8 units and leaves the Union Room entirely; pass 8 for a walk that ends where the screen can still see it" = "突發模式行走中的位置訊息條數。按主機自身的步幅，60 相當於 55.8 個單位，會完全走出聯盟交誼廳；傳入 8 可讓行走結束時仍留在畫面可見範圍內。"
"probe all 256 protocol ids, not only the ones the wiki names" = "探測全部 256 個協定 id，而不只是 wiki 中列出的那些"
"--room-pattern fixed: seconds a join has to draw the console's request for NetCharacterStateData before the next goes out" = "--room-pattern fixed：每次加入在下一個發出之前，用於引出主機對 NetCharacterStateData 請求的秒數"
"scans for the console's room before giving up; it may not exist yet" = "放棄前掃描主機房間的次數；它可能尚未存在"
"seconds after the console's NetZoneData before the Underground join" = "主機 NetZoneData 之後到地下加入之前的秒數"
"seconds after the player's trade emote before our character approaches (no walk)" = "玩家做出交換表情之後到我們的角色接近之前的秒數（不行走）"
"seconds after the walk before the first request" = "行走結束後到第一個請求之前的秒數"
"seconds between approach retransmissions" = "接近訊息重傳之間的秒數"
"seconds between one request landing and the next going out" = "一個請求送達與下一個發出之間的秒數"
"seconds between position messages in the burst pattern. The default is the console's own median gap" = "突發模式中位置訊息之間的秒數。預設為主機自身的中位間隔"
"seconds between repeats of our security-phase state, until the console reports SEND_READYOK. A CHILD console's SEND_READYOK only ends when a message arrives inside it" = "重複我方安全階段狀態的間隔秒數，直到主機報告 SEND_READYOK。CHILD 主機的 SEND_READYOK 只有在其收到一條訊息時才會結束"
"seconds between the approach answer and each --after-approach message" = "接近應答與每條 --after-approach 訊息之間的秒數"
"seconds between the talk answer and each --after-talk message" = "交談應答與每條 --after-talk 訊息之間的秒數"
"seconds per channel in the scan; 0.8 missed a live network twice" = "掃描中每個頻道的秒數；0.8 曾兩次漏掉一個活躍網路"
"seconds to wait after the console starts advertising before approaching" = "主機開始招攬後到接近之前的等待秒數"
"seconds to wait for a reply; every probe gets one, so this is short" = "等待回覆的秒數；每個探測都會得到一次，因此該值很短"
"send N well-formed connection requests and report what comes back" = "發送 N 個格式正確的連線請求，並報告返回的內容"
"square spawns one avatar per corner; line and fixed ask whether the game's idea of identity is the station or the position" = "square 在每個角落生成一個角色；line 和 fixed 用來判斷遊戲對身份的定義是站點還是位置"
"StateData.isRecruiment, the second byte of the same answer" = "StateData.isRecruiment，即同一應答的第二個位元組"
"the byte to answer it with (default 0, what a console answers a {1} with [0x1c27f48]; a {1} reads as our back-out and, past phase 2, shows 'the partner canceled the trade')" = "用於應答它的位元組（預設為 0，即主機對 {1} 給出的應答值 [0x1c27f48]；{1} 會被讀作我方退出，且在階段 2 之後顯示「the partner canceled the trade」）"
"the console's protocol count, if already measured; skips the sweep" = "主機的協定數量（若已測量）；會跳過掃描"
"the LDN protocol the advertisement is encrypted for" = "該廣播所加密用於的 LDN 協定"
"the name in OUR trainer record" = "我方訓練家記錄中的名字"
"the OnlineState we report when asked; 4 raises the trade bubble" = "被詢問時我們報告的 OnlineState；4 會顯示交換泡泡"
"the OpcState.OnlineState our character reports when the console asks for NetCharacterStateData. 0 NONE means \"doing nothing\" and is a character doing nothing; 3 RECRUITMENT_BATTLE, 4 RECRUITMENT_TRADE, 5 RECRUITMENT_RECORD, 6 RECRUITMENT_GREETINGS, 8 COMMUNICATE" = "當主機請求 NetCharacterStateData 時，我們的角色所報告的 OpcState.OnlineState。0 NONE 表示「什麼也不做」，即角色處於閒置；3 RECRUITMENT_BATTLE、4 RECRUITMENT_TRADE、5 RECRUITMENT_RECORD、6 RECRUITMENT_GREETINGS、8 COMMUNICATE。"
"the player name our side carries" = "我方攜帶的玩家名稱"
"the PlayerInfo language byte, a MsgLangId (3 is French); 1, 8, 9 and 10 cap the greeting's name at 6 characters, others at 12 (docs/bdsp_protocol.md)" = "PlayerInfo 的語言位元組，即 MsgLangId（3 為法語）；1、8、9 和 10 會把問候語中的名字限制在 6 個字元，其他則為 12 個（docs/bdsp_protocol.md）"
"the Pokemon we trade: a complete, legal, encrypted 328-byte PB8 whose PID the console's save does not already hold; repeatable, one per trade in order, the last offered again after the list" = "我們用於交換的寶可夢：一個完整、合法、加密的 328 位元組 PB8，其 PID 尚未被主機存檔持有；可重複，依序每次交換一個，清單結束後會再次提供最後一個。"
"the same on z" = "在 z 軸上的相同設定"
"units one position message spans. The default is what a console's own walk measures (0.93 units every 0.41 s, over 80 of its messages); our first walks did 0.15 every 0.6 s, which is a ninth of a real player's speed and is the whole of the stutter" = "一條位置訊息跨越的單位數。預設值取自主機自身行走的測量結果（0.93 個單位每 0.41 秒，基於其 80 條訊息）；我們最初的行走為每 0.6 秒 0.15，只有真實玩家速度的九分之一，這正是卡頓的全部來源。"
"when the console sends game message ID, answer once with the body in FILE (raw bytes, no header): 0x15:capsule.bin answers its ball capsule with ours, 0x14:record.bin its record" = "當主機發送遊戲訊息 ID 時，用 FILE 中的正文應答一次（原始位元組，無標頭）：0x15:capsule.bin 用我們的球殼回應它的球殼，0x14:record.bin 回應它的記錄。"
"where our character spawns relative to the console's own, on x. The default +2.0 is one fixed side, and a player standing against the wall on that side gets a character spawned out of bounds (followed by a crash). Negative puts it on the other side" = "我們的角色相對主機角色在 x 軸上生成的位置。預設的 +2.0 固定在一側，若玩家站在該側靠牆處，生成的角色位置會越界（隨後崩潰）。負值則置於另一側。"
"where our character stands: x,y,z,rot_y (a retail host's own spot)" = "我們的角色所站的位置：x,y,z,rot_y（零售主機的自身位置）"
"where to write the Pokemon the console offers; trade N > 1 writes FILE-N" = "寫出主機所提供寶可夢的路徑；交換 N > 1 時寫出 FILE-N"
"with --match-wait, ALSO send NetDataIsMatchWaitData{1} every S seconds for the whole hold (0 disables, leaving the answer-on-request). The console requests 0x23 once, at t=8.4-9.4, and the player reaches the trade option in the Y menu long after that" = "配合 --match-wait 時，在整個保持期間【也】每 S 秒發送 NetDataIsMatchWaitData{1}（0 表示停用，僅保留按請求應答）。主機只在 t=8.4-9.4 請求一次 0x23，而玩家要很久之後才會在 Y 選單中進入交換選項。"
"write the Pokemon the console offers in trade N to PREFIX_N.pb8" = "把第 N 次交換中主機提供的寶可夢寫入 PREFIX_N.pb8"

# 高级选项：传说阿尔宙斯（Legends Arceus）
"0 male, 1 female: the gender in our data exchange record; its look follows" = "0 為雄性，1 為雌性：我方資料交換記錄中的性別；其外觀隨之變化"
"0 male, 1 female: the gender in that record, whose look follows it" = "0 為雄性，1 為雌性：該記錄中的性別，其外觀隨之而定"
"act as the player too: offer once the host shows, confirm once it offers, then selector 7; without it the console's player leads" = "也扮演玩家：房主出現後即提供，其提供後即確認，然後選擇器 7；若不用此選項，則由主機的玩家主導"
"after answering phase 3, wait for the console's phase 6, then leave without answering it; this deliberately triggers the game's trade restriction" = "應答階段 3 之後，等待主機的階段 6，然後不應答便離開；這會故意觸發遊戲的交換限制。"
"after the response, send a type-5 station-list update (sets job+0x7c). Its per-station layout is provisional pending the 0x739050 decode" = "在回應之後，發送一次類型 5 的站點清單更新（設定 job+0x7c）。其逐站點佈局在 0x739050 解碼完成前只是暫定的。"
"also send an RTT request, which a peer answers with no state at all" = "同時再發送一個 RTT 請求，對端對其應答時不帶任何狀態"
"answer the console's clone-clock (0x77) with a host clock message; the console's ClockProtocol is parked in state 4 and an inbound clock message resets its state machine (report 157)" = "用一條主機時鐘訊息應答主機的 clone-clock（0x77）；主機的 ClockProtocol 停在狀態 4，而收到時鐘訊息會重置其狀態機（報告 157）。"
"destination bitmap word, big-endian at wire[9]; the console drops a message unless the bit for its own station index (1) is set, so bit 1 = 0x2" = "目的位元圖字，在 wire[9] 處按大端序；除非自身站點索引（1）對應的位被置位，主機會丟棄該訊息，因此位 1 = 0x2。"
"destination-bit count on the host's reliable message; 2 so the console's own station index (1) is in range of the body destination-bitmap check" = "房主可靠訊息中的目的位數量；設為 2 可使主機自身站點索引（1）落在正文目的位元圖檢查的範圍內。"
"do not answer a join request with the type-1 ack (buys 8 s, completes nothing)" = "不要用類型 1 的確認應答加入請求（可爭取 8 秒，但什麼也完成不了）"
"do not answer a join request with the type-2 join response" = "不要用類型 2 的加入回應應答加入請求"
"give the board this station MAC first" = "先為板卡指定這個站點 MAC"
"hex, 16 bytes: the host's player id in the station-list update, a real principal id in place of the placeholder" = "十六進位，16 位元組：站點清單更新中房主的玩家 id，用真實的 principal id 替代佔位符"
"hex, four bytes: the player id in our data exchange record" = "十六進位，4 位元組：我方資料交換記錄中的玩家 id"
"hex, sixteen bytes: the player id in the session join request" = "十六進位，16 位元組：會話加入請求中的玩家 id"
"hex: once the console speaks on reliable, send this as the host's own reliable seq-1 data (the game leaves at +10 s if the host never speaks)" = "十六進位：一旦主機在可靠串流上發言，就把其作為房主自己的 seq-1 可靠資料發送（若房主始終不發言，遊戲會在 +10 秒離開）"
"hex: the four-byte player id in that record" = "十六進位：該記錄中的 4 位元組玩家 id"
"hex: the personality value in the offered record. HYPOTHESIS: a record is shiny when the trainer id, the secret id and the two halves of this value exclusive-or to under 16, which is the Gen-6 rule and is untested here" = "十六進位：所提供記錄中的性格值。【假設】：當訓練家 id、裡 id 與該值的兩半異或結果小於 16 時記錄為異色，這是第六世代的規則，此處尚未驗證。"
"hold the Session join request this long after the host's first Net 0x11. A join the console accepts after its WaitMember draws the type 7 that hands us the host role (docs/pla.md, Joining a console's network)" = "在房主第一個 Net 0x11 之後保持會話加入請求這麼久。主機在其 WaitMember 之後接受的加入會引出類型 7，把房主角色交給我們（docs/pla.md, Joining a console's network）"
"how long one seat is held" = "一個座位保持多久"
"how long to hold the network up" = "保持網路運作的時長"
"how many times to send it; a console sends four" = "發送它的次數；主機會發送四次"
"--ip-join: hold one scan socket and connect the instant a fresh network appears, to land before the host latches its node list" = "--ip-join：保持一個掃描通訊端，一出現新網路就立即連線，以便在房主鎖定其節點清單之前接入"
"--ip-join: our address" = "--ip-join：我方位址"
"--ip-join: the console's address" = "--ip-join：主機的位址"
"join over ldn_mitm on the LAN; no radio and no root" = "透過區域網路上的 ldn_mitm 加入；無需無線電，也無需 root"
"keep the network up and go silent after the leave instead of ending the run; separates what a console reads in the leave from what it reads in the network going down. Also keeps the run (and BOOT marks) after a console leaves following a trade" = "在離開後保持網路運作並保持靜默，而不是結束本次執行；以此區分主機從離開訊息中讀到的內容與從網路關閉中讀到的內容。還會在主機交換後離開時保留本次執行（以及 BOOT 標記）。"
"offer a record of the host's own rather than the captured one: the same Pokemon under the data exchange's player name and id and a new identity, so the console is not offered the record it is itself holding" = "提供房主自己的記錄而不是擷取得到的記錄：同一隻寶可夢，使用資料交換中的玩家名稱和 id 以及新的身份，以免把主機自己持有的記錄提供給它。"
"offer the host's own Pokemon on the game channel: answer the console's trade box with one of ours at sequence 2 on port 0" = "在遊戲頻道上提供房主自己的寶可夢：在連接埠 0 上以序號 2 用我方的一隻寶可夢應答主機的交換框"
"offer the record under a new PID and encryption constant, drawn once per run, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常數提供該記錄，每次執行抽取一次，保留異色狀態，使之前接受過它的存檔會再次接受它。"
"offer this record file instead of the reference one; stored or party, encrypted or decrypted. Repeatable, one per trade in order; the last is offered again after the list" = "提供此記錄檔案而不是參考記錄；可為儲存或隊伍中，加密或解密。可重複，依序每次交換一個；清單結束後會再次提供最後一個。"
"once joined, echo RTT and acknowledge the reliable stream so the console does not time out after 12 s and leave" = "加入後，回顯 RTT 並確認可靠串流，使主機不會在 12 秒後逾時離開"
"once the mesh is running, send one Atomic (0x74) kind-0 announce; a probe for whether a host announce fills an element slot (report 163)" = "網格運作後，發送一次 Atomic（0x74）kind-0 通告；用於探測房主通告是否會佔用一個元素槽位（報告 163）"
"open the game's own reliable channel (0x7c) once the data exchange is done: answer the console's channel message, send the same back, and open the host's own port-0 channel, which is what the trade flow's step 0x20 ticks its network object for" = "資料交換完成後開啟遊戲自身的可靠頻道（0x7c）：應答主機的頻道訊息，回送相同內容，並開啟房主自己的連接埠 0 頻道，交換流程的第 0x20 步正是為它驅動網路物件"
"progress the host's reliable stream in lockstep: for each console reliable data message, send the host's own next-sequence data with the same payload (the console advances only as the host advances)" = "以同步方式推進房主的可靠串流：對主機的每條可靠資料訊息，發送房主自己的下一序號資料並帶上相同載荷（主機只有隨房主推進才會推進）"
"put the skip-source-check flag on the record, where a reference host sends none; one variable if a run shows the record is not dispatched" = "在該記錄上設定跳過來源檢查的標記，而參考房主不發送該標記；若某次執行顯示記錄未被分發，這就只是一個變數。"
"seconds after a station's session join to send it the type-3 leave and end the run; the one direction no capture shows" = "站點完成會話加入後，經過多少秒向其發送類型 3 的離開並結束本次執行；這是任何擷取都未顯示的那個方向。"
"seconds per channel in a scan" = "一次掃描中每個頻道的秒數"
"send the host's own record on the 0x81 data exchange once the console opens its stream; the exchange the trade scene is the success branch of" = "一旦主機開啟其串流，就在 0x81 資料交換上發送房主自己的記錄；交換場景正是該交換的成功分支。"
"send the Session join request with no Net 0x12 answer to the host's 0x11; the 0x12 is what a console answers by asking for host migration" = "發送會話加入請求，且不對房主的 0x11 給出 Net 0x12 應答；主機正是以要求房主遷移的方式給出 0x12"
"send this 139-byte record file instead of building one" = "發送此 139 位元組的記錄檔案，而不是建構一個"
"stay silent after a join, to measure what the joiner does unprompted" = "加入後保持靜默，以測量加入方在無提示時會做什麼"
"the eight digits the player types" = "玩家輸入的八位數字"
"the eight digits; '' joins any code" = "八位數字；'' 表示加入任意代碼"
"the experience in the offered record; the level the game shows is the curve's, so this and --trade-box-level go together" = "所提供記錄中的經驗值；遊戲顯示的等級由成長曲線決定，因此此項與 --trade-box-level 需配合使用"
"the host's player name in the station-list update, which the game reads as identity; a real name in place of the placeholder single space" = "站點清單更新中房主的玩家名稱，遊戲會將其讀取為身份；用真實名字替代佔位的單個空格"
"the LDN application version; the console's own is unread" = "LDN 應用程式版本；主機自身的版本未被讀出"
"the LDN node name; a retail console publishes its profile name here" = "LDN 節點名稱；零售主機會在此發佈其個人檔案名稱"
"the level byte in the offered record's party tail" = "所提供記錄隊伍尾部中的等級位元組"
"the name in our data exchange record; the console shows it" = "我方資料交換記錄中的名字；主機會顯示它"
"the Net protocol id to send the connection request under" = "發送連線請求所使用的 Net 協定 id"
"the nickname in the offered record" = "所提供記錄中的暱稱"
"the player name in that record; the game shows it as the trade partner (default --player-name)" = "該記錄中的玩家名稱；遊戲會將其顯示為交換對象（預設為 --player-name）"
"the protocol the host sends its reliable game data on; the game's own reader polls 0x80 (BroadcastReliable), so 0x80 puts data where the game drains it" = "房主發送其可靠遊戲資料所用的協定；遊戲自身的讀取器輪詢 0x80（BroadcastReliable），因此 0x80 會把資料送到遊戲讀取的位置"
"the record to trade away, stored or party, encrypted or not; the default is the reference Azelf under our player name. Repeatable: one per trade in order, on this seat or in the host role once taken" = "要交換出去的記錄，可為儲存或隊伍中，加密或不加密；預設是使用我方玩家名稱的參考由克希。可重複：依序每次交換一個，可在本座位或取得後的房主角色中使用"
"the RTT protocol version byte" = "RTT 協定的版本位元組"
"the sequence id the join response promises; a type-5 update must reach it" = "加入回應所承諾的序號 id；類型 5 的更新必須達到它"
"the whole run" = "整個執行過程"
"when the console hands us the host role, leave its network and become the host with bin/pla_host.py on the same code and channel" = "當主機把房主角色交給我們時，離開其網路，並用相同代碼和頻道透過 bin/pla_host.py 成為房主"
"write every record the console showed or offered to this directory" = "把主機顯示或提供的每個記錄寫入此目錄"
"write every record the console shows or offers to this directory, one file per distinct record, named by species and nickname" = "把主機顯示或提供的每個記錄寫入此目錄，每個不同記錄一個檔案，按物種和暱稱命名"
"write the record the console traded to this file" = "把主機交換出去的記錄寫入此檔案"
"write the record the console traded to this file, -N before the extension for trade N above 1" = "把主機交換出去的記錄寫入此檔案，第 N 次交換（N 大於 1）時在副檔名前加 -N"

# 高级选项：火红/叶绿（FRLG）
"(live) override the RFU connection id (hex, e.g. 7036) sent in the emulator connect ('C') frame. Default: a random nonzero id - any nonzero value works. --parent-pid is a deprecated alias." = "（連線）覆寫模擬器連線（「C」）幀中送出的 RFU 連線 ID（十六進位，例如 7036）。預設：隨機的非零 ID——任何非零值皆可。--parent-pid 是已棄用的別名。"
"0-based host party slot offered for one trade (default: 1)" = "單次交換所提供的隊伍欄位，從 0 開始計數（預設：1）"
"a complete FRLG .pokegift file, or a .wc3 Wonder Card" = "完整的 FRLG .pokegift 檔案，或一個 .wc3 神秘卡片"
"comma-separated 0-based offered slots for multiple trades" = "多次交換所提供的欄位，從 0 開始計數，以逗號分隔"
"decline at the confirm prompt (confirm-NO -> immediate READY_CANCEL, graceful cancel-to-leave) [trade.c:2019-2023]" = "在確認提示處拒絕（confirm-NO -> 立即 READY_CANCEL，優雅地取消並離開）[trade.c:2019-2023]"
"directory for --make-artifact output (default: artifacts)" = "--make-artifact 輸出的目錄（預設：artifacts）"
"explicit comma list of 0-based party slots to offer, one per trade (len must == --trades, distinct, each < party size), e.g. --slots 0,2,4" = "明確指定要提供的隊伍欄位清單，從 0 開始計數，每次交換一個（長度必須等於 --trades、互不相同、每個都小於隊伍規模），例如 --slots 0,2,4"
"host for the Union Room (the middle NPC on Pokemon Center 2F) instead of the trade centre's third NPC; use with --union-room-keepalive 120 and --board-type" = "主持聯盟房間（寶可夢中心 2F 中間的 NPC），而不是交換中心的第三個 NPC；配合 --union-room-keepalive 120 和 --board-type 使用"
"host the cable-club COLOSSEUM instead of the trade centre (Pokemon Center 2F, third NPC -> Colosseum -> Single Battle -> JOIN). The entry is the trade centre's, so --card-flag-id still arms the console's card counters, and only this path increments its battlesWon [decomp:src/cable_club.c:792]. The whole party fights" = "主持電纜俱樂部的 COLOSSEUM，而不是交換中心（寶可夢中心 2F，第三個 NPC -> 競技場 -> 單打對戰 -> JOIN）。入口仍屬於交換中心，因此 --card-flag-id 仍會啟用主機的卡片計數器，且只有這條路徑會增加其 battlesWon [decomp:src/cable_club.c:792]。整支隊伍都會參戰"
"join the real Switch" = "連線真實的 Switch"
"LDN local_communication_id (hex) to join (live); if omitted, joins the only available network (scan logs candidates)" = "要加入的 LDN local_communication_id（十六進位）（連線）；省略時加入唯一可用的網路（掃描會記錄候選項）"
"LDN passphrase as hex (live); default = the built-in 64-byte emulator passphrase (shared by frlg/rse)" = "以十六進位表示的 LDN 通關密語（連線）；預設 = 內建的 64 位元組模擬器通關密語（frlg/rse 共用）"
"live: minimum ms between two datagrams to the console, merging what is due into one (0 = off). See sim.PACE_MIN_GAP_MS for the measurement." = "連線：送往主機的兩個封包之間的最小毫秒間隔，將到期的資料合併為一個（0 = 關閉）。測量方法見 sim.PACE_MIN_GAP_MS。"
"number of sequential trades to perform, 1..6 (default 1; 6 = swap both entire parties). After the Nth trade the sim cancels-to-leave." = "要執行的連續交換次數，1..6（預設 1；6 = 交換雙方整支隊伍）。第 N 次交換後，模擬器取消並離開。"
"offline: replay a capture's host stream" = "離線：重放已擷取的主機資料流"
"override the level shown on the trading board" = "覆寫交換板上顯示的等級"
"override the proven trade-animation frame delay" = "覆寫已驗證的交換動畫幀延遲"
"party slot to offer on the first round (default 1); the per-round default list grows ascending from here (or [0..N-1] for a full-party swap)" = "第一輪要提供的隊伍欄位（預設 1）；每一輪的預設清單從此處開始遞增（整隊交換時為 [0..N-1]）"
"received file size (100=party, 80=box)" = "接收檔案的大小（100=隊伍，80=盒子）"
"received mon format: pk3=decrypted (opens in PKHeX), ek3=encrypted/raw" = "接收寶可夢的格式：pk3=已解密（可在 PKHeX 中開啟），ek3=已加密/原始"
"received-mon output path" = "接收寶可夢的輸出路徑"
"save a .pokegift file and exit without using the radio" = "儲存為 .pokegift 檔案並結束，不使用無線"
"save the received mon here (trades=1); for trades>1 this is a base/prefix and each received mon is saved as <stem>_trade<k>_<species>.pk3" = "將接收的寶可夢儲存到此處（trades=1）；當 trades>1 時這是基底名/前綴，每隻接收的寶可夢儲存為 <stem>_trade<k>_<species>.pk3"
"send each block fragment once (fire-and-forget) instead of the console's re-send-until-confirmed loop. Default off (faithful re-send): against the real client, a block streams in 1-2s with aggressive re-sends (~1.5x) and completes; trust_pia's send-once crawled (~0.1 frag/s) and never completed. trust_pia was a workaround for the 'flood', but that was the rtt deadlock (now fixed). --trust-pia re-enables send-once" = "每個資料塊分片只送出一次（送後不管），而不是主機那套重送直至確認的迴圈。預設關閉（忠實重送）：面對真實客戶端時，一個資料塊以積極重送（約 1.5 倍）在 1-2 秒內串流完成；trust_pia 的只送一次極其緩慢（約 0.1 分片/秒），從未完成。trust_pia 曾是對「flood」的變通方案，但那是 rtt 死鎖（現已修復）。--trust-pia 會重新啟用只送一次"
"store the gift on the ESP32 board, which then hosts it for every console that joins, with no computer, at every power-up, and exit" = "將禮物儲存到 ESP32 板上，之後它無需電腦即可在每次上電時為每個加入的主機提供該禮物，然後結束"
"treat an offered Deoxys/Mew as PARTNER_MON_INVALID and cancel-to-leave (the host's illegitimate-legend gate; legitimacy is not offline-decodable) [trade.c:1965-1968]" = "將對方提供的代歐奇希斯/夢幻視為 PARTNER_MON_INVALID 並取消離開（主機的不合法傳說寶可夢關卡；合法性無法離線解碼）[trade.c:1965-1968]"
"Union Room battle with --battle-fight: which of the active Pokemon's four move slots to use. The default 0 is whatever move slot one holds, which for the tracked party is refresh and does no damage" = "配合 --battle-fight 的聯盟房間對戰：使用目前出戰寶可夢四個招式欄位中的哪一個。預設值 0 是手上恰好持有的招式欄位，對於被追蹤的隊伍來說是 refresh，不造成傷害"
"Union Room battle: pick fight with the first move instead of forfeiting at the first action prompt. Only the forfeit path has been proven on hardware" = "聯盟房間對戰：在第一個行動提示處用第一個招式開打，而不是認輸。只有認輸路徑已在實機上驗證"
"Union Room chat: a line to send once the chat opens, repeatable. Up to 15 Gen-3 charmap characters each, the console's own keyboard limit and the width its chat line can draw; they go out one at a time, 1.5s apart" = "聯盟房間聊天：聊天開啟後要送出的一行，可重複。每行最多 15 個 Gen-3 字元映射字元，即主機鍵盤自身的上限和其聊天行可繪製的寬度；它們逐個送出，間隔 1.5 秒"
"Union Room chat: tail this file while the host runs and send every line appended to it, so the chat can be answered live instead of queued at launch" = "聯盟房間聊天：主機執行時監視此檔案，並送出追加到其中的每一行，從而可以即時應答聊天，而不是在啟動時排入佇列"
"Union Room trading board: register the offered Pokemon (its species and level) and ask for this type in return, so the console's board lists us. The console must have a Pokemon of that type to start the trade" = "聯盟房間交換板：登記所提供的寶可夢（其物種和等級）並請求以此類型作為回報，從而讓主機的交換板列出我們。主機必須擁有該類型的寶可夢才能開始交換"
"Union Room: accept the console's Combat instead of declining it. The console needs two non-egg party mons at level 30 or lower or it refuses on its own screen; it is master and runs the battle, we answer its controller commands" = "聯盟房間：接受主機的 Combat 而不是拒絕。主機需要兩隻等級 30 或以下的非蛋隊伍寶可夢，否則它會在自己的畫面上拒絕；它是主控方並執行對戰，我們只應答其控制器命令"
"Union Room: accept the console's 'Tchat' instead of declining it. Both sides send a join block, then the console's keyboard opens and every line it types is logged" = "聯盟房間：接受主機的「Tchat」而不是拒絕。雙方都會送出加入資料塊，隨後主機的鍵盤開啟，它輸入的每一行都會被記錄"
"Union Room: re-present a parent NI_START for N VBlanks before the first UNI frame; the room child drops the link after five unanswered frames, and enters UNI 480 frames after the last NI_START. 120 is proven" = "聯盟房間：在第一個 UNI 幀之前重新呈現父級 NI_START 共 N 個 VBlank；房間子程序在五個無應答幀後斷開連結，並在最後一個 NI_START 後 480 幀進入 UNI。120 已獲驗證"
"which activity --union-room advertises; default 'in-room', the bare IN_UNION_ROOM a console standing in the room connects to. 'search' is what the screen before the room looks for (untested)" = "--union-room 廣播哪一項活動；預設為「in-room」，即站在房間裡的主機所連線的那個裸 IN_UNION_ROOM。「search」是房間之前那一畫面所搜尋的（未經測試）"
"which map in that group the RAM script binds to." = "RAM 腳本綁定到該群組中的哪一張地圖。"
"wire mpId / gLocalLinkPlayerId (joiner = 1 = right seat; the only valid value - mpId 0 is the host/parent) [trade.c:1816; link_rfu_2.c:1633-1638]" = "寫入 mpId / gLocalLinkPlayerId（加入者 = 1 = 右席；唯一有效值——mpId 0 是主機/父級）[trade.c:1816; link_rfu_2.c:1633-1638]"
"with a dumping --buffer-script: write the bytes that come back to this file" = "配合會傾印的 --buffer-script：將傳回的位元組寫入此檔案"
"with --buffer-script create-mon --create-mon-ot-id-type 1: the OT id to use" = "配合 --buffer-script create-mon --create-mon-ot-id-type 1：要使用的 OT ID"
"with --buffer-script create-mon: the level, 1..%d" = "配合 --buffer-script create-mon：等級，1..%d"
"with --buffer-script flash-patch: byte offset of the field inside the sector's data" = "配合 --buffer-script flash-patch：該欄位在磁區資料內的位元組偏移"
"with --buffer-script flash-read: byte offset into the sector to start reading at" = "配合 --buffer-script flash-read：在該磁區內開始讀取的位元組偏移"
"with --buffer-script flash-write: added to each word of the pattern" = "配合 --buffer-script flash-write：加到模式的每個字上"
"with --buffer-script flash-write: how many words of the sector to compose" = "配合 --buffer-script flash-write：要建構該磁區的多少個字"
"with --buffer-script flash-write: word[0] of the pattern the console composes" = "配合 --buffer-script flash-write：主機所建構模式的 word[0]"
"with --buffer-script install-resident: a hook parameter, e.g. extra=6" = "配合 --buffer-script install-resident：一個掛鉤參數，例如 extra=6"
"with --buffer-script install-resident: the hook to install (turbo)" = "配合 --buffer-script install-resident：要安裝的掛鉤（turbo）"
"with --buffer-script rom-reset-probe: word[0] of the pattern (default 'EMER')" = "配合 --buffer-script rom-reset-probe：模式的 word[0]（預設「EMER」）"
"with --buffer-script save-dump: byte offset into that block. Accepts 0x hex" = "配合 --buffer-script save-dump：該資料塊內的位元組偏移。接受 0x 十六進位"
"with --buffer-script save-write: the bytes to write, as hex" = "配合 --buffer-script save-write：要寫入的位元組，以十六進位表示"
"with --buffer-script sloop-svc: a syscall, 0x40..0x62 (0x4D is the bad-word check); repeat for up to eight, issued in order in one session" = "配合 --buffer-script sloop-svc：一個系統呼叫，0x40..0x62（0x4D 是壞字檢查）；可重複至多八次，在一次工作階段中按順序送出"
"with --buffer-script sloop-svc: issue THUMB `bkpt N` instead of `swi N` (0xFF is the one the game never issues; needs --write-unsafe)" = "配合 --buffer-script sloop-svc：發出 THUMB 的 `bkpt N` 而不是 `swi N`（0xFF 是遊戲從不發出的那個；需要 --write-unsafe）"
"with --buffer-script sloop-svc: point this register at the console's copy of the data" = "配合 --buffer-script sloop-svc：讓該暫存器指向主機持有的資料副本"
"with --buffer-script sloop-svc: r0, r1, r2, r3 in order (repeatable)" = "配合 --buffer-script sloop-svc：依次為 r0、r1、r2、r3（可重複）"
"with --buffer-script sloop-svc: the data as hex instead" = "配合 --buffer-script sloop-svc：改為以十六進位表示的資料"
"with --buffer-script sloop-svc: up to 256 bytes of UTF-8 data to send" = "配合 --buffer-script sloop-svc：最多 256 位元組要送出的 UTF-8 資料"
"with --buffer-script string-gather: how many pointers to follow at most" = "配合 --buffer-script string-gather：最多追蹤多少個指標"
"with --buffer-script table-scan: the watchdog, in calls (= frames)" = "配合 --buffer-script table-scan：看門狗，以呼叫次數計（= 幀）"
"with --flash-footer: the save counter written at +0xFFC" = "配合 --flash-footer：寫入 +0xFFC 處的存檔計數器"
"with --flash-footer: the sector id written at +0xFF4" = "配合 --flash-footer：寫入 +0xFF4 處的磁區 ID"
"with --gift %s: the level that species appears at." = "配合 --gift %s：該物種出現的等級。"
"with --rom-transfer: write and check every block, then end the session without booting" = "配合 --rom-transfer：寫入並校驗每個資料塊，然後結束工作階段而不啟動"
"with --save-backup: keep a backup the link cut short here; the next one goes on from it" = "配合 --save-backup：在此處連結中斷前保留一份備份；下一次將從它繼續"
"zstd-compress out payloads" = "對送出的承載資料進行 zstd 壓縮"

# 高级选项：Let's Go 皮卡丘/伊布
"1, 6, 11; code (default): the channel the link code puts a searching console on, the only one it joins on; auto: scan for the console's own network under our scene id and host on its channel" = "1、6、11；code（預設）：連線碼將搜尋中的主機置於的頻道，也是它唯一會加入的頻道；auto：在我們的場景 ID 下掃描主機自身的網路，並在其頻道上主持"
"232-byte box structure for the next trade in the same session; repeatable, one per trade after the first" = "同一工作階段中下一次交換的 232 位元組盒子結構；可重複，第一次之後的每次交換各一個"
"address our own clone announce to the peer alone. A real joiner addresses the first announce of a clone to the whole mesh (dest 0x0003), which is the default here" = "只把我們自己的克隆公告送往對端。真實加入者會把克隆的首則公告送往整個網格（dest 0x0003），這也是此處的預設值"
"answer a peer re-announcement with an acknowledgement carrying its clock rather than a second take-over. A reference joiner takes a clone over once and never again" = "對來自對端的重新公告，以攜帶其時鐘的確認來應答，而不是再次接管。參考加入者只接管一次克隆，絕不再接管"
"answer only the first of a peer's repeated publishes with a copy of our own and acknowledge the rest. Measured to stop the peer publishing at all, so the default answers each one" = "僅對來自對端重複發佈中的第一次以我們自己的副本應答，其餘只做確認。實測會完全阻止對端發佈，因此預設對每一次都做應答"
"answer the console's offer with this 232-byte box structure (echo: its own back), and its commits with commits" = "以此 232 位元組盒子結構應答主機的提議（echo：回送它自己的），並以提交應答其提交"
"answer the host's offers with a box structure of our own. 'echo' returns the host's own, which the game accepts by construction; a path is a 232-byte structure, encrypted or not. Repeatable, one per trade on the seat; trade N writes what it received to --received with -N. After the last, a further trade is not answered and the player backs out" = "以我們自己的盒子結構應答主機的提議。「echo」傳回主機自己的那份，遊戲在構造上會接受它；路徑則為 232 位元組結構，加密與否皆可。可重複，席位上的每次交換各一個；第 N 次交換會把收到的內容以 -N 寫入 --received。最後一筆之後，再有的交換將不再應答，玩家會退出"
"answered clock requests of our own before the participate (measured 10)" = "參與之前我們自己已應答的時鐘請求數（實測為 10）"
"carry the peer's announcement clock in our acknowledgement on clone type 2 rather than the clock round-tripped from our own announcement, which is what a reference joiner carries" = "在克隆類型 2 的確認中攜帶對端的公告時鐘，而不是我們自身公告往返所得的時鐘，後者才是參考加入者所攜帶的"
"do not accept the frames rtw88 has already decrypted. With this the host reads nothing on that adapter" = "不接受 rtw88 已解密的幀。啟用此項後主機在該適配器上讀不到任何內容"
"files, comma-separated, holding the game payloads to send on the Reliable Protocol (0x7c) once the clone elements are up; by default the recorded identity in pokeldn.lgpe.reference, and an empty value sends nothing there" = "以逗號分隔的檔案，存放克隆元素就緒後要透過可靠協議（0x7c）送出的遊戲承載資料；預設使用 pokeldn.lgpe.reference 中記錄的身分，空值則在那裡不送出任何內容"
"how long to retransmit the connection request and listen for its reply" = "重送連線請求並監聽其回覆的時長"
"how long to wait for the scan response and the sync" = "等待掃描回應和同步的時長"
"how many kind 1 identities to send, 0.3 s apart under successive steps" = "要送出多少個 kind 1 身分，在連續步驟之間間隔 0.3 秒"
"how many party clones (ids 2 up) to announce after the identities; the reference host announced two" = "身分之後要公告多少個隊伍克隆（ID 從 2 起）；參考主機公告了兩個"
"keep scanning this long for a console before giving up" = "放棄之前持續掃描主機的時長"
"leave the session the way a console backs out of its trade screen, this long after the first trade step we answered (docs/lgpe_session.md)" = "按照主機退出其交換畫面的方式離開工作階段，時間為在我們應答的第一步交換步驟之後的該時長（docs/lgpe_session.md）"
"leave the way a console backs out when both players have voted and the host has not agreed for this long, before any commit; 0 never. It ends the wait, not the trade lock a confirmed trade already saved" = "當雙方玩家都已投票、而主機在此時長內仍未同意時，按主機退出的方式離開，且在任何提交之前；0 表示從不。它結束的是等待，而不是已確認交換已儲存的交換鎖"
"let the LDN layer encrypt in software. The Archer T3U wants the hardware path, which is the default here" = "讓 LDN 層在軟體中加密。Archer T3U 需要硬體路徑，這也是此處的預設值"
"let the LDN layer pick the session id. A Let's Go network's is the fixed value every console advertises, which is the default here" = "讓 LDN 層選擇工作階段 ID。Let's Go 網路的工作階段 ID 是每台主機都廣播的固定值，這也是此處的預設值"
"local_communication_id to join, hex. Omit to join the only unknown one" = "要加入的 local_communication_id，十六進位。省略則加入唯一未知的那個"
"offer every --offer and --next-offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常數提供每個 --offer 和 --next-offer 結構，保留異色狀態，使先前已接收它的存檔能再次接收"
"offer every --offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常數提供每個 --offer 結構，保留異色狀態，使先前已接收它的存檔能再次接收"
"once in the mesh, do not answer the host's RTT requests and send none of our own. Default: answer them and send one a second" = "進入網格後，不應答主機的 RTT 請求，也不送出我們自己的請求。預設：應答它們並每秒送出一個"
"once in the mesh, do not run the clone clock exchange (requests every 0.2 s, replies with our ms clock, participate after ten answers: docs/lgpe_session.md). Default: run it" = "進入網格後，不執行克隆時鐘交換（每 0.2 秒一次請求，以我們的毫秒時鐘回覆，十次應答後參與：docs/lgpe_session.md）。預設：執行它"
"once in the mesh, do not run the Sync Clock Protocol (0x1c): a request every 2 s, the host's reply carrying the mesh clock in ms. Default: run it" = "進入網格後，不執行同步時鐘協定（0x1c）：每 2 秒一次請求，主機的回覆以毫秒攜帶網格時鐘。預設：執行它"
"our kind-1 identity message, sent when the console's arrives: a captured 376-byte message, header included, or echo for the console's own back" = "我們的 kind-1 身分訊息，在主機的身分訊息抵達時送出：一則擷取到的 376 位元組訊息（含標頭），或用 echo 回送主機自己的那則"
"our own variable id, any nonzero value" = "我們自己的可變 ID，任意非零值"
"our own variable id, any nonzero value (the console's is random)" = "我們自己的可變 ID，任意非零值（主機的為隨機值）"
"override, as ASCII" = "覆寫值，以 ASCII 表示"
"publish anyway this many seconds after the announce if the peer never published its own copy. Not a measured value" = "若對端從未發佈它自己的副本，則在公告之後經過該秒數仍照常發佈。並非實測值"
"publish no clone data on clone types 4 and 1. Without it the console never passes the gate at 0x11b080 and stays on its search screen" = "在克隆類型 4 和 1 上不發佈克隆資料。否則主機永遠無法通過 0x11b080 的關卡，會停留在其搜尋畫面"
"publish our copy of a clone on clone type 2 as part of the announce burst. A real joiner waits for the peer to publish its own copy first, which is the default here" = "在公告突發中將我們持有的克隆副本發佈在克隆類型 2 上。真實加入者會先等待對端發佈它自己的副本，這也是此處的預設值"
"put our own address in the station location's public field as well as its private one. A Let's Go joiner leaves the public field empty" = "把我們自己的地址同時填入站點位置的公開欄位和私有欄位。Let's Go 加入者會將公開欄位留空"
"reach the peer over plain UDP instead of the radio: no scan, no LDN association, the Pia socket straight at --host-ip:12345. For an emulated host under a debugger. Needs --app-data, --host-mac, --our-mac" = "透過普通 UDP 而非無線抵達對端：不掃描、不進行 LDN 關聯，Pia 通訊端直連 --host-ip:12345。用於偵錯器下的模擬主機。需要 --app-data、--host-mac、--our-mac"
"replace the trainer id pair in the first message. A payload captured between two emulators that share a save carries the host's own pair, which presents the joiner as the station it is trading with" = "替換首則訊息中的訓練家 ID 對。在兩個共用存檔的模擬器之間擷取的承載資料會攜帶主機自己的那一對，從而把加入者呈現為它正在交換的對象站點"
"seconds after our identity to announce them" = "在我們送出身分後多少秒公告它們"
"seconds after the party clones to move our state word to 2 and send the offer, which is what a station does as its own state word reaches 2" = "在隊伍克隆之後多少秒把我們的狀態字移至 2 並送出提議，這正是站點在自身狀態字達到 2 時會做的事"
"seconds after the second commit to send the result, the next trade's first slot, with two clones announced 0.5 s before it; a retail host sent it 26.8 s after, behind its trade animation" = "在第二次提交之後多少秒送出結果，即下一次交換的首個欄位，並在其前 0.5 秒公告兩個克隆；零售主機是在 26.8 秒後、在其交換動畫之後才送出"
"seconds after the take-over burst to publish our copy, with --publish-on-announce. Zero puts it in the burst's own frame" = "配合 --publish-on-announce，在接管突發之後多少秒發佈我們的副本。零表示把它放進突發自身的幀中"
"seconds between the payloads of --reliable-payload" = "--reliable-payload 各承載資料之間的秒數"
"seconds between the steps the host drives an offered clone through" = "主機驅動一個被提供的克隆所經過各步驟之間的秒數"
"seconds past --connect-seconds or --hold to keep a seat whose trade is half done: a trade left mid-way locks the console out of trading" = "超過 --connect-seconds 或 --hold 之後仍保留交換進行到一半的席位的秒數：交換中途離開會讓主機被鎖定而無法交換"
"seconds past --seconds to hold a session whose trade is half done" = "超過 --seconds 之後仍保持交換進行到一半的工作階段的秒數"
"send a version-9 station connection request to the host and classify the reply, retransmitting every 0.5 s the way Pia does. Without it, listen only" = "向主機送出版本 9 的站點連線請求並分類其回覆，像 Pia 那樣每 0.5 秒重送一次。否則僅監聽"
"send nat flags 5 and nat location 1. A Let's Go joiner sends zero for both on local wireless" = "送出 NAT 旗標 5 和 NAT 位置 1。Let's Go 加入者在本地無線下兩者都送出零"
"send the 0x3c-byte connection response instead of the full 0x348-byte one, which carries no network id and no player" = "送出 0x3c 位元組的連線回應，而不是完整的 0x348 位元組回應，後者不攜帶網路 ID 和玩家"
"send the announcement of our own copy a tick after the take-over burst. Both stations of a session that works put all seven in one frame, which is the default here" = "在接管突發之後一個 tick 時送出我們自身副本的公告。可正常運作的工作階段中兩個站點都會把全部七則放進一個幀，這也是此處的預設值"
"stamp our own clock on the take-over instead of the clock the peer's announcement carried. The peer completes a take-over only when it matches the sequence it allocated, so the echo is the default" = "在接管上蓋用我們自己的時鐘，而不是對端公告攜帶的時鐘。對端只有在其分配的序列匹配時才會完成接管，因此預設回送（echo）"
"test only, for bin/lgpe_join.py: act as a console host's player, each step this many seconds after the last. Offer unprompted after the party clones and after each result, vote on the offered clone, announce and vote the commit clone, commit (docs/lgpe_session.md). Never against a console" = "僅供測試，適用於 bin/lgpe_join.py：扮演主機方的玩家，每一步都在上一步之後這麼多秒進行。在隊伍克隆之後以及每個結果之後主動提議，對所提供的克隆投票，公告並對提交克隆投票，提交（docs/lgpe_session.md）。絕不針對真實主機使用"
"test only: carry the drive on through a withdrawn vote, as the host did before it answered state 2 (docs/lgpe_session.md). Locks a console's save" = "僅供測試：在投票被撤回後仍繼續驅動流程，如同主機在應答狀態 2 之前所做的那樣（docs/lgpe_session.md）。會鎖定主機的存檔"
"test only: ignore the console's first answer to our clone 0 pair, as if lost, so the pair goes again" = "僅供測試：忽略主機對克隆 0 配對的首次應答，如同遺失一樣，使該配對再次送出"
"test only: send no answer to the host's first clone 0 pair (0xa1, 0xb1), as if lost, to see whether the host repeats it" = "僅供測試：對主機的首個克隆 0 配對（0xa1、0xb1）不作應答，如同遺失一樣，以觀察主機是否會重送"
"test only: skip the first N of our announcements to the console alone, as if lost, so the resend carries them" = "僅供測試：只對主機跳過我們前 N 則公告，如同遺失一樣，使重送能攜帶它們"
"test only: skip the first N of our announcements to the host alone, as if lost, so the resend carries them" = "僅供測試：只對主機跳過我們前 N 則公告，如同遺失一樣，使重送能攜帶它們"
"the advertised scene id, in place of the one --code gives" = "要廣播的場景 ID，取代 --code 所給出的那個"
"the hosting station's MAC, as it appears in its own advertisement" = "主持站點的 MAC，即其自身廣播中出現的那個"
"the host's advertise data as hex, or @FILE, instead of scanning for it. Needs --host-mac alongside" = "主機的廣播資料，以十六進位表示，或 @FILE，而不是去掃描它。需要同時提供 --host-mac"
"the LDN advertisement protocol. A title sees only its own: Let's Go advertises and scans on 1, measured off the console's own beacon" = "LDN 廣播協定。一個遊戲只看到自己的：Let's Go 在 1 上廣播和掃描，這是從主機自身信標測得的"
"the link code the player enters: three picker names (English or French) or indices 0-9, comma-separated" = "玩家輸入的連線碼：三個選擇器名稱（英文或法文）或索引 0-9，以逗號分隔"
"the MAC we present; any value the host has not seen" = "我們呈現的 MAC；任意主機未見過的值"
"the nickname our connection response carries" = "我們連線回應所攜帶的暱稱"
"the nickname the connection response carries, what the console shows as the partner (a real station sends its Switch profile's)" = "連線回應所攜帶的暱稱，即主機顯示為對方的名稱（真實站點會送出其 Switch 個人資料的暱稱）"
"the player name our identity carries, the one the trade screen shows" = "我們身分所攜帶的玩家名，即交換畫面顯示的那個"
"the trainer id pair written over the identity's" = "覆寫身分中自帶那一對的訓練家 ID 對"
"write the peer's offered PB7 here" = "在此寫入對端提供的 PB7"

# 高级选项：传说 Z-A
"a 354-byte offer message to send once the streams are open. Repeatable, one per trade in the seat; the last serves every later trade" = "串流開啟後要送出的 354 位元組提議訊息。可重複，席位中的每次交換各一個；最後一個用於其後所有交換"
"a file to write the moment a seat forms and again when it ends, so a watcher on the other side can act on the seat without a relay" = "在席位形成時以及結束時寫入的檔案，使另一側的監視程序無需中繼即可對該席位作出反應"
"a searching console put both of its measured sessions on channel 6" = "搜尋中的主機將其兩個實測工作階段都置於頻道 6"
"address our datagrams to the host rather than to the broadcast" = "將我們的封包送往主機，而不是送往廣播位址"
"address our datagrams to the link-local broadcast, as a retail station does" = "將我們的封包送往連結本地廣播，如同零售站點所做的那樣"
"bound the association alone; the seat itself is not bounded by it" = "僅限制關聯的時長；席位本身不受其限制"
"end a seat on which the console has sent nothing for this long" = "主機在此長時間內未送出任何內容時結束席位"
"give the phy this MAC before associating" = "在關聯之前給 phy 設定此 MAC"
"hex packet flags ORed into the Session join's header: 4 is the band's skip-network-connection-check bit, which a station the console has not yet connected may owe" = "以 OR 併入 Session 加入標頭的十六進位封包旗標：4 是該頻段的略過網路連線檢查位，尚未與主機連線過的站點可能需要設定它"
"hex; the application communication version the Session join declares. Six is what a reference joiner sends and what the advertisement carries" = "十六進位；Session 加入所宣告的應用通訊版本。參考加入者送出的是 6，廣播所攜帶的也是它"
"hex; the default is Legends Z-A's" = "十六進位；預設值為傳說 Z-A 的值"
"hex; the default is the title's. An emulated Z-A advertises and scans for ffffffffffffffff over ldn_mitm" = "十六進位；預設值為該遊戲的值。模擬的 Z-A 會透過 ldn_mitm 廣播並掃描 ffffffffffffffff"
"hex; the Session join's 32-byte identification token, zero-padded. A reference joiner sends 0x06 and zeroes" = "十六進位；Session 加入的 32 位元組識別權杖，零填充。參考加入者送出 0x06 和零"
"how long to hold one seat" = "保持一個席位的時長"
"how many selection records to send; a reference joiner sent sixteen" = "要送出多少個選擇記錄；參考加入者送出了十六個"
"id:version pairs the Session join declares; the default is the set a reference Legends Z-A joiner declares" = "Session 加入所宣告的 id:version 對；預設值為參考傳說 Z-A 加入者所宣告的那一組"
"join an emulated host over the LAN through its ldn_mitm bridge, with no radio and no root" = "透過其 ldn_mitm 橋接，經由區域網路加入模擬主機，無需無線且無需 root"
"leave this long after the last queued trade's fourth step; by default the seat is kept until the player backs out or --hold ends, as every joiner does" = "在最後一個排入佇列的交換的第四步之後這麼久離開；預設會保留席位，直到玩家退出或 --hold 結束，正如每個加入者所做的那樣"
"make our pick this many seconds after the preview, without waiting for the console's; the default answers the console's pick" = "在預覽之後這麼多秒作出我們的選擇，而不等待主機的選擇；預設會應答主機的選擇"
"never send this answer, to find what a seat needs (docs/za.md, Unresolved); repeatable" = "從不送出此應答，用於探明席位需要什麼（docs/za.md，Unresolved）；可重複"
"once the session is up, open the game's reliable streams and send the identity, the selection record and, with --trade-offer, an offer" = "工作階段建立後，開啟遊戲的可靠串流，並送出身分、選擇記錄，以及在配合 --trade-offer 時送出提議"
"only join a console waiting on this link code" = "僅加入正在等待此連線碼的主機"
"optional seconds to keep the seat once the console is back on its box after a trade, then hand the console the session and close; by default the host waits for the console to leave" = "可選：交換後主機回到其盒子畫面時保留席位的秒數，隨後把工作階段交給該主機並關閉；預設由我方作為主機等待該主機離開"
"our own address on that LAN" = "我們在該區域網路上的自身位址"
"our own constant id in the Session join: the LDN permutation of our MAC, which is the form the console publishes for itself, or the MAC as it is" = "我們在 Session 加入中的自身固定 ID：我們 MAC 的 LDN 置換，即主機為自身發佈的那個形式，或 MAC 原樣"
"seconds after the identity before the selection record starts; a reference joiner waits about 0.46 s" = "在身分之後到選擇記錄開始之間的秒數；參考加入者等待約 0.46 秒"
"seconds after the streams open before the offer goes out" = "串流開啟之後到提議送出之間的秒數"
"seconds between selection records; a reference joiner sends about four a second, each under a fresh sequence" = "選擇記錄之間的秒數；參考加入者每秒送出約四個，每個都在新的序列之下"
"send the band's Net connection request once seated" = "入座後送出該頻段的 Net 連線請求"
"send the offer under a new PID and encryption constant, shiny state kept, so a save that took this record before takes it again" = "在新的 PID 和加密常數下送出提議，保留異色狀態，使先前已接收此記錄的存檔能再次接收"
"send the Session join request once the console's Net is acknowledged" = "在主機的 Net 被確認後送出 Session 加入請求"
"stay silent; the run then measures what the console sends on its own" = "保持靜默；隨後執行將測量主機自行送出的內容"
"the 354-byte offer message: the preview, then our pick. Repeatable, one per trade in the seat; the last serves every later trade" = "354 位元組的提議訊息：先是預覽，然後是我們的選擇。可重複，席位中的每次交換各一個；最後一個用於其後所有交換"
"the LDN node name; a searching console advertises one space" = "LDN 節點名；搜尋中的主機廣播的是一個空格"
"the link code the player types" = "玩家輸入的連線碼"
"the local communication version our NodeInfo publishes on the LAN path; a host publishes its own application version there" = "我們的 NodeInfo 在區域網路路徑上發佈的本地通訊版本；主機在那裡發佈它自己的應用版本"
"the name the Session join's PlayerInfo carries; a reference joiner sends one space" = "Session 加入的 PlayerInfo 所攜帶的名稱；參考加入者送出一個空格"
"the station platform byte; both retail consoles here are Switch 2" = "站點平台位元組；此處兩台零售主機都是 Switch 2"
"the variable id we send as our own until the console names one" = "在主機指定之前，我們作為自身送出的可變 ID"
"V-Blank ticks between re-sends of an unanswered Session join; 0 is once" = "未獲應答的 Session 加入重送之間的 VBlank tick 數；0 表示只送一次"
"where identity10.bin, identity11b.bin and selection.bin live; by default the ones pokeldn.za.reference ships" = "identity10.bin、identity11b.bin 和 selection.bin 所在的位置；預設使用 pokeldn.za.reference 隨附的那些"
"where the reference payloads (identity10.bin, selection.bin, ...) live; by default the ones pokeldn.za.reference ships" = "參考承載資料（identity10.bin、selection.bin、……）所在的位置；預設使用 pokeldn.za.reference 隨附的那些"
"write the host's offered PA9 here; trade N > 1 writes FILE-N" = "在此寫入主機提供的 PA9；第 N 次交換（N > 1）寫入 FILE-N"
"write the Pokemon the console picks here; trade N > 1 writes FILE-N. A preview, the console's cursor on its box, is not written" = "在此寫入主機選中的寶可夢；第 N 次交換（N > 1）寫入 FILE-N。預覽（主機游標在其盒子上的位置）不會被寫入"
