# 高級選項：共享啟動器旗標（--online、--keys、--capture 等）
"trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)" = "與遠方的玩家交換：對方主機的報價會在這裡提供，雙方都收到報價後才各自確認（docs/online.md）"
"the room both players enter; default the link code, and no code meets anyone else trading online without one" = "雙方玩家進入的房間；預設使用連接碼，不設碼則會遇到其他同樣無碼線上交換的玩家"
"the Switch's prod.keys; default keys_path from config/host.toml or host.local.toml" = "Switch 的 prod.keys；預設取 config/host.toml 或 host.local.toml 中的 keys_path"
"a Linux Wi-Fi card's phy (phyN), or auto; POKELDN_RADIO selects a board instead" = "Linux 無線網卡的 phy（phyN），或 auto；POKELDN_RADIO 則改為選擇一片開發板"
"write every datagram here, one JSON line each" = "把每個資料報寫入此檔案，每行一筆 JSON"
"Linux: the station interface" = "Linux：station 介面"
"Linux: the tap the host's Pia runs on" = "Linux：主機 Pia 執行所在的 tap"
"Linux: the access point interface" = "Linux：存取點介面"
"Linux: the monitor interface" = "Linux：監聽介面"
"host an emulated console over ldn_mitm on the LAN; no radio and no root" = "透過 ldn_mitm 在區域網路上主持一台模擬主機；無需無線網卡和 root"
"with --ip-host, the address to advertise" = "配合 --ip-host：要廣播的位址"
"close the session this long after the last queued trade; by default the run keeps it until the console leaves or the time limit ends" = "最後一次排隊交換後等待這麼久再關閉連線；預設會一直開到主機離開或時限結束"
"leave the seat this long after the last queued trade; by default the run keeps it until the console leaves or the time limit ends" = "最後一次排隊交換後等待這麼久再離開座位；預設會一直坐到主機離開或時限結束"
"after each trade, trade again and offer the Pokemon the console just sent, so one that evolves by trade evolves on the console; the player offers ours back (docs/architecture.md, Trade back)" = "每次交換後再交換一次，把主機剛發來的寶可夢提供給它，通信進化的寶可夢便會在主機上進化；對方玩家也會把我們的寶可夢還回來（docs/architecture.md，換回）"
"the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "每個 --trade-offer 由哪張神秘禮物卡片生成，順序一致：填它在 PKHeX 活動資料庫中的鍵（pokeldn.pokemon.Service.gift_events）"
"make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)" = "在交換過程中，把每張贈送接收方自己訓練家的 --gift-event 卡片，針對主機的存檔重新生成：主機先報價，其存檔捕捉的寶可夢給出訓練家，我們的報價按它客製；其餘卡片則用主機連線資料給出的訓練家。兩者都失敗時，報價按原樣發出，使用設定中的訓練家（pokeldn.receiver_gift，docs/gift_simulated.md）"

# 高級選項：朱/紫 主持（sv-host / sv-raid-host）
"advertise Violet's local communication id instead of Scarlet's" = "以紫的本地通訊 ID 進行廣播，而不是朱的"
"advertise this local communication id" = "廣播這個本地通訊 ID"
"the LDN scene: 4 for a Link Trade, 7 for a Tera Raid" = "LDN 場景：4 為連接交換，7 為太晶團體戰"
"the LDN participant limit; a Tera Raid advertises 4" = "LDN 參與者上限；太晶團體戰廣播為 4"
"the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to" = "站點的平台位元組：1 是 Switch 2，兩台零售主機都廣播該值；0 是 Switch，也是 LDN 層的預設值"
"hex, 16 bytes; default lets the LDN layer pick" = "十六進位，16 位元組；預設由 LDN 層選擇"
"the LDN node name" = "LDN 節點名稱"
"leave a console's Session type-3 leave request unanswered; it then resends it every 0.5 s and leaves after the fourth (docs/sv.md, Leaving)" = "不回應主機的 Session 3 型離開請求；主機隨後每 0.5 秒重發一次，第四次後離開（docs/sv.md，Leaving）"
"do not answer RTT requests" = "不回應 RTT 請求"
"do not acknowledge reliable streams" = "不對可靠流發送確認"
"print every packet in and out; the --capture file keeps them either way" = "列印每個進出的封包；無論是否列印，--capture 檔案都會記錄"
"seconds between the periodic bulk acks on every port the console used" = "在主機使用過的每個連接埠上，週期性批次確認的間隔秒數"
"answer clone clock requests, if any" = "回應克隆時鐘請求（如果有）"
"the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0" = "站點清單更新中的序號；朱主機在加入回應中為 0，此處發送 1"
"also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later" = "在發送加入回應的同時附帶一份站點清單，使用該序號；模擬的朱主機在此處發送 id 為 0 的清單，約兩秒後發送第二份"
"seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s" = "Session 加入回應與站點清單更新之間的秒數；朱主機間隔約 1.5 秒"
"the message flags on the Session replies; a Scarlet host sends 0x00, this host's own default is 0x01" = "Session 回覆的訊息旗標；朱主機發送 0x00，本工具預設為 0x01"
"the packet id in the Pia header of the Session replies; a Scarlet host's join response carries 1" = "Session 回覆的 Pia 標頭中的封包 id；朱主機的加入回應中為 1"
"the 41-byte Session join response a Scarlet host sends, with no route bytes, rather than Arceus's 43-byte one" = "發送朱主機的 41 位元組 Session 加入回應（不含路由位元組），而不是阿爾宙斯的 43 位元組回應"
"the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01" = "Net 0x11 開場訊息的旗標；零售主機發送 0x31，本工具預設為 0x01"
"send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them" = "按此間隔發送 RTT 請求（成對主機每 410 毫秒一次）；否則主機只回應 RTT 請求"
"the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all" = "Net 0x50 的訊息旗標；成對主機在 0x50 和 0x11 上都發送 0x31，而本工具的 0x11 需要 0x01 才會得到回應"
"send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51" = "發送成對主機在其 0x11 之後 0.37 秒發出的 Net 0x50 屬性更新訊息，重傳直到收到主機的 0x51"
"how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is" = "Net 0x11 攜帶的 21 位元組站點槽數量；無論遊戲的參與者上限是多少，零售主機都寫 4 個"
"the Link Code the player sets, e.g. 12345678; empty for none" = "玩家設定的連接碼，例如 12345678；留空表示不設"
"hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21" = "十六進位，廣播中的 40 個遊戲位元組；搜尋中的主機將其置零，被加入者連上的主機在 +0x21 處攜帶 648cf4"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], a reliable data message sent that many seconds after the seat; the sequence follows the port's own. A pair's host sends its 0x7c port 1 table update at nine seconds this way" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在入座後指定秒數發送的可靠資料訊息；序號遵循該連接埠自身的序列。成對主機以這種方式在第 9 秒發送其 0x7c 連接埠 1 的表更新"
"a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib; by default the recorded set in pokeldn.sv.reference" = "一個 NNN.bin 記錄目錄，作為本主機自己的身分在 0x81 連接埠 0 上發送，如同成對主機發送其 46 條記錄；首條帶有 INITIALIZED，且每條都已是 zlib 格式；預設使用 pokeldn.sv.reference 中錄製的記錄集"
"the player name record 1 of our identity carries, the one the trade screen shows" = "我們身分的記錄 1 所攜帶的玩家名字，即交換畫面顯示的名字"
"send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference" = "除非 --record-set 或 --send-on-open 指定了身分，否則不發送站點身分；預設發送 pokeldn.sv.reference 中錄製的身分"
"seconds after the seat before the record set goes out" = "入座後延遲多少秒再發送記錄集"
"bundle the record set N to a packet, each after the first with its header inherited, as a retail host's retransmit round does (docs/sv.md)" = "將記錄集按每包 N 條打包，首條之後的每條繼承其標頭，如同零售主機的重傳輪次（docs/sv.md）"
"seconds between the record packets; a retail raid host spreads its identity over about 0.13 s" = "記錄封包之間的間隔秒數；零售團體戰主機將其身分分散在約 0.13 秒內發出"
"run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)" = "用站點 id 執行遊戲的連接埠 2 開場，而非重播：在 0x80 連接埠 2 上發送攜帶本主機站點 id 的 7 型通告，並以攜帶主機站點 id 的 9 型訊息回應它在 0x7c 連接埠 2 上的 3 型加入（pokeldn.sv.port2）"
"seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3" = "入座後多少秒再發送 7 型訊息；成對主機約在 2.3 秒時發送"
"offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "每條記錄以新的 PID 和加密常數提供，異色狀態保留，這樣之前收過它的存檔可以再次收下"
"a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本主機提供的 348 位元組記錄的檔案（原始位元組或十六進位文字；352 位元組的遊戲訊息會剝去標頭）。指定後，本主機會用自己的報價回應主機的報價並確認，然後像成對主機一樣跟隨主機完成提交和四個交換步驟（pokeldn.sv.trade）。可重複：第二份及之後的記錄在同一座位中提供，每次交換一份，隨每次交換結束"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存前寫入所提供記錄的欄位，使用 pokeldn.sv.pokemon 的欄位名：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重複，單獨的 `shiny` 會按記錄自身的 id 隨機出一個異色性格值"
"write the offered record's 348-byte body to this file as hex and exit, which needs no radio" = "將所提供記錄的 348 位元組本文以十六進位寫入此檔案後結束，無需無線網卡"
"a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon" = "把主機自己的報價寫入此檔案，即其 80 00 02 00 訊息的 348 位元組本文，以十六進位文字保存。其內容由 pokeldn.sv.pokemon 讀取"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the console announces its own key 0x80 open on 0x7c port 1. A port-0 message sent before that open is acknowledged by the console and never reaches the game, and so is everything after it on that port; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主機於 0x7c 連接埠 1 通告其金鑰 0x80 開啟後指定秒數發送。在該開啟之前發出的連接埠 0 訊息會被主機確認、卻永遠到不了遊戲，該連接埠上其後的一切訊息也是如此；可重複；預設為 pokeldn.sv.reference 中的身分片段"
"seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open" = "在主機金鑰 0x80 開啟後多少秒由本主機先報價；與 --send-on-open 相同的門控"
"seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer" = "入座後多少秒由本主機先於主機報價，如同成對主機那樣；不指定時本主機回應主機的報價"
"seconds after the console's offer before the host's confirmation" = "主機報價後多少秒本主機再確認"
"host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags" = "主持太晶團體戰：團體戰種子，八位十六進位數；頭目、其太晶屬性和獎勵由它與四個 --raid-* 上下文旗標決定"
"the party record our player brings to the raid, legal per PKHeX; with --raid-seed" = "我方玩家帶入團體戰的隊伍記錄，需通過 PKHeX 合法性檢查；配合 --raid-seed 使用"
"a reward row in place of the seed's, in order; up to 45" = "取代種子自帶獎勵的獎勵列，按順序；至多 45 條"
"the story stage, which sets a standard crystal's star odds" = "劇情進度階段，決定標準結晶的星級機率"
"a standard or a black (six-star) crystal" = "標準結晶或黑色（六星）結晶"
"host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused" = "主持活動團體戰：寶可入口站新聞配信的資料夾（EventsGallery 活動或其 Files）；種子按 --raid-version 和 --raid-progress 從活動的遭遇中抽取，--raid-map 與 --raid-content 不使用"
"the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress" = "活動巢穴的配信分組，1 到 10；預設取該進度下第一個有巢穴且有遭遇的分組"
"with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)" = "配合 --raid-event：把只能捕捉一次的遭遇（每個七星團體戰、波盪水、鐵斑葉……）作為普通捕捉提供：捕獲率正常，記錄編號換成沒有存檔捕捉過的替身，這樣抓過它的存檔可以再抓一次；本來就抓不到的仍然抓不到（docs/sv_raid.md，活動團體戰）"
"consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out" = "團體戰等待的主機數量，1 到 3；大廳中集齊 N 台且全部準備完畢即開始，或大廳計時器耗盡時開始"
"an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)" = "團體戰安插的 NPC 隊友，按槽位順序，主機空出的每個槽位一名（一台主機時 2 名，兩台時 1 名，三台時沒有）：Austin、Ava、Logan、Hailey、Evan、Charlotte、Kylie、Hunter、Gianna、Eli、Henry、Chase、Claire、Brooklyn、Zoe、Samantha、Dylan、Luke；主機會抽一個安插他們的隊友種子，其餘隨機（docs/sv_raid.md，隊友）"
"the unlock stage the partners come from, which sets their pool, their level being four fifths of --raid-pokemon's; by default --raid-progress's, six stars for a black crystal or a seven-star event raid" = "隊友來自的解鎖階段，決定可選池，其等級為 --raid-pokemon 的五分之四；預設取 --raid-progress，黑色結晶或七星活動團體戰為六星"
"serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)" = "用外掛的對戰伺服器（NAME 或載入的第一個）從該站點主持團體戰對戰：主機與我們的寶可夢打一場；僅限一台主機；失敗時按未指定處理，交出網路（docs/sv_raid.md，主持對戰）"
"PROTO:PORT:HEX, a reliable data message to send once the console has joined (host seq 1 on that port, INITIALIZED); repeatable" = "PROTO:PORT:HEX，主機加入後發送的可靠資料訊息（該連接埠上主機序號為 1，INITIALIZED）；可重複"

# 高級選項：朱/紫 加入（sv-join / sv-raid-join / sv-circle-join）
"join only a console searching with this Link Code; empty takes any" = "只加入以此連接碼搜尋的主機；留空則接受任意"
"local communication id to join, hex; default is either cartridge's" = "要加入的本地通訊 ID，十六進位；預設為任一卡帶的 ID"
"join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys" = "透過 ldn_mitm 經區域網路加入一台模擬主機，而不是走無線網卡：無需 root、phy 或 prod.keys"
"--ip-join: the emulator's address" = "--ip-join：模擬器的位址"
"--ip-join: our own address" = "--ip-join：我們自己的位址"
"--ip-join: seconds to wait for one ldn_mitm scan answer" = "--ip-join：等待一次 ldn_mitm 掃描應答的秒數"
"seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it" = "掃描時每個頻道停留的秒數；主機的開放窗口只有幾秒，停留太久會錯過"
"how long to keep trying" = "持續嘗試的時長"
"how long to stay in one joined session before scanning again" = "在已加入的連線中停留多久再重新掃描"
"the LDN node name we publish" = "我們發布的 LDN 節點名稱"
"the station platform byte we publish; 1 is what a Switch 2 sends" = "我們發布的站點平台位元組；1 是 Switch 2 發送的值"
"set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back" = "關聯前設定網卡的 MAC，例如 48:f1:eb:11:22:33。Pia 從 MAC 推導站點的固定 id，兩台主機都是任天堂 OUI 而網卡不是。啟動器中的驅動重載會還原網卡自己的位址"
"join only a network of this LDN scene: 4 a Link Trade, 7 a Tera Raid" = "只加入該 LDN 場景的網路：4 為連接交換，7 為太晶團體戰"
"join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console" = "加入主機主持的太晶團體戰大廳並帶上這份隊伍記錄，需通過 PKHeX 合法性檢查；我方玩家會準備、回應開始並在對戰開始時離開，其寶可夢繼續為主機作戰"
"seconds in the raid lobby before our player readies" = "進入團體戰大廳後多少秒我方玩家準備"
"join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)" = "像加入團體戰的賓客那樣加入主機主持的聯盟圓環：入座、發送我們的身分、開啟遊戲頻道、回應主機的開始、把我們玩家放到主機玩家所在的位置並保持 --hold 時長（docs/sv_union_circle.md）"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "配合 --union-circle：任務完成後我方玩家離開圓環並結束執行：snacksworth 把主機缺少的每種點心傳說寶可夢的組隊與單人通關記錄送給主機，從開始演示結束起每秒一條；bp 則送給主機一筆 --bbq-clear BP 的通關獎勵"
"the BP, 1 to 9999999, --circle-task bp gives" = "--circle-task bp 贈送的 BP，1 到 9999999"
"with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it" = "配合 --union-circle：我方玩家模仿主機玩家的移動、動畫和坐騎，與其保持 5 米並面向它"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "配合 --union-circle：圓環開始演示結束 10 秒後，在距主機玩家 15 到 25 米處保持 3 隻該種類（dev 編號）的野生寶可夢，如同主機分享自己的野生寶可夢：被主機對戰、移除或距離超過 50 米的個體會再次出現在附近"
"Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)" = "太晶屬性，按屬性順序 0 一般到 17 妖精（預設 %(default)s）"
"held item id" = "攜帶道具 id"
"0 to 255 (default random)" = "0 到 255（預設隨機）"
"1 female (default 0)" = "1 為雌性（預設 0）"
"0 to 24 (default random)" = "0 到 24（預設隨機）"
"six IVs 0 to 31 (default each random, as a wild one's)" = "六項個體值，各 0 到 31（預設各自隨機，與野生個體相同）"
"ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)" = "特性槽位，2 為隱藏特性（預設隨機取 0 或 1，與野生個體相同）"
"the mark the spawn carries, by PKHeX's RibbonIndex (53 Lunchtime to 97 Slump; default none)" = "生成個體攜帶的證章，按 PKHeX 的 RibbonIndex（53 午餐到 97 消沉；預設無）"
"with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)" = "配合 --spawn：只當主機站在 PKHeX 認可該生成個體可捕捉的區域時才生成，區域由主機的主機分享的野生寶可夢推斷（我方玩家靠近後它才會分享：--follow-host）"
"report what the console advertises and join nothing" = "只報告主機廣播的內容，不加入任何網路"
"send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one" = "以零售版版面發送 Pia Session 加入請求（docs/sv.md，Session 加入請求）：十個協定及其版本、一個四位元組 nonce、兩個位置 id、一個七位元組站點位址和一條玩家記錄。網狀加入是單播，被動抓包看不到零售版的請求"
"after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here" = "入座後，在 0x81 連接埠 1（我們的站點流）上發送這條 1395 位元組身分記錄作為遊戲的資料交換，重傳直到主機確認。零售加入者在此發送自己的身分"
"do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers" = "不發送克隆時鐘請求。已入座的加入者會先在其他一切之前在 0x77 上發送十八個零位元組，由主機回應"
"announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)" = "在 0x7c 上通告我們自己的頻道表。站點透過發送對端在連接埠 1 發出的同款 31 位元組表、連接埠 2 的開啟以及之後每次表更新的鏡像來開啟遊戲頻道；只有我們通告之後，對端才會在連接埠 0 上把資料交給遊戲（docs/sv.md）"
"send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference" = "在 0x81 連接埠 1 上按序號順序把該目錄的記錄作為我們自己的發送，取代 --mirror-records，這樣可以重播整套真實身分，而不是把主機的鏡像回去；預設使用 pokeldn.sv.reference 中錄製的記錄集"
"send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed" = "把主機放到 0x81 連接埠 0 的每條記錄按順序在連接埠 1 上作為我們自己的發回。零售加入者會用自己的一套記錄回應主機的記錄；這裡用遊戲自己編寫的記錄來填滿這套"
"seconds after the seat before the first identity record goes out" = "入座後多少秒再發出第一條身分記錄"
"do not acknowledge the host's messages on the game's reliable channel 0x7c" = "不確認主機在遊戲可靠頻道 0x7c 上的訊息"
"send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)" = "隨頻道表直接發送遊戲在 0x7c 連接埠 2 上的 3 型加入，而不是等主機在 0x80 連接埠 2 上的 7 型通告再回應。成對的加入者會回應通告（docs/sv.md，連接埠 2）"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主機於 0x7c 連接埠 1 通告金鑰 0x80 開啟後指定秒數發送。站點的身分是 0x7c 連接埠 0 上的四條訊息（兩個片段各兩次），在通告之前從該連接埠發出的任何內容都到不了遊戲；可重複；預設為 pokeldn.sv.reference 中的身分片段"
"a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本加入者提供的 348 位元組記錄的檔案（原始位元組或十六進位文字；352 位元組的遊戲訊息會剝去標頭）。指定後，加入者用自己的報價回應主機的報價、確認、提交，並像成對加入者一樣跟隨四個交換步驟（pokeldn.sv.trade）。可重複：第二份及之後的記錄在同一座位中提供，每次交換一份，隨每次交換結束"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存前寫入所提供記錄的欄位，使用 pokeldn.sv.pokemon 的欄位名：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重複，單獨的 `shiny` 會按記錄自身的 id 隨機出一個異色性格值"
"a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text" = "把主機自己的報價寫入此檔案，即其 80 00 02 00 訊息的 348 位元組本文，以十六進位文字保存"
"seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer" = "在主機金鑰 0x80 開啟後多少秒由加入者先報價；不指定時加入者回應主機的報價"
"seconds after the host's confirmation before the joiner's own" = "主機確認後多少秒加入者再確認"
"seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind" = "主機確認後多少秒加入者提交；成對的加入者在自己確認 1.5 秒後提交，其主機也以同樣方式回應"
"end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold" = "主機超過這麼多秒完全沒有發送任何內容時結束該座位並回到掃描。在主機開放階段之外建立的關聯不會有流量；不設此項時執行會一直佔滿整個 --hold 時長"
"end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold" = "在主機要求我們接管主持角色（Session 7 型）這麼多秒後結束座位並回到掃描。實測中發出該請求的主機之後只發送 NetStartHostMigration；不設此項時執行會一直佔座到 --hold 結束"
"hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s" = "收到主機的 NetStartHostMigration（Net 0x40）後仍保持座位。預設加入者在收到第一個時離開：主機正在銷毀其網路，會重發直到所有用戶端離開，最長 4 秒"
"end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s" = "入座後超過這麼多秒主機仍未在 0x80 連接埠 2 上通告時結束座位並回到掃描。座位可以把每條流走完卻始終沒有通告（docs/sv.md，未解之謎）；開發板上完成交換的座位分別在 5.8 和 7.7 秒時通告"
"when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration" = "當主機在通告前把主持角色交給我們（並非玩家離開）時，離開其網路並以相同頻道和連接碼用 bin/sv_host.py 成為主機，如同 bin/pla_join.py；需要 --answer-migration"
"answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over" = "用 8 型確認回應主機的 7 型帶主持遷移的離開，告知它我們接受其移交的主持角色"
"do not answer a Session type-5 station update with the type 6" = "不用 6 型回應 Session 5 型站點更新"
"hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)" = "入座後等待這麼久再發送 Session 加入請求。WaitMember（3 到 4 秒）結束仍無人加入的主機會帶著主持遷移離開，因此在它的離開等待中被接受的加入會引發 7 型訊息（docs/sv.md，什麼決定座位）"
"with --session-join, re-send it every N seconds (0 sends it once)" = "配合 --session-join：每 N 秒重發一次（0 表示只發一次）"
"the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)" = "加入請求中的 16 位元組玩家 id：'arceus'（1 後跟 0，作為兩個大端 u64，即零售阿爾宙斯聲明的值）、'random'、'high'（以 0xff 開頭的隨機值）或 32 位十六進位數。朱主機自己的是 10047bd4a25543e057cee5c71ab1f2a2（sv18）"
"the player name in the join request's one player record; a retail console's is a single space" = "加入請求中那條玩家記錄裡的玩家名字；零售主機的是一個空格"
"the message flags on the join request; a joining Arceus sends 0x01, skip the source check, on every repeat of it" = "加入請求的訊息旗標；加入的阿爾宙斯在每次重發中都發送 0x01，跳過來源檢查"
"the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own" = "加入請求封包標頭中的目標變數 id：0（加入的阿爾宙斯所用），或主機自己的 id"
"answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)" = "用 0x12 確認回應主機的 Net 0x11。零售加入者不回應，而該確認會讓主機轉而請求主持遷移（sv08）"
"seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own" = "允許關聯本身耗費的秒數；主機開放階段在連線中途結束時，ldn.connect 會一直阻塞且自身沒有逾時"
"seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join" = "加入回應之後（未用 --session-join 時為入座之後）多少秒再發出十一個確認和兩個流開啟；零售加入者在加入 0.75 秒後開啟"
"seconds between our own RTT requests (0 sends none)" = "我們自己 RTT 請求的間隔秒數（0 表示不發送）"
"answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)" = "延遲 SECONDS 秒再回應每個 RTT 請求；RTT 樣本供主機的重傳計時器使用（docs/sv.md）"
"acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)" = "對已經持有的記錄，每條流每 SECONDS 秒至多確認一次；新記錄立即確認。0 表示每次都確認（docs/sv.md）"
"ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)" = "確認收到最高 id 的下一個號，不帶遮罩，而不是像零售站點那樣確認連續段加遮罩（docs/sv.md）"
"the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body" = "我們批次確認上的 Pia 訊息旗標；0xa0 是兩台零售站點發送的值，第 5 位壓縮訊息本文"
"entries in the ack payload; a retail station sends four" = "確認負載中的條目數；零售站點發送四條"
"the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header" = "可靠標頭的目標位元；3 會加上零售站點發送的四位元組點陣圖，0 則保留九位元組標頭"
"rotate every combination of --ack-flags, --ack-entries and --ack-dest-bits through the seat, one per --ack-sweep-period, and print each as it goes live. One seat then says which shape the guest parses" = "在座位中輪換 --ack-flags、--ack-entries 和 --ack-dest-bits 的每種組合，每個 --ack-sweep-period 切換一種並在生效時列印。這樣一個座位就能看出對方能解析哪種形態"
"seconds each sweep variant stays live" = "每種輪換形態生效的秒數"
"seconds between the periodic bulk acks on every stream the host uses" = "在主機使用的每條流上，週期性批次確認的間隔秒數"
"send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer" = "發送到主機位址而不是 LDN 廣播位址。兩台零售站點都會廣播每個 Pia 封包（sv11），廣播無需對端的 ARP 解析"
"print the RTT traffic too" = "也列印 RTT 流量"
"with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way" = "配合 --union-circle：也列印我們發送的每條圓環訊息和區域搜尋的每一步；無論是否列印，--capture 檔案都會記錄這些步驟"
