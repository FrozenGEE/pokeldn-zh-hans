"Read your Trainer ID (TID), Secret ID (SID), or your party's stats in the Session log. The TID appears on your Trainer Card; the SID is normally hidden. IVs are a Pokemon's six individual stat values, from 0 to 31. EVs are stat points gained through training. These tools keep your save and Wonder Card unchanged." = "在會話日誌中讀取你的訓練家 ID（TID）、裡ID（SID）或隊伍的能力值。TID 顯示在訓練家卡上；SID 通常隱藏。個體值是寶可夢六項能力各自的數值，範圍為 0 到 31。努力值是透過訓練獲得的點數。這些工具不會改動你的存檔和神秘卡片。"
"Stand facing it and press A yourself. At its cry, touch no button: the game presses A by itself on a shiny frame and the battle starts. If the countdown passes 0, wait for the next one. Do not walk or battle first: a wild battle stops the presses until you send it again" = "面對它站立並自己按下 A。聽到它的叫聲後不要再按任何按鍵：遊戲會在異色幀自動按下 A，對戰隨即開始。若倒數計時越過 0，請等待下一次。不要先走動或對戰：野生對戰會停止自動按鍵，直到你重新傳送。"
"Stand in front of it. Once the map shows after the recap, tap Up once to face it, then hold B. The game presses A by itself on a shiny frame; if the countdown passes 0 with nothing, keep holding B for the next one" = "站在它面前。回顧結束後地圖出現時，向上點一次以面向它，然後按住 B。遊戲會在異色幀自動按下 A；若倒數計時越過 0 仍無結果，請繼續按住 B 等待下一次。"
". This can take a few minutes" = "。這可能需要幾分鐘"

